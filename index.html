<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eceef3; --surface-3:#e2e5ec;
  --line:#dadee6; --line-strong:#c4c9d4;
  --text:#161a22; --muted:#5b6272; --faint:#8a91a0;
  --accent:#0b7f93; --accent-ink:#ffffff; --accent-soft:#dff2f5;
  --side-bg:var(--surface);
  --st-not:#7d8596; --st-prog:#2f73e8; --st-review:#8b5cf6; --st-rev:#e07b00; --st-done:#2b9348; --st-client:#0b7f93; --st-wait:#c2417a; --st-drop:#9aa0a8;
  --danger:#d9362b; --danger-soft:#fde8e6; --warn:#b86b00;
  --shadow:0 1px 2px rgba(22,26,34,.06),0 4px 16px rgba(22,26,34,.06);
  --shadow-lg:0 12px 40px rgba(22,26,34,.18);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tsu:1;--ts:var(--tsu);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1015; --surface:#161920; --surface-2:#1d2129; --surface-3:#262b35;
    --line:#282d38; --line-strong:#363c49;
    --text:#e6e8ee; --muted:#9aa1b0; --faint:#6d7483;
    --accent:#2fb8cc; --accent-ink:#06191d; --accent-soft:#12303a;
    --st-not:#8b93a3; --st-prog:#5b9bff; --st-review:#a98bff; --st-rev:#ffa53d; --st-done:#4cc26f; --st-client:#2fb8cc; --st-wait:#ef6fa8; --st-drop:#6d7483;
    --danger:#ff6b5e; --danger-soft:#3a1c1a; --warn:#ffb14d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1015; --surface:#161920; --surface-2:#1d2129; --surface-3:#262b35;
  --line:#282d38; --line-strong:#363c49;
  --text:#e6e8ee; --muted:#9aa1b0; --faint:#6d7483;
  --accent:#2fb8cc; --accent-ink:#06191d; --accent-soft:#12303a;
  --st-not:#8b93a3; --st-prog:#5b9bff; --st-review:#a98bff; --st-rev:#ffa53d; --st-done:#4cc26f; --st-client:#2fb8cc; --st-wait:#ef6fa8; --st-drop:#6d7483;
  --danger:#ff6b5e; --danger-soft:#3a1c1a; --warn:#ffb14d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
}
/* dark mode shade (Settings → Appearance): data-dark="dim" | "black" on <html>, only while dark */
:root[data-theme="dark"][data-dark="dim"]{--bg:#1c1f25;--surface:#24282f;--surface-2:#2b3038;--surface-3:#343a44;--line:#373d48;--line-strong:#48505d}
:root[data-theme="dark"][data-dark="black"]{--bg:#000000;--surface:#0b0c0f;--surface-2:#131519;--surface-3:#1b1e24;--line:#1f232a;--line-strong:#2d323b}
@media (prefers-color-scheme: dark){
  :root[data-dark="dim"]:not([data-theme="light"]){--bg:#1c1f25;--surface:#24282f;--surface-2:#2b3038;--surface-3:#343a44;--line:#373d48;--line-strong:#48505d}
  :root[data-dark="black"]:not([data-theme="light"]){--bg:#000000;--surface:#0b0c0f;--surface-2:#131519;--surface-3:#1b1e24;--line:#1f232a;--line-strong:#2d323b}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:calc(14px*var(--ts))/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:calc(12px*var(--ts));font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sidew,252px) minmax(0,1fr);min-height:100vh}
.side-resize{position:fixed;top:0;bottom:0;left:calc(var(--sidew,252px) - 5px);width:10px;cursor:col-resize;z-index:12;touch-action:none}
.side-resize::after{content:"";position:absolute;left:4px;top:50%;width:2px;height:44px;margin-top:-22px;border-radius:2px;background:var(--line-strong);opacity:0;transition:opacity .15s}
.side-resize:hover::after,.side-resize.drag::after{opacity:1}
body.side-mini .side-resize{display:none}
body.resizing-side{cursor:col-resize;user-select:none}
@media (max-width:820px){.side-resize{display:none}}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--side-bg);display:flex;flex-direction:column;gap:18px;padding:18px 12px}
:root[data-scheme] .side{--text:#fff;--muted:rgba(255,255,255,.78);--faint:rgba(255,255,255,.58);--line:rgba(255,255,255,.16);--surface-2:rgba(255,255,255,.1);--accent-soft:rgba(255,255,255,.2);--surface:rgba(255,255,255,.08);border-right-color:transparent;color:var(--text)}
:root[data-scheme] .side .brand-logo.def{background:#fff;border-radius:7px;padding:2px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
button.brand{border:0;background:none;text-align:left;border-radius:8px;min-width:0;padding-block:4px;margin-block:-4px}
button.brand:hover b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--text);display:grid;place-items:center}
.brand-mark span{display:block;width:12px;height:12px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 30%,transparent)}
.brand-logo{width:26px;height:26px;border-radius:7px;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--surface)}
.brand-logo.def{border:0;background:none;border-radius:0;object-fit:contain}
.brand b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font:700 calc(19px*var(--ts))/1 var(--display);letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:calc(11px*var(--ts));font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:8px 10px 6px;display:flex;align-items:center;justify-content:space-between}
.nav-label button{border:0;background:none;color:var(--muted);padding:2px;border-radius:5px;display:grid}
.nav-label button:hover{background:var(--surface-2);color:var(--text)}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;color:var(--text);font-weight:500;min-width:0}
.nav-item:hover{background:var(--surface-2)}
.nav-item.on{background:var(--accent-soft);color:var(--text)}
.nav-item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .count{font:500 calc(11px*var(--ts)) var(--mono);color:var(--faint)}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.nav-row{position:relative}
.nav-row .edit{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:26px;height:26px;opacity:0}
.nav-row:hover .edit,.nav-row .edit:focus-visible{opacity:1}
.nav-row:hover .nav-item .count{visibility:hidden}
.job-wrap{position:relative;display:flex;min-width:0}
.job-wrap .job-card{flex:1}
.job-wrap .edit{position:absolute;top:10px;right:10px}
@media (hover:none){.nav-row .edit{opacity:1}.nav-row .nav-item .count{visibility:hidden}}
.nav-sub{display:flex;flex-direction:column;gap:1px;margin:1px 0 4px 18px;padding-left:10px;border-left:1px solid var(--line)}
.nav-sub .nav-item{padding:5px 10px;font-weight:400;color:var(--muted);font-size:calc(13px*var(--ts))}
.nav-sub .nav-item.on{color:var(--text);font-weight:600}
.side-foot{margin-top:auto;padding:4px 0 0;font-size:calc(12px*var(--ts));color:var(--faint);display:flex;flex-direction:column;align-items:stretch;gap:4px;border-top:1px solid var(--line)}
.side-foot .save-state{padding:8px 10px 2px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--st-done)}
.sync-dot.local{background:var(--warn)}

.main{min-width:0;padding:22px 28px 60px;display:flex;flex-direction:column;gap:18px}

/* ---------- banner / header ---------- */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface);color:var(--muted);font-size:calc(13px*var(--ts))}
.banner p{margin:0;flex:1;min-width:220px}
.head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px}
.head-title{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px}
.head h1{margin:0;font:700 calc(28px*var(--ts))/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance;display:flex;align-items:center;gap:10px}
.head h1 .dot{width:14px;height:14px;border-radius:4px}
.head .sub{color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:calc(11px*var(--ts));font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tool{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-decoration:none;min-width:0}
.tool .tool-txt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;text-align:left}
.tool .tool-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--tc);color:#fff}
.tool-ic.plain{background:var(--surface-2);color:var(--muted)}
.tool-ic .i{width:17px;height:17px}
.tool .tool-ic svg{color:inherit}
.tool small{font-size:calc(10.5px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tool span{font-weight:600;display:flex;align-items:center;gap:5px}
a.tool:hover{border-color:var(--accent)}
a.tool svg{color:var(--faint)}
.client-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:-4px}
.client-tabs button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.client-tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.client-tabs button:hover{color:var(--text)}
.client-tabs .add{color:var(--accent)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;font-size:calc(13px*var(--ts));white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 8px;font-size:calc(12px*var(--ts))}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border:0;background:none;border-radius:7px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 13px;text-align:left;display:flex;flex-direction:column;gap:2px}
button.stat:hover{border-color:var(--line-strong)}
.stat.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stat small{font-size:calc(11px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat b{font:700 calc(24px*var(--ts))/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat.alert b{color:var(--danger)}
.stat.warn b{color:var(--st-rev)}

/* ---------- job cards ---------- */
.jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.job-card h3{padding-right:30px}
.job-card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.job-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.job-card h3{margin:0;font:700 calc(16px*var(--ts))/1.2 var(--display);display:flex;align-items:center;gap:8px}
/* Overview job cards stay compact: type/tools and schedule live in the job's Details tab */
.jobs-grid .job-card .jm-type,.jobs-grid .job-card .when,.head .sub-tail{display:none}
.job-card h3 .jn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-card .meta{color:var(--muted);font-size:calc(12.5px*var(--ts))}
.stack{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2);gap:1px}
.stack i{display:block;height:100%}
.job-card .next{font-size:calc(12.5px*var(--ts));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-card .next b{color:var(--text);font-weight:600}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-block:-8px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 10px;flex:1;min-width:160px;max-width:340px;color:var(--faint)}
.search input{border:0;background:none;outline:none;padding:7px 0;width:100%;color:var(--text)}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-size:calc(13px*var(--ts));font-weight:500;max-width:100%}
.toolbar .spacer{flex:1}
.restore-box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.details-head{display:flex;justify-content:flex-end;margin-bottom:10px}
.h1-edit{width:30px;height:30px;color:var(--faint)}
.h1-edit:hover{color:var(--text)}
.head h1 > span{min-width:0;overflow-wrap:anywhere}
#subnav:empty{display:none}
#subnav .pane-tabs{margin-top:0}
.d-h{margin:4px 0 8px;font:700 calc(14px*var(--ts)) var(--display);color:var(--muted)}
.details-head + .d-h{margin-top:0}
#view .tools{margin-bottom:14px}
.filters{display:contents}
.filter-btn{display:none;position:relative;padding:6px 9px}
.fdot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.filter-sheet{position:fixed;inset:0;z-index:45;background:rgba(10,12,16,.35);display:flex;align-items:flex-end;justify-content:center}
.filter-sheet[hidden]{display:none}
.fs-card{background:var(--surface);width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-lg)}
.fs-head{display:flex;align-items:center;justify-content:space-between}
.fs-head b{font:700 calc(16px*var(--ts)) var(--display)}
#fs-slot .filters{display:flex;flex-direction:column;gap:8px}
#fs-slot .sel{width:100%;padding:9px 10px;font-size:calc(14px*var(--ts))}
.fs-foot{display:flex;justify-content:space-between;gap:8px}
.d-draft{display:flex;align-items:center;gap:8px;padding:8px 18px;background:var(--accent-soft);font-size:calc(13px*var(--ts));position:sticky;top:0;z-index:2}
.d-draft span{color:var(--muted)}
.d-save{position:sticky;bottom:0;background:var(--surface);justify-content:flex-end;padding:12px 0 4px;margin-top:-4px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--text);color:var(--bg);font:600 calc(12px*var(--ts))/1.3 var(--body);padding:5px 8px;border-radius:6px;max-width:260px;box-shadow:var(--shadow);white-space:normal}
.mtop{display:none}
.side-scrim{display:none}
.brand-panel{border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden}
.bp-head h2{margin:0;font:700 calc(17px*var(--ts)) var(--display);display:flex;align-items:center;gap:8px}
.pane-tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line)}
.pane-tabs button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:calc(14px*var(--ts))}
.pane-tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.pane-tabs button:hover{color:var(--text)}
.pane-tabs + .client-tabs{margin-top:6px;border-bottom:0}
.brand-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.brand-card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bc-top{display:flex;align-items:center;gap:9px;font-size:calc(15px*var(--ts))}
.bc-sw{display:flex;gap:4px}
.bc-sw i{width:22px;height:22px;border-radius:5px;border:1px solid var(--line)}
.brand-card small{color:var(--faint);font-size:calc(12px*var(--ts))}
.bc-acts{display:flex;gap:6px;margin-top:auto}
.bp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px}
.brand-panel .bv{border-top:1px solid var(--line);padding:14px}
.bv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px 18px}
.bv.compact{grid-template-columns:1fr;gap:10px;padding-top:8px}
.bv-sec h5{margin:0 0 5px;font-size:calc(10.5px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.bv-sec p{margin:0;font-size:calc(13.5px*var(--ts));line-height:1.5}
.bv-colors{display:flex;flex-wrap:wrap;gap:6px}
.swatch{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px 4px 4px;text-align:left}
.swatch:hover{border-color:var(--accent)}
.swatch i{width:24px;height:24px;border-radius:5px;border:1px solid var(--line);flex:none}
.swatch span{display:flex;flex-direction:column;line-height:1.2}
.swatch b{font-size:calc(12.5px*var(--ts))}
.swatch small{font:500 calc(11px*var(--ts)) var(--mono);color:var(--muted)}
.bv-fonts{display:flex;flex-direction:column;gap:4px;font-size:calc(13.5px*var(--ts));font-weight:600}
.bv-fonts small{display:block;font-size:calc(11px*var(--ts));font-weight:500;color:var(--muted)}
.bv-dd{display:grid;grid-template-columns:1fr 1fr;gap:14px;grid-column:1/-1}
.bv.compact .bv-dd{grid-template-columns:1fr}
.bv-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:calc(13.5px*var(--ts))}
.bv-list li{padding-left:22px;position:relative;line-height:1.4}
.bv-list li::before{position:absolute;left:0;top:0;font-weight:700}
.bv-list.do li::before{content:"✓";color:var(--st-done)}
.bv-list.dont li::before{content:"✕";color:var(--danger)}
.bv-links{display:flex;flex-wrap:wrap;gap:6px}
.bv-links .btn{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bv-foot{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 14px;font-size:calc(12px*var(--ts));color:var(--faint)}
.bv-log summary{cursor:pointer;color:var(--muted);font-weight:600}
.bv-log ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.bv-log b{color:var(--text);font-weight:600;margin-right:4px}
.d-brand{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.d-brand summary{cursor:pointer;margin:0;list-style:revert}
.d-brand-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.brand-modal{width:min(760px,100%)}
.brand-modal h2{display:flex;align-items:center;gap:8px}
.brand-modal label{display:flex;flex-direction:column;gap:4px;font-size:calc(12px*var(--ts));font-weight:600;color:var(--muted);min-width:0}
.brand-modal input[type=text],.brand-modal input[type=url],.brand-modal textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:calc(13px*var(--ts));font-weight:400;color:var(--text);width:100%}
.brand-modal textarea{resize:vertical;line-height:1.45}
.bm-colors,.bm-pdfs{display:flex;flex-direction:column;gap:6px}
.bm-color{display:grid;grid-template-columns:40px 110px minmax(0,1fr) auto;gap:6px;align-items:center}
.bm-color input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--surface)}
.bm-pdf{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:calc(13px*var(--ts))}
.bm-pdf span{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm-pdf small{color:var(--faint);font-size:calc(11.5px*var(--ts))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:5px 10px;border-radius:7px;color:var(--muted);font-weight:600;font-size:calc(13px*var(--ts))}
.seg button.on{background:var(--surface-3);color:var(--text)}
.work{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.work-item{box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.work-item{background:var(--surface);padding:10px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.work-item small{font-size:calc(10.5px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.work-item b{font-weight:600;font-size:calc(14px*var(--ts))}
.work-item span{font-size:calc(12.5px*var(--ts));color:var(--muted)}
.work-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.work-notes{border-top:1px solid var(--line)}
.work-notes span{white-space:pre-wrap;color:var(--text);font-size:calc(13px*var(--ts))}
.work-empty{margin-top:12px;border:1px dashed var(--line-strong);background:none;border-radius:10px;padding:9px 12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:calc(13px*var(--ts))}
.work-empty:hover{color:var(--text);border-color:var(--accent)}
.job-card .when{font-size:calc(12.5px*var(--ts));color:var(--muted);display:flex;align-items:center;gap:6px}
.work-form{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px}
.wf-row{display:flex;flex-direction:column;gap:6px}
.wf-lbl,.wf-grid label,.wf-notes{font-size:calc(12px*var(--ts));font-weight:600;color:var(--muted)}
.wf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.wf-grid label,.wf-notes{display:flex;flex-direction:column;gap:4px;min-width:0}
.wf-grid input,.wf-grid select,.wf-notes textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:calc(13px*var(--ts));width:100%;font-weight:400;color:var(--text);min-width:0}
.wf-notes textarea{resize:vertical;line-height:1.45}
.wf-grid .hint{font-weight:400}
.pay-row{display:flex;gap:6px}
.work-form .pay-row select{width:auto;flex:none}
.work-form .pay-row input{flex:1;width:auto}
.day-pick{display:flex;gap:4px;flex-wrap:wrap}
.day-pick button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;font-size:calc(12.5px*var(--ts));font-weight:600;color:var(--muted)}
.day-pick button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.btn[disabled]{opacity:.5;cursor:default}
.load-warn{display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-size:calc(12.5px*var(--ts));font-weight:600;margin:0}
.load-warn svg{flex:none}
.day.busy{background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.busy-tag{display:inline-flex;align-items:center;gap:2px;margin-left:auto;margin-right:4px;color:var(--warn);font:700 calc(11px*var(--ts)) var(--mono)}
.busy-tag svg{width:12px;height:12px}
.limit-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:calc(13.5px*var(--ts))}
.limit-row input{width:64px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.head-row{display:flex;align-items:flex-start;gap:14px 20px}
.head-row #head{flex:1;min-width:0}
.top-right{display:flex;align-items:center;gap:8px;flex:0 1 350px;justify-content:flex-end;min-width:0}
.top-search{flex:1 1 300px;min-width:180px;padding-block:1px}
.bell-wrap{position:relative;flex:none}
.bell{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:9px;position:relative}
.bell.has{color:var(--text)}
.bell-n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font:700 calc(11px*var(--ts))/18px var(--body);text-align:center}
.notes-pop{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 32px));max-height:min(520px,70vh);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);z-index:25}
.notes-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.notes-head b{font:700 calc(15px*var(--ts)) var(--display)}
.note{display:flex;align-items:flex-start;gap:4px;border-top:1px solid var(--line);padding-right:6px}
.note:first-child{border-top:0}
.note-main{flex:1;min-width:0;display:flex;gap:10px;align-items:flex-start;border:0;background:none;text-align:left;padding:10px 6px 10px 12px}
.note-main:hover{background:var(--surface-2)}
.note-main > svg{margin-top:2px;color:var(--faint)}
.note-main > span{display:flex;flex-direction:column;gap:2px;min-width:0}
.note-main b{font-weight:600;font-size:calc(13px*var(--ts));line-height:1.35}
.note-main span span{font-size:calc(12.5px*var(--ts));color:var(--muted)}
.note-main small{font-size:calc(11.5px*var(--ts));color:var(--faint)}
.note.unread .note-main b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.note.danger .note-main > svg{color:var(--danger)}
.note.warn .note-main > svg{color:var(--warn)}
.note .icon-btn{width:26px;height:26px;margin-top:8px;flex:none}
.notes-empty{margin:0;padding:18px 14px;color:var(--muted);font-size:calc(13px*var(--ts))}

/* ---------- status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:calc(12px*var(--ts));font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--text))}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
/* status style (Settings → Appearance): data-pill on <html>; .pill-demo[data-ps] are the previews in Settings */
:root[data-pill="solid"] .pill:not(.pill-demo),.pill.pill-demo[data-ps="solid"]{background:var(--c);color:#fff}
:root[data-pill="solid"] .pill:not(.pill-demo)::before,.pill.pill-demo[data-ps="solid"]::before{background:rgba(255,255,255,.85)}
:root[data-pill="outline"] .pill:not(.pill-demo),.pill.pill-demo[data-ps="outline"]{background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 70%,transparent)}
:root[data-pill="dot"] .pill:not(.pill-demo),.pill.pill-demo[data-ps="dot"]{background:transparent;color:var(--text);padding-left:2px;padding-right:2px}
:root[data-pill="dot"] select.pill:not(.pill-demo){color:color-mix(in srgb,var(--c) 85%,var(--text));padding-left:0}
.st-not_started{--c:var(--st-not)} .st-in_progress{--c:var(--st-prog)} .st-internal_review{--c:var(--st-review)} .st-revisions{--c:var(--st-rev)} .st-done{--c:var(--st-done)} .st-client_review{--c:var(--st-client)} .st-waiting_client{--c:var(--st-wait)} .st-dropped{--c:var(--st-drop)}
select.pill{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;padding-right:10px;max-width:100%}
select.pill::before{display:none}

/* ---------- list view ---------- */
.group{display:flex;flex-direction:column}
.group + .group{margin-top:14px}
.group-head{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 2px;text-align:left}
.group-head svg{color:var(--faint);transition:transform .15s}
.group-head.open svg{transform:rotate(90deg)}
.group-head .count{font:500 calc(12px*var(--ts)) var(--mono);color:var(--faint)}
.rows{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.rows{--w0:36px}
.row,.row-head{display:grid;grid-template-columns:var(--cols,var(--w0) minmax(0,1fr) 180px 84px 84px 84px 120px);align-items:center;gap:12px;padding:8px 12px}
.rows.h-prio .c-prio,.rows.h-start .c-start,.rows.h-links .c-links{display:none}
.row-head{font-size:calc(11px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding-block:6px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.row{border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row-head + .row{border-top:0}
.row:hover{background:var(--surface-2)}
.row.focus{background:var(--accent-soft)}
.tmark{position:relative;width:36px;height:36px;border-radius:26%;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--faint);flex:none}
.tmark .i{width:18px;height:18px}
.tmark img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--surface)}
.crumb .tmark{width:22px;height:22px}
.crumb .tmark .i{width:13px;height:13px}
.card-top{display:flex;align-items:flex-start;gap:9px}
.card-top .tmark{width:30px;height:30px}
.card-top .tmark .i{width:15px;height:15px}
.t-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.t-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done-row .t-name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:calc(12px*var(--ts));align-items:center}
.t-meta .jobtag{display:inline-flex;align-items:center;gap:5px}
.t-meta .jobtag .dot{width:7px;height:7px;border-radius:2px}
.chip{font:500 calc(11px*var(--ts)) var(--mono);padding:1px 5px;border-radius:4px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.rev{color:var(--st-rev);border-color:color-mix(in srgb,var(--st-rev) 40%,transparent);background:color-mix(in srgb,var(--st-rev) 10%,transparent)}
.date{font:500 calc(12px*var(--ts)) var(--mono);color:var(--muted);white-space:nowrap}
.date.over{color:var(--danger)}
.date.soon{color:var(--warn)}
.date.none{color:var(--faint)}
.prio{display:inline-flex;align-items:center;gap:5px;font-size:calc(12px*var(--ts));font-weight:600;color:var(--muted)}
.prio.urgent{color:var(--danger)} .prio.high{color:var(--st-rev)} .prio.low{color:var(--faint)}
.links{display:flex;gap:2px}
.links a,.links span{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--line-strong)}
.links a{color:var(--accent)}
.links a:hover{background:var(--accent-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{margin:0;font:700 calc(18px*var(--ts)) var(--display);color:var(--text)}

/* ---------- board ---------- */
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,1fr);gap:10px;min-width:min-content}
.col{background:var(--surface-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:180px;border:1px solid transparent}
.col.drag{border-color:var(--accent);background:var(--accent-soft)}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 4px;min-width:0}
.col-head .pill,.group-head .pill{min-width:0;flex:0 1 auto;max-width:100%}
.pill::before{flex:none}
.stat small{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pill .pl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.col-head .count{flex:none}
.col-head .count{font:500 calc(12px*var(--ts)) var(--mono);color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px;cursor:grab;text-align:left}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card.dragging{opacity:.4}
.card .t-name{white-space:normal}
.card-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;min-width:0}
.card-foot .date{white-space:nowrap}
.card-foot .links{margin-left:auto}

/* ---------- calendar ---------- */
.cal-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-bar h2{margin:0 8px 0 0;font:700 calc(18px*var(--ts)) var(--display)}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px;min-width:700px}
.cal .dow{background:var(--surface-2);padding:6px 8px;font-size:calc(11px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.day{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;position:relative}
.day.out{background:var(--surface-2)}
.day.out .dn{color:var(--faint)}
.day .dn{font:500 calc(12px*var(--ts)) var(--mono);color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.day.today .dn b{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 5px}
.day .dn b{font-weight:500}
.ev{display:flex;align-items:center;gap:5px;border:0;text-align:left;font-size:calc(12px*var(--ts));font-weight:600;padding:3px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--text);border-left:3px solid var(--c);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;width:100%}
.ev span{overflow:hidden;text-overflow:ellipsis}
[data-caldrag]{cursor:grab}
[data-caldrag].dragging{opacity:.45}
.day.cal-drop,.wday.cal-drop{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.ev.is-done span{text-decoration:line-through;color:var(--muted)}
.more{font-size:calc(11px*var(--ts));color:var(--muted);padding-left:4px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow-lg);overflow-y:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-top{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.d-top .crumb{flex:1;min-width:0;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:calc(13px*var(--ts));overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.d-body{padding:18px;display:flex;flex-direction:column;gap:18px}
.d-name{width:100%;border:1px solid transparent;background:none;font:700 calc(26px*var(--ts))/1.2 var(--display);letter-spacing:-.01em;padding:4px 6px;margin:-4px -6px;border-radius:7px;resize:none;overflow:hidden}
.d-name:hover{border-color:var(--line)}
.d-name:focus{outline:none;border-color:var(--accent);background:var(--surface-2)}
.props{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;align-items:center}
.props > label,.props > .lbl{color:var(--muted);font-size:calc(13px*var(--ts));display:flex;align-items:center;gap:7px}
.props select,.props input[type=date],.props input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:calc(13px*var(--ts));width:100%;max-width:260px}
.props .pair{display:flex;gap:8px;flex-wrap:wrap}
.props .pair > *{flex:1;min-width:110px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--surface);width:30px;height:30px;font-size:calc(16px*var(--ts));color:var(--muted)}
.stepper button:hover{background:var(--surface-2);color:var(--text)}
.stepper output{min-width:44px;text-align:center;font:500 calc(13px*var(--ts)) var(--mono)}
.fmt-pick{display:flex;gap:4px;flex-wrap:wrap}
.fmt-pick button{border:1px solid transparent;background:var(--surface-2);border-radius:999px;padding:5px 11px;font:600 calc(12px*var(--ts)) var(--mono);color:var(--muted)}
.fmt-pick button:hover{color:var(--text);border-color:var(--line-strong)}
.fmt-pick button.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:color-mix(in srgb,var(--accent) 80%,var(--text));border-color:transparent}
.section-title{font-size:calc(11px*var(--ts));font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.link-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:end}
.link-row + .link-row{margin-top:10px}
.link-row label{display:flex;flex-direction:column;gap:4px;font-size:calc(12.5px*var(--ts));color:var(--muted);font-weight:500}
.link-row label span{display:flex;align-items:center;gap:6px}
.link-row input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:calc(13px*var(--ts));width:100%;color:var(--text)}
.link-row .acts{display:flex;gap:2px}
.link-row .acts a.off{pointer-events:none;opacity:.35}
.link-row .path-hint{grid-column:1/-1;margin:0}
.links .lbtn{border:0;background:none;padding:0;display:grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--accent);cursor:pointer}
.links .lbtn:hover{background:var(--accent-soft)}
button.tool{font:inherit;color:inherit;text-align:left;cursor:pointer}
button.tool:hover{border-color:var(--accent)}
button.tool svg{color:var(--faint)}
.steps{margin:8px 0;padding-left:20px;font-size:calc(13px*var(--ts));color:var(--text);display:flex;flex-direction:column;gap:6px;line-height:1.5}
.copy-code{font-family:var(--mono);font-size:calc(12px*var(--ts));background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;user-select:all}
.checklist{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px}
.check:hover{background:var(--surface-2)}
.check input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none}
.check .txt{flex:1;min-width:0;border:0;background:none;padding:3px 0;outline:none}
.check.done .txt{text-decoration:line-through;color:var(--muted)}
.check .icon-btn{width:24px;height:24px;opacity:0}
.check:hover .icon-btn,.check .icon-btn:focus-visible{opacity:1}
.check-add{display:flex;gap:8px;align-items:center;padding:4px 6px;color:var(--faint)}
.check-add input{flex:1;border:0;background:none;outline:none;padding:4px 0;color:var(--text)}
.progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:6px}
.progress i{display:block;height:100%;background:var(--st-done)}
/* notes: formatted view + formatting toolbar */
.notes-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.notes-head .section-title{margin:0}
.notes-tools{display:flex;gap:2px;margin-left:auto}
.notes-tools button{min-width:28px;height:28px;border:0;background:none;border-radius:6px;color:var(--muted);font:600 calc(13px*var(--ts)) var(--body);display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.notes-tools button:hover{background:var(--surface-2);color:var(--text)}
.notes-tools .i{width:15px;height:15px}
.notes-head .btn{margin-left:auto}
.notes-view{border:1px solid transparent;border-radius:9px;padding:8px 10px;margin:0 -10px;cursor:text;line-height:1.55;overflow-wrap:anywhere}
.notes-view:hover{background:var(--surface-2)}
.notes-view p{margin:0}
.notes-view p.gap{height:.7em}
.notes-view ul,.notes-view ol{margin:2px 0;padding-left:22px}
.notes-view li{margin:1px 0}
.notes-view h5{margin:6px 0 2px;font-size:calc(14px*var(--ts));font-weight:700}
.notes-view a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
/* search hits, link add buttons, service icons, list options */
.t-name mark,.t-hit mark{background:color-mix(in srgb,#ffd400 45%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.t-hit{margin-top:3px;font-size:calc(12px*var(--ts));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-hit b{font-weight:600;color:var(--faint);margin-right:6px}
.link-add{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.link-row + .link-add{margin-top:12px}
svg.svc{width:16px;height:16px;flex:none;display:block}
.vopt-wrap{position:relative}
#f-sort{max-width:165px}
@media (min-width:821px) and (max-width:1500px){#sel-btn .vl{display:none}}
.vopt-btn.on{border-color:var(--accent);color:var(--accent)}
.vopt{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px;display:flex;flex-direction:column;gap:8px}
.vopt b{font-size:calc(11px*var(--ts));letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.vopt label{display:flex;align-items:center;gap:8px;font-size:calc(14px*var(--ts))}
.vopt input{accent-color:var(--accent);width:16px;height:16px}
.vopt .hint{margin:0}
.vopt-btns{display:flex;gap:6px}
.vopt-btns .btn{flex:1;justify-content:center}
/* inline due / priority in list rows */
.pedit,.dedit{position:relative;cursor:pointer;border-radius:6px;padding:3px 4px;margin:-3px -4px}
.pedit:hover,.dedit:hover{background:var(--surface-2)}
.cell-sel{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;font-size:16px}
.cell-date{position:absolute;left:0;bottom:0;width:100%;height:100%;opacity:0;pointer-events:none;border:0;padding:0}
/* stat tiles picker */
.stats-wrap{position:relative}
.stats-edit{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--line);opacity:0;transition:opacity .15s;z-index:2}
.stats-edit .i{width:13px;height:13px}
.stats-wrap:hover .stats-edit,.stats-edit.on,.stats-edit:focus-visible{opacity:1}
@media (hover:none){.stats-edit{opacity:.8}}
.stat-pop{position:absolute;top:22px;right:0;z-index:31;width:250px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px;display:flex;flex-direction:column;gap:7px}
.stat-pop b{font-size:calc(11px*var(--ts));letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.stat-pop .hint{margin:0}
.stat-pop label{display:flex;align-items:center;gap:8px;font-size:calc(14px*var(--ts))}
.stat-pop label small{margin-left:auto;color:var(--faint);font-size:calc(11px*var(--ts))}
.stat-pop input{accent-color:var(--accent);width:16px;height:16px}
.stat-pop label:has(input:disabled){opacity:.5}
/* archived: selection */
.asel-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;margin:-4px 0 12px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px}
.asel-bar b{margin-right:auto}
.arow.picked{background:var(--accent-soft)}
.arch-bar .btn.on{border-color:var(--accent);color:var(--accent)}
/* right-click menu */
.ctx{position:fixed;z-index:70;width:280px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:8px;display:flex;flex-direction:column;gap:2px}
.ctx-head{font-weight:700;padding:4px 8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-lbl{font-size:calc(10.5px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:6px 8px 3px}
.ctx-sts{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px 2px}
.ctx-sts .pill{border:0;cursor:pointer;max-width:100%}
.ctx-sts .pill.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px currentColor}
.ctx-prio{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:0 6px 2px}
.ctx-prio button{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 4px;display:flex;justify-content:center;align-items:center;min-height:30px;font-size:calc(12px*var(--ts));color:var(--muted)}
.ctx-prio button.cur{border-color:var(--accent);background:var(--accent-soft)}
.ctx-prio .prio{font-size:calc(12px*var(--ts))}
.ctx-sep{height:1px;background:var(--line);margin:6px 2px}
.ctx-item{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:7px 8px;border-radius:7px;font-weight:500;color:var(--text)}
.ctx-item:hover,.ctx-item:focus-visible{background:var(--surface-2)}
.ctx-item.danger{color:var(--danger)}
.ctx-item.armed{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.row,.card,.wcard,.arow{-webkit-touch-callout:none}
/* hidden clients (job modal), client tab drag, off days, restore points */
.cl.cl-hidden input[type=text]{color:var(--faint);text-decoration:line-through}
.cl .cl-hide{white-space:nowrap}
.client-tabs [data-ctab].dragging{opacity:.5}
.client-tabs .drop-before{box-shadow:-2px 0 0 0 var(--accent)}
.client-tabs .drop-after{box-shadow:2px 0 0 0 var(--accent)}
.day.offday,.wday.offday{background-image:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--line) 55%,transparent) 7px 8px)}
.rp-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rp-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.rp-row:first-child{border-top:0}
.rp-row span{flex:1;display:flex;flex-direction:column}
.rp-row small{color:var(--faint);font-size:calc(12px*var(--ts))}
/* checklist drag handle */
.ck-grip{flex:none;width:14px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--faint);cursor:grab;touch-action:none;opacity:0;margin-left:-4px}
.ck-grip svg{width:12px;height:12px}
.check:hover .ck-grip,.check.ck-drag .ck-grip{opacity:1}
@media (hover:none){.ck-grip{opacity:.6}}
.check.ck-drag{background:var(--surface-2);opacity:.7}
.check.ck-before{box-shadow:0 -2px 0 0 var(--accent)}
.check.ck-after{box-shadow:0 2px 0 0 var(--accent)}
body.ck-dragging,body.ck-dragging *{cursor:grabbing!important;user-select:none}
/* on shift now (sidebar) */
.shift-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--st-done);box-shadow:0 0 0 2px color-mix(in srgb,var(--st-done) 25%,transparent)}
textarea.notes{width:100%;min-height:110px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px;resize:vertical;line-height:1.5}
.d-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--faint);font-size:calc(12px*var(--ts));border-top:1px solid var(--line);padding-top:14px}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:30;background:rgba(10,12,16,.4);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font:700 calc(19px*var(--ts)) var(--display)}
.modal .m-body{padding:18px;display:flex;flex-direction:column;gap:18px}
.modal footer{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.field > .lbl{font-size:calc(12.5px*var(--ts));font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=url],.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.type-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-pick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.type-pick button b{font-weight:700}
.type-pick button small{color:var(--muted);font-size:calc(12px*var(--ts))}
.type-pick button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:7px;border:2px solid transparent;background:var(--c)}
.swatches button.on{border-color:var(--text)}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tool-cell{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.tool-cell .lbl{font-size:calc(11px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tool-cell select,.tool-cell input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:calc(13px*var(--ts));width:100%}
.client-list{display:flex;flex-direction:column;gap:6px}
.client-list .cl{display:flex;gap:6px;align-items:center}
.client-list input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.hint{font-size:calc(12px*var(--ts));color:var(--faint);margin:0}
.logo{width:var(--s,18px);height:var(--s,18px);border-radius:calc(var(--s,18px) * .26);object-fit:cover;flex:none;background:var(--surface);border:1px solid var(--line);max-width:100%}
.logo-field{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-box{width:64px;height:64px;border-radius:14px;border:1px dashed var(--line-strong);background:var(--surface-2);display:grid;place-items:center;overflow:hidden;font:700 calc(20px*var(--ts)) var(--display);color:#fff;padding:0;flex:none}
.logo-box.has{border-style:solid;border-color:var(--line);background:var(--surface)}
.logo-box img{width:100%;height:100%;object-fit:cover;display:block}
.logo-box.sm{width:36px;height:36px;border-radius:9px;color:var(--muted)}
.logo-box:hover{border-color:var(--accent)}

.toast{display:flex;align-items:center;gap:14px;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:9px;font-weight:600;font-size:calc(13px*var(--ts));z-index:40;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}
.toast-btn{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0}
.c-status{display:flex;align-items:center;gap:6px;min-width:0}
.archive-btn{padding:3px 8px;font-size:calc(12px*var(--ts))}
.group-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .archive-btn{align-self:flex-start}
.d-archived{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:9px;background:var(--surface-2);color:var(--muted);font-size:calc(13px*var(--ts))}
.d-archived b{color:var(--text)}
.d-archived span{flex:1;min-width:160px}
.arch-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
#banner:empty,#stats:empty,#jobcards:empty{display:none}
.arch-group + .arch-group{margin-top:16px}
.arch-group h3{margin:0 0 8px;font:700 calc(15px*var(--ts)) var(--display);display:flex;align-items:center;gap:8px}
.arch-group h3 .count{font:500 calc(12px*var(--ts)) var(--mono);color:var(--faint)}
.arow{display:grid;grid-template-columns:36px minmax(0,1fr) 100px 110px auto;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}
.arow:first-child{border-top:0}
.arow:hover{background:var(--surface-2)}
.arow .acts{display:flex;gap:6px}
.arow .date small{display:block;font:600 calc(10px*var(--ts)) var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.theme-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-pick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-weight:600;text-align:left}
.theme-pick button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.swatch-demo{width:100%;height:38px;border-radius:6px;border:1px solid var(--line);display:flex;overflow:hidden}
.swatch-demo i{flex:1}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .row,.row-head{grid-template-columns:var(--cols-mid,var(--w0) minmax(0,1fr) 180px 84px 120px)}
  .row > .c-start,.row-head > .c-start,.row > .c-prio,.row-head > .c-prio{display:none}
  .stat small{font-size:calc(10px*var(--ts))}
}
/* Jobs dropdown in the sidebar */
.jobs-toggle > svg:last-child{color:var(--faint);transition:transform .15s;width:14px;height:14px}
.jobs-toggle.open > svg:last-child{transform:rotate(90deg)}
.nav.jobs{margin:-12px 0 0 18px;padding-left:10px;border-left:1px solid var(--line)}
.nav.jobs .nav-new{color:var(--muted);font-weight:500}
.save-state{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.save-state .sync-dot{flex:none}
.crop-wrap{z-index:35}
.crop{width:min(420px,100%)}
.crop .m-body{align-items:center;gap:14px}
.crop-stage{position:relative;width:min(300px,calc(100vw - 80px));aspect-ratio:1;overflow:hidden;border-radius:10px;cursor:grab;touch-action:none;user-select:none;
  background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--surface-3) 0 50%) 0 0/20px 20px}
.crop-stage:active{cursor:grabbing}
.crop-stage:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.crop-stage img{position:absolute;left:50%;top:50%;max-width:none;pointer-events:none}
.crop-frame{position:absolute;inset:0;border-radius:26%;box-shadow:0 0 0 200px rgba(10,12,16,.45);outline:1.5px solid rgba(255,255,255,.85);outline-offset:-1px;pointer-events:none}
.crop-zoom{display:flex;align-items:center;gap:10px;width:min(300px,calc(100vw - 80px))}
.crop-zoom input{flex:1;accent-color:var(--accent)}
.crop-zi{font-weight:700;color:var(--muted);width:12px;text-align:center}
.crop-hint{text-align:center;max-width:320px}
.crop-quick{display:flex;gap:6px;flex-wrap:wrap}
/* sign-in screen (hosted copy) */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.auth-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.auth-card .brand{padding:0;margin-bottom:4px}
.auth-card h1{font-family:var(--display);font-size:calc(26px*var(--ts));margin:0}
.auth-lead{margin:0;color:var(--muted);font-size:calc(14px*var(--ts));line-height:1.5}
.auth-card .btn{justify-content:center;padding:10px 14px;font-size:calc(14px*var(--ts))}
.auth-card .btn[disabled]{opacity:.6;cursor:default}
.auth-or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:calc(12px*var(--ts))}
.auth-or::before,.auth-or::after{content:"";flex:1;border-top:1px solid var(--line)}
.auth-form{display:flex;flex-direction:column;gap:8px}
.auth-form label{font-size:calc(12.5px*var(--ts));font-weight:600;color:var(--muted)}
.auth-form input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:calc(15px*var(--ts));width:100%}
.setup-list{margin:-4px 0 0;padding-left:20px;font-size:calc(13px*var(--ts));line-height:1.7}
.auth-card code,.hint code{font-family:var(--mono);font-size:calc(12px*var(--ts));background:var(--surface-2);padding:1px 5px;border-radius:4px}
.auth-foot{margin:4px 0 0;font-size:calc(12px*var(--ts));text-align:center}
.auth-foot a{color:var(--muted)}
.auth-err{margin:0;color:var(--danger);font-size:calc(13px*var(--ts))}
.acct-line{margin:0;font-size:calc(13.5px*var(--ts));color:var(--text);line-height:1.5}
.acct-warn{color:var(--danger);font-weight:600}
.acct-btns{display:flex;gap:6px;flex-wrap:wrap}
.acct-btns .btn[disabled]{opacity:.6;cursor:default}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:root[data-motion="reduce"] *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
/* high contrast (Settings → Accessibility): stronger text and borders, light and dark */
:root[data-contrast="high"]:not([data-theme="dark"]){--text:#05070b;--muted:#30353f;--faint:#4a505c;--line:#8a919e;--line-strong:#5c6370}
@media (prefers-color-scheme: dark){:root[data-contrast="high"]:not([data-theme="light"]){--text:#ffffff;--muted:#d6d9e0;--faint:#b4bac6;--line:#6c7485;--line-strong:#9098a8}}
:root[data-contrast="high"][data-theme="dark"]{--text:#ffffff;--muted:#d6d9e0;--faint:#b4bac6;--line:#6c7485;--line-strong:#9098a8}
:root[data-contrast="high"] :focus-visible{outline:3px solid var(--accent)!important;outline-offset:2px}
/* celebration when a task is done */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;width:7px;height:11px;border-radius:2px;opacity:0;animation:conf 1.15s cubic-bezier(.15,.65,.35,1) forwards}
@keyframes conf{0%{transform:translate(-50%,-50%) rotate(0);opacity:1}75%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r));opacity:0}}
/* resizable task panel */
.drawer{width:min(var(--dw,760px),100%)}
.d-resize{position:fixed;top:0;bottom:0;right:min(var(--dw,760px),100%);width:10px;margin-right:-5px;cursor:col-resize;z-index:22;touch-action:none}
.d-resize::after{content:"";position:absolute;left:4px;top:50%;width:2px;height:44px;margin-top:-22px;border-radius:2px;background:var(--line-strong);opacity:0;transition:opacity .15s}
.d-resize:hover::after,.d-resize.drag::after{opacity:1}
.drawer[hidden]+.d-resize{display:none}
body.resizing{cursor:col-resize;user-select:none}
body.resizing .drawer{transition:none}
/* changed on another device */
.fresh-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle;flex:none}
.synced{display:block;padding:0 10px 2px 25px;font-size:calc(11px*var(--ts));color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.side-mini .synced{display:none}
/* calendar: narrow weekends */
.cal{--wd:minmax(96px,1fr);--wk:56px}
.day.wk-min .ev{height:7px;padding:0;min-height:0;font-size:0;border-radius:3px}
.day.wk-min .ev span,.day.wk-min .hol span,.day.wk-min .busy-tag{display:none}
.day.wk-min .more{font-size:calc(10px*var(--ts))}
.week{--wd:minmax(0,1fr);--wk:64px}
.wday.wk-min{padding:6px 4px}
.wday.wk-min .wcard{padding:4px}
.wday.wk-min .wcard small,.wday.wk-min .wc-st,.wday.wk-min .hol span,.wday.wk-min .busy-tag{display:none}
.wday.wk-min .wcard b{font-size:calc(11px*var(--ts));display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.last-backup{margin:0;font-size:calc(13px*var(--ts));color:var(--muted)}
@media (max-width:820px){
  .app{display:block}
  .mtop{display:flex;flex-direction:column;gap:8px;position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .mtop-row{display:flex;align-items:center;gap:8px}
  .mtop .brand{padding:0;flex:1;min-width:0}
  .mtop .brand b{font-size:calc(17px*var(--ts))}
  .mtop .top-right{width:100%;flex:none}
  .mtop .top-search{flex:1;max-width:none;min-width:0}
  .mtop .bell{width:34px;height:34px}
  .side{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(280px,86vw);z-index:40;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .side-scrim{display:block;position:fixed;inset:0;z-index:39;background:rgba(10,12,16,.35)}
  .side-scrim[hidden]{display:none}
  .main{padding:10px 12px 40px;gap:10px}
  .banner{padding:8px 10px;font-size:calc(12px*var(--ts));gap:6px 10px}
  .banner p{min-width:0}
  .head{gap:8px}
  .head-title{min-width:0;gap:3px}
  .head h1{font-size:calc(20px*var(--ts));gap:8px}
  .head h1 .logo{--s:26px!important}
  .head .sub{font-size:calc(12px*var(--ts));gap:4px 8px}
  .tools{gap:6px}
  .head h1 .h1-edit{width:28px;height:28px}
  .tool{padding:5px 9px;flex:none}
  .tool small{font-size:calc(9.5px*var(--ts))}
  .tool span{font-size:calc(13px*var(--ts))}
  .tools .btn{flex:none;padding:6px 10px}
  .stats{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
  .stat{padding:6px 6px;border-radius:8px;gap:0}
  .stat small{font-size:calc(8.5px*var(--ts));letter-spacing:.03em;line-height:1.2;white-space:normal}
  .stat b{font-size:calc(17px*var(--ts))}
  .jobs-grid{display:flex;overflow-x:auto;gap:8px;scroll-snap-type:x mandatory;padding-bottom:2px}
  .jobs-grid > .job-wrap{flex:0 0 72%;scroll-snap-align:start}
  .job-card{padding:10px;gap:6px}
  .job-card h3{font-size:calc(14px*var(--ts))}
  .toolbar{flex-wrap:nowrap;gap:6px;padding-block:6px;margin-block:-6px;position:static}
  .toolbar > *{flex:none}
  .toolbar .vl{display:none}
  .seg button{padding:6px 10px}
  .toolbar .filters{display:none}
  #fs-slot .filters{display:flex}
  .filter-btn{display:inline-flex}
  #new-task-btn{padding:7px 10px}
  .pane-tabs{margin-top:8px}
  .pane-tabs button{padding:7px 10px;font-size:calc(13px*var(--ts))}
  .client-tabs button{padding:6px 10px;font-size:calc(13px*var(--ts))}
  .group + .group{margin-top:8px}
  .group-head{padding:3px 2px}
  .row{padding:7px 10px}
  .row,.row-head{grid-template-columns:32px minmax(0,1fr) auto;gap:8px}
  .row .tmark{width:32px;height:32px}
  .row select.pill{font-size:calc(11px*var(--ts));padding:2px 8px}
  .row-head{display:none}
  .row > .t-main{grid-column:2;grid-row:1/3}
  .row > .c-status{grid-column:3;grid-row:1;justify-self:end}
  .row > .c-due{grid-column:3;grid-row:2;justify-self:end}
  .row .archive-btn{display:none}
  .row > .c-links{display:none}
  .t-meta{font-size:calc(11.5px*var(--ts))}
  .arow{grid-template-columns:32px minmax(0,1fr) auto;padding:7px 10px}
  .arow .c-done{display:none}
  .arow .acts{grid-column:2/4;justify-self:start}
  .work-grid{grid-template-columns:1fr 1fr}
  .work-item{padding:8px 10px}
  .work-item b{font-size:calc(13px*var(--ts))}
  .props{grid-template-columns:1fr}
  .props > label,.props > .lbl{margin-bottom:-4px}
  .tool-grid,.type-pick{grid-template-columns:1fr}
  .bv-dd{grid-template-columns:1fr}
  .bm-color{grid-template-columns:40px minmax(0,1fr) auto}
  .bm-color input[data-bm-cname]{grid-column:2/3}
  .brand-cards{grid-template-columns:1fr 1fr}
  .d-body{padding:14px;gap:14px}
  .modal .m-body{padding:14px;gap:14px}
  .cal-wrap{overflow:visible}
  .cal{min-width:0;grid-template-columns:repeat(7,minmax(0,1fr));border-radius:10px}
  .cal .dow{padding:4px 0;font-size:calc(10px*var(--ts));text-align:center;letter-spacing:.02em}
  .day{min-height:max(64px,calc((100vh - 330px) / 6));padding:3px 2px;gap:2px}
  .day .dn{font-size:calc(11px*var(--ts));justify-content:center}
  .busy-tag{display:none}
  .day.today .dn b{padding:0 4px}
  .ev{font-size:calc(9.5px*var(--ts));font-weight:600;padding:1px 3px;border-left-width:2px;border-radius:3px;gap:0}
  .more{font-size:calc(9px*var(--ts));padding-left:1px}
  .cal-bar{margin-bottom:6px;flex-wrap:wrap}
  .cal-bar h2{font-size:calc(16px*var(--ts))}
  .cal-bar .hint{display:none}
  .board{grid-auto-columns:minmax(160px,64vw)}
  .card{padding:8px;gap:4px}
  .card-top{gap:7px;align-items:center}
  .card-top .tmark{width:26px;height:26px}
  .card .t-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(13px*var(--ts))}
  .card .t-meta{font-size:calc(11px*var(--ts));gap:2px 8px}
  .card .t-meta .chip,.card .t-meta .mono,.card .links,.card .prio{display:none}
  .card-foot{justify-content:flex-start}
  .card .archive-btn{padding:2px 6px;font-size:calc(11px*var(--ts))}
}
@media (max-width:420px){.work-grid,.brand-cards{grid-template-columns:1fr}}
.pick-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick-row.two{grid-template-columns:repeat(2,1fr)}
.pick-row.three{grid-template-columns:repeat(3,1fr)}
.pick-row button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-weight:600;text-align:left;min-width:0}
.pick-row button.on,.scheme-pick button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.pick-row .aa{font:700 16px/1 var(--display)}
.pick-row small{font-weight:400;color:var(--muted);font-size:12px}
.dens-demo{display:flex;flex-direction:column;width:100%}
.dens-demo i{display:block;height:5px;border-radius:3px;background:var(--line-strong);width:100%}
.scheme-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.scheme-pick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:10px;font-weight:600;text-align:left;min-width:0}
.scheme-dot{width:30px;height:30px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15);position:relative;overflow:hidden}
.scheme-dot i{position:absolute;right:0;bottom:0;width:50%;height:50%;border-top-left-radius:50%}
.sub-lbl{font-size:12px;color:var(--muted);margin:10px 0 6px;font-weight:600}
/* compact density (Settings → Accessibility) */
:root[data-density="compact"] .main{gap:12px;padding-top:14px}
:root[data-density="compact"] .row{padding-block:3px}
:root[data-density="compact"] .row .tmark{width:28px;height:28px}
:root[data-density="compact"] .rows{--w0:28px}
:root[data-density="compact"] .group-head{padding-block:3px}
:root[data-density="compact"] .card{padding:7px;gap:4px}
:root[data-density="compact"] .card-top .tmark{width:24px;height:24px}
:root[data-density="compact"] .col{gap:6px;padding:6px}
:root[data-density="compact"] .nav-item{padding-block:5px}
:root[data-density="compact"] .side{gap:12px}
:root[data-density="compact"] .stat{padding:7px 11px}
:root[data-density="compact"] .job-card{padding:10px;gap:6px}
:root[data-density="compact"] .day{min-height:84px}
:root[data-density="compact"] .btn{padding-block:5px}
@media (max-width:820px){
  :root[data-density="compact"] .row,:root[data-density="compact"] .row-head{grid-template-columns:26px minmax(0,1fr) auto}
  :root[data-density="compact"] .row{padding:4px 10px}
  :root[data-density="compact"] .row .tmark{width:26px;height:26px}
  :root[data-density="compact"] .card{padding:6px}
  :root[data-density="compact"] .main{gap:8px;padding-top:8px}
}
/* breadcrumbs */
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px 4px;font-size:calc(13px*var(--ts));color:var(--muted);margin:0 0 6px -6px}
.crumbs button,.crumbs span{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:3px 6px;border-radius:6px;color:var(--muted);font-weight:500}
.crumbs button:hover{background:var(--surface-2);color:var(--text)}
.crumbs span[aria-current]{color:var(--text);font-weight:600}
.crumbs i{font-style:normal;color:var(--faint)}
.crumbs .i{width:14px;height:14px}
/* Settings-style modals */
.modal.pref-modal{width:min(900px,100%);height:min(720px,calc(100vh - 32px));overflow:hidden}
.pref{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr)}
.pref-nav{display:flex;flex-direction:column;gap:2px;padding:14px 10px;border-right:1px solid var(--line);overflow:auto;background:var(--surface)}
.pref-nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 12px;border-radius:8px;text-align:left;font-weight:500;color:var(--text);white-space:nowrap}
.pref-nav button:hover{background:var(--surface-2)}
.pref-nav button.on{background:var(--accent);color:var(--accent-ink)}
.pref-nav button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pref-nav button small{font:500 calc(11px*var(--ts)) var(--mono);opacity:.75}
.pref-body{overflow:auto;padding:22px 26px 28px;display:flex;flex-direction:column;gap:20px}
.pref-sec{display:flex;flex-direction:column;gap:20px}
.pref-h{margin:0;font:700 calc(21px*var(--ts))/1.2 var(--display)}
.pref-sec > .field + .field,.pref-sec > .field + .wf-grid,.pref-sec > .wf-grid + .wf-grid,.pref-sec > .wf-grid + .field,.pref-sec > .wf-grid + label{border-top:1px solid var(--line);padding-top:20px}
.pref-body .bm-note{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}
.bm-log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:calc(13px*var(--ts))}
.bm-log b{display:inline-block;min-width:74px;color:var(--muted);font-weight:600;margin-right:8px}
.pref-g{margin:12px 12px 4px;font:600 calc(11px*var(--ts)) var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.pref-g:first-child{margin-top:2px}
.pn-sub,.pn-chev,.pref-mback{display:none}
@media (max-width:820px){
  .pref.pref-s{grid-template-rows:minmax(0,1fr)}
  .pref-s .pref-nav{display:none}
  .pref-s.m-list .pref-nav{display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;border:0;padding:4px 0 20px;gap:0}
  .pref-s.m-list .pref-body{display:none}
  .pref-s .pref-g{margin:18px 18px 4px;font-size:calc(15px*var(--ts));text-transform:none;letter-spacing:0;color:var(--text);font-weight:700}
  .pref-s .pref-g:first-child{margin-top:10px}
  .pref-s .pref-nav button{padding:12px 18px;gap:16px;border-radius:0;white-space:normal;font-weight:500;font-size:calc(16px*var(--ts));background:none;color:var(--text)}
  .pref-s .pref-nav button.on{background:none;color:var(--text)}
  .pref-s .pref-nav button:active{background:var(--surface-2)}
  .pref-s .pref-nav button > .i,.pref-s .pref-nav button > svg{width:22px;height:22px;flex:none}
  .pref-s .pref-nav button span{display:flex;flex-direction:column;gap:1px}
  .pref-s .pn-sub{display:block;font-style:normal;font-size:calc(13px*var(--ts));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pref-s .pn-chev{display:block;font-style:normal;font-size:calc(24px*var(--ts));line-height:1;color:var(--faint)}
  .pref-s .pref-g + button,.pref-s .pref-nav > button:first-child{border-top:0}
  .pref-s .pref-nav p.pref-g:not(:first-child){border-top:1px solid var(--line);padding-top:16px;margin-left:0;margin-right:0;padding-left:18px}
  .pref-s .pref-mback{display:block;margin:-6px 0 -4px}
  .pref-mback button{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:6px 6px 6px 0;color:var(--accent);font:600 calc(15px*var(--ts)) var(--body)}
  .pref-mback .i{width:18px;height:18px}
  .pref-s .pref-h{display:block;font-size:calc(24px*var(--ts))}
}
/* status editor */
.st-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.st-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto 64px;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface)}
.st-row:first-child{border-top:0}
.st-row.armed{background:var(--danger-soft)}
.st-row input{border:1px solid transparent;background:none;border-radius:7px;padding:6px 8px;font-weight:600;width:100%}
.st-row input:hover{border-color:var(--line)}
.st-row input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.st-dot{width:22px;height:22px;border-radius:50%;border:3px solid color-mix(in srgb,var(--c) 30%,transparent);background:var(--c);padding:0;flex:none}
.st-row .icon-btn[disabled]{opacity:.3;pointer-events:none}
.st-row .icon-btn.danger{color:var(--danger);background:var(--danger-soft)}
.st-lock{font-size:calc(11px*var(--ts));font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;justify-self:center}
.st-count{font:500 calc(11px*var(--ts)) var(--mono);color:var(--faint);text-align:right}
.st-swatches{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 2px 28px}
.st-swatches button{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.st-swatches button.on{box-shadow:0 0 0 2px var(--text)}
.st-swatches button.def{background:conic-gradient(var(--c) 0 50%,var(--surface-2) 0)}
.st-del-box{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0 2px 28px;font-size:calc(13px*var(--ts))}
.st-del-box select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px}
@media (max-width:820px){
  .modal.pref-modal{height:calc(100vh - 24px)}
  .pref{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .pref-nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:4px;scrollbar-width:none}
  .pref-nav button{padding:6px 10px;flex:none}
  .pref-body{padding:14px 14px 20px;gap:14px}
  .pref-sec{gap:14px}
  .pref-h{display:none}
  .st-row{grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:2px}
  .st-count{display:none}
}
/* activity log */
.lrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow.link{cursor:pointer}
.lrow.link:hover{background:var(--surface-2)}
.l-ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.l-ic .i{width:14px;height:14px}
.l-ic.k-note{color:var(--accent)} .l-ic.k-status{color:var(--st-prog)} .l-ic.k-create{color:var(--st-done)} .l-ic.k-delete{color:var(--danger)} .l-ic.k-check{color:var(--st-done)} .l-ic.k-date{color:var(--st-rev)} .l-ic.k-brand{color:var(--st-review)}
.l-main{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;min-width:0}
.l-main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.l-main span{color:var(--muted)}
.l-main small{display:inline-flex;align-items:center;gap:5px;color:var(--faint);font-size:calc(12px*var(--ts))}
.lrow time{font:500 calc(12px*var(--ts)) var(--mono);color:var(--faint);white-space:nowrap}
/* task panel tabs + activity */
.d-tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.d-tabs button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:10px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;margin-bottom:-1px}
.d-tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.d-tabs .mono{font-size:calc(11px*var(--ts));color:var(--faint)}
.d-act-title{margin:0;font:700 calc(20px*var(--ts))/1.25 var(--display)}
.composer{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{width:100%;border:0;background:none;padding:10px 12px;resize:vertical;min-height:60px;outline:none;line-height:1.45}
.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 8px 12px}
.timeline{display:flex;flex-direction:column;gap:2px;position:relative}
.tl-day{font:600 calc(11px*var(--ts)) var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:10px 0 4px}
.tl-day:first-child{margin-top:0}
.tl-item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;padding:5px 0}
.tl-text{color:var(--muted)}
.tl-item time,.tl-note time{font:500 calc(12px*var(--ts)) var(--mono);color:var(--faint);white-space:nowrap}
.tl-note{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px 10px;margin:4px 0}
.tl-note-head{display:flex;align-items:center;gap:6px;color:var(--accent)}
.tl-note-head b{color:var(--text);font-weight:600;flex:1}
.tl-note-head .icon-btn{width:24px;height:24px;opacity:.6}
.tl-note-head .icon-btn:hover,.tl-note-head .icon-btn.danger{opacity:1}
.tl-note-head .icon-btn.danger{color:var(--danger);background:var(--danger-soft)}
.tl-note p{margin:4px 0 0;white-space:normal;line-height:1.5}
/* updates: formatted text, pictures, lightbox */
.note-body.md,.note-reply .md{margin-top:4px;line-height:1.5;overflow-wrap:anywhere}
.tl-note .md p{margin:0}
.tl-note .md p.gap{height:.6em}
.tl-note .md ul,.tl-note .md ol{margin:2px 0;padding-left:22px}
.tl-note .md h5{margin:6px 0 2px;font-size:calc(14px*var(--ts))}
.tl-note .md a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.tl-note.resolved .note-body.md{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--text) 45%,transparent);color:var(--muted)}
.composer .fmt-bar{margin:0;padding:6px 8px 0;justify-content:flex-start}
.reply-box .fmt-bar{margin:0 0 4px;justify-content:flex-start}
.composer.drop-on,.reply-box.drop-on{outline:2px dashed var(--accent);outline-offset:2px}
.att-list{display:flex;flex-wrap:wrap;gap:8px;padding:4px 12px 2px}
.reply-box .att-list{padding:6px 0 0}
.att{position:relative;width:72px;height:54px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-size:calc(11px*var(--ts));color:var(--muted)}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att .icon-btn{position:absolute;top:2px;right:2px;width:20px;height:20px;padding:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff}
.att .icon-btn .i{width:11px;height:11px}
.note-pics{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.note-pic{border:1px solid var(--line);padding:0;border-radius:8px;overflow:hidden;background:var(--surface-2);width:120px;height:80px;cursor:zoom-in}
.note-reply .note-pic{width:96px;height:64px}
.note-pic img{width:100%;height:100%;object-fit:cover;display:block}
.note-pic:hover{border-color:var(--accent)}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(6,8,12,.88);display:flex;align-items:center;justify-content:center;padding:48px 64px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.lightbox .icon-btn{position:absolute;color:#fff;background:rgba(255,255,255,.12);border-radius:50%;width:40px;height:40px}
.lightbox .icon-btn:hover{background:rgba(255,255,255,.22)}
.lb-close{top:14px;right:14px}
.lb-nav.prev{left:14px;top:50%;margin-top:-20px}
.lb-nav.next{right:14px;top:50%;margin-top:-20px}
.lb-count{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font:600 calc(13px*var(--ts)) var(--mono)}
.lb-open{position:absolute;bottom:12px;right:14px}
@media (max-width:820px){.lightbox{padding:56px 8px}.note-pic{width:96px;height:64px}}
/* resolve + reply */
.tc{display:inline-block;font:600 calc(12.5px*var(--ts)) var(--mono);color:#e0a100;background:color-mix(in srgb,#e0a100 16%,transparent);border-radius:5px;padding:1px 6px;margin-right:6px}
