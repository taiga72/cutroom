:root[data-theme="dark"] .tc{color:#f2c14e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tc{color:#f2c14e}}
.tl-note .note-done{border-radius:50%;opacity:.75;border:1.5px solid var(--line-strong);padding:0;display:grid;place-items:center}
.tl-note .note-done .i{display:block;margin:0}
.tl-note .note-done .i{width:13px;height:13px;stroke-width:2.2}
.tl-note .note-done:hover{opacity:1;border-color:var(--st-done);color:var(--st-done)}
.tl-note .note-done.on{opacity:1;background:var(--st-done);border-color:var(--st-done);color:#fff}
.tl-note.resolved{background:var(--surface);opacity:.8}
.tl-note.resolved .note-body{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--text) 45%,transparent);color:var(--muted)}
.tl-note.resolved .tc{opacity:.7}
.note-foot{display:flex;align-items:center;gap:12px;margin-top:8px}
.note-reply-btn{border:0;background:none;padding:2px 0;display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-weight:600;font-size:calc(13px*var(--ts))}
.note-reply-btn:hover{color:var(--accent)}
.note-reply-btn .i{width:14px;height:14px}
.done-when{display:inline-flex;align-items:center;gap:4px;color:var(--st-done);font-size:calc(12px*var(--ts));font-weight:600}
.done-when .i{width:13px;height:13px;stroke-width:2.2}
.note-replies{margin:8px 0 0 12px;padding-left:12px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.note-reply{display:flex;align-items:flex-start;gap:8px}
.note-reply p{flex:1;margin:0;line-height:1.5}
.note-reply .icon-btn{width:22px;height:22px;opacity:0}
.note-reply:hover .icon-btn,.note-reply .icon-btn.danger{opacity:.7}
.note-reply .icon-btn.danger{opacity:1;color:var(--danger);background:var(--danger-soft)}
@media (hover:none){.note-reply .icon-btn{opacity:.6}}
.reply-box{margin-top:8px}
.reply-box textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;resize:vertical;font:inherit;color:var(--text)}
.reply-box .composer-foot{display:flex;align-items:center;gap:6px;margin-top:6px}
.reply-box .composer-foot .hint{margin-right:auto}
.notes-sum{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 2px;color:var(--muted);font-size:calc(13px*var(--ts))}
.notes-sum b{color:var(--text)}
.chip.notes-chip{display:inline-flex;align-items:center;gap:3px;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft)}
.chip.notes-chip .i{width:11px;height:11px}
@media (max-width:820px){.lrow{padding:7px 10px;gap:8px}.lrow time{font-size:calc(11px*var(--ts))}}
/* task fields, ClickUp-style: two columns of label + value, borderless until hovered */
.d-body{container-type:inline-size}
.props2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px}
.pf{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;gap:8px;min-height:38px}
.pf > label,.pf-l{color:var(--muted);font-size:calc(13.5px*var(--ts));display:flex;align-items:center;gap:8px}
.pf > label .i,.pf-l .i{width:17px;height:17px;color:var(--faint)}
.pf-v{display:flex;align-items:center;gap:6px;min-width:0}
.pf-wide{grid-column:1/-1}
.pf-v select,.pf-v input[type=text],.pf-v input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:calc(14px*var(--ts));width:100%;min-width:0;color:var(--text);cursor:pointer}
.pf-v input[type=text]{cursor:text}
.pf-v select:hover,.pf-v input:hover{border-color:var(--line-strong)}
.pf-v select:focus,.pf-v input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.pf-v input::placeholder{color:var(--faint)}
.st-ctl{display:inline-flex;align-items:stretch;border-radius:999px;overflow:hidden;background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--text));min-width:0;padding-left:11px;position:relative}
.st-ctl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);align-self:center;flex:none}
.st-ctl select.pill{background:none;color:inherit;border:0;border-radius:0;padding:7px 12px 7px 7px;font:600 calc(13px*var(--ts))/1 var(--body);width:auto;max-width:190px;text-overflow:ellipsis}
.st-ctl select.pill:hover{background:none;text-decoration:underline;text-underline-offset:3px}
.st-ctl select.pill option{color:var(--text);background:var(--surface)}
.st-next{border:0;border-left:1px solid color-mix(in srgb,var(--c) 30%,transparent);background:none;color:inherit;width:30px;display:grid;place-items:center}
.st-next:hover{background:color-mix(in srgb,var(--c) 18%,transparent)}
.st-next .i{width:13px;height:13px;stroke:none}
.st-done{width:32px;height:30px;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.st-done:hover{color:var(--st-done);border-color:var(--st-done)}
.prio-ctl{display:inline-flex;align-items:center;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--text));padding-left:11px;max-width:100%}
.prio-ctl.p-urgent{--c:var(--danger)} .prio-ctl.p-high{--c:var(--st-rev)} .prio-ctl.p-normal{--c:var(--st-prog)} .prio-ctl.p-low{--c:var(--faint)}
.pf-v .prio-ctl select{appearance:none;-webkit-appearance:none;border:0;background:none;color:inherit;font-weight:600;font-size:calc(13px*var(--ts));padding:7px 12px 7px 6px;width:auto;border-radius:999px}
.pf-v .prio-ctl select:hover{text-decoration:underline;text-underline-offset:3px}
.prio-ctl select option{color:var(--text);background:var(--surface)}
.date-ctl{display:flex;align-items:center;gap:6px;min-width:0;width:100%}
.date-ctl{max-width:420px}
.date-ctl input{flex:1;min-width:0}
.date-ctl .arrow{color:var(--faint);flex:none}
.date-ctl input.over{color:var(--danger)} .date-ctl input.soon{color:var(--warn)}
.pf-v .stepper{border-color:var(--line)}
.pf-v .stepper:hover{border-color:var(--line-strong)}
@container (max-width:600px){.props2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.pf{grid-template-columns:96px minmax(0,1fr)}.d-name{font-size:calc(22px*var(--ts))}}
/* templates */
.section-title:has(.tpl-btn){display:flex;align-items:center;gap:8px}
.section-title .tpl-btn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font:600 calc(11.5px*var(--ts)) var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.section-title .tpl-btn .i{width:13px;height:13px}
.section-title .tpl-btn:hover,.section-title .tpl-btn.on{color:var(--text);border-color:var(--accent)}
.tpl-menu{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:8px;display:flex;flex-direction:column;gap:6px;margin:4px 0 10px}
.tpl-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px}
.tpl-name{flex:1;min-width:0;display:flex;flex-direction:column}
.tpl-name small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl-row .icon-btn.danger{color:var(--danger);background:var(--danger-soft)}
.tpl-save{display:flex;gap:6px;flex-wrap:wrap}
.tpl-save input{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px}
.tpl-menu > .btn{align-self:flex-start}
/* jump to */
.jump-wrap{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.4);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.jump{width:min(620px,100%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.jump-in{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.jump-in input{flex:1;border:0;background:none;outline:none;font-size:calc(16px*var(--ts));color:var(--text)}
kbd{font:500 calc(11px*var(--ts)) var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--faint);background:var(--surface)}
.nav-item kbd.count{border-color:var(--line);background:none}
.jump-list{overflow:auto;padding:6px}
.jump-item{display:grid;grid-template-columns:24px minmax(0,1fr);row-gap:0;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:6px 10px;line-height:1.3;border-radius:8px;color:var(--text)}
.jump-item.on,.jump-item:hover{background:var(--accent-soft)}
.jic{display:grid;place-items:center;color:var(--muted);grid-row:span 2}
.jl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.js{grid-column:2;color:var(--faint);font-size:calc(12px*var(--ts));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jdot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.jump-foot{display:flex;gap:16px;padding:8px 14px;border-top:1px solid var(--line);color:var(--faint);font-size:calc(12px*var(--ts))}
/* multi-select */
.mark-wrap{position:relative;flex:none;display:grid}
.selbox{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:26%;opacity:0;cursor:pointer}
.selbox input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.selbox{opacity:1}
.arow .selbox{position:static;inset:auto;background:none;width:32px;height:32px;display:grid;place-items:center}
.row.picked,.card.picked{background:var(--accent-soft)}
.card.picked{border-color:var(--accent)}
body:has(.bulk:not([hidden])) .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (max-width:820px){body:has(.bulk:not([hidden])) .toast{bottom:190px}}
.bulk{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:18px;z-index:25;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px 10px 8px 14px;max-width:calc(100vw - 24px)}
.bulk select,.bulk-date{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:calc(13px*var(--ts))}
.bulk-date{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.bulk-date input{border:0;background:none;color:var(--text);font-size:calc(13px*var(--ts))}
.sel-btn.on,.selecting .sel-btn{border-color:var(--accent);color:var(--accent)}
@media (max-width:820px){.bulk{bottom:10px;border-radius:12px;gap:6px;padding:8px}.bulk b{width:100%;text-align:center}.jump-wrap{padding-top:10vh}}
.jump-top,.jump-x{display:none}
.jump-bar{display:contents}
.jump-g{margin:8px 10px 4px;font:600 calc(11px*var(--ts)) var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
@media (max-width:820px){
  .jump-wrap{inset:auto;top:0;left:0;right:0;height:100dvh;padding:0;background:var(--bg);align-items:stretch}
  .jump{width:100%;height:100%;max-height:none;border-radius:0;box-shadow:none;background:var(--bg)}
  .jump-top{display:block;order:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
  .jump-top h2{margin:0;font:700 calc(28px*var(--ts))/1.1 var(--display)}
  .jump-list{order:1;flex:1;min-height:0;padding:6px 8px}

  .jump-item{padding:9px 12px;gap:1px 14px;grid-template-columns:28px minmax(0,1fr)}

  .jump-bar{display:flex;order:2;align-items:center;gap:10px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  .jump-in{flex:1;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);padding:12px 16px;box-shadow:0 4px 18px rgba(10,12,16,.14)}

  .jump-x{display:grid;place-items:center;flex:none;width:50px;height:50px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);padding:0;box-shadow:0 4px 18px rgba(10,12,16,.14)}
  .jump-x .i{width:20px;height:20px}

}
.top-search{position:relative}
/* shortcut list (Settings) */
.keys-list{border:1px solid var(--line);border-radius:10px;padding:2px 12px}
.key-row{display:grid;grid-template-columns:130px minmax(0,1fr);align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.key-row:first-child{border-top:0}
.key-row i{font-style:normal;color:var(--faint)}
/* drag to reorder */
.drop-before{box-shadow:0 -3px 0 0 var(--accent)!important}
.drop-after{box-shadow:0 3px 0 0 var(--accent)!important}
.group.drag{outline:2px dashed color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:2px;border-radius:10px}
.row[draggable]{cursor:pointer}
/* inline rename */
.rename-in{width:100%;font:inherit;border:1px solid var(--accent);border-radius:6px;padding:2px 6px;background:var(--surface);color:var(--text)}
/* pins */
.pin-i{width:13px;height:13px;color:var(--accent);margin-right:4px;vertical-align:-2px}
.icon-btn.pin-on{color:var(--accent);background:var(--accent-soft)}
.pins{margin-top:4px}
.pins h3{display:flex;align-items:center;gap:6px;margin:0 0 8px;font:700 calc(14px*var(--ts)) var(--display)}
.pins h3 .i{color:var(--accent)}
.pins h3 .count{font:500 calc(12px*var(--ts)) var(--mono);color:var(--faint)}
.pin-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:8px}
.pin-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:10px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);border-radius:10px;padding:8px 6px 8px 10px;cursor:pointer}
.pin-card:hover{border-color:var(--line-strong);border-left-color:var(--accent)}
.pin-card .tmark{width:30px;height:30px}
.pc-main{display:flex;flex-direction:column;min-width:0}
.pc-main b,.pc-main small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-main small{color:var(--muted)}
.pin-card .date{font:500 calc(12px*var(--ts)) var(--mono)}
.pin-card .icon-btn{width:26px;height:26px}
/* week view */
.cal-mode{margin-right:6px}
.cal-mode button{padding:5px 10px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:260px;min-width:0}
.wday.today{border-color:var(--accent)}
.wday.busy{background:color-mix(in srgb,var(--warn) 6%,var(--surface))}
.wd-head{display:flex;align-items:baseline;gap:6px;color:var(--muted);font-size:calc(12px*var(--ts));font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.wd-hrs{display:inline-flex;align-items:center;gap:3px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);margin-left:auto;font-size:calc(11.5px*var(--ts))}
.wd-hrs .i{width:12px;height:12px}
.wday.wk-min .wd-hrs{display:none}
.wd-head b{font:700 calc(18px*var(--ts)) var(--display);color:var(--text);letter-spacing:0}
.wday.today .wd-head b{color:var(--accent)}
.wd-head .busy-tag{margin-left:auto}
/* public holidays */
.hol{display:flex;align-items:center;gap:4px;min-width:0;margin:1px 0 2px;font-size:calc(10.5px*var(--ts));color:var(--accent);line-height:1.25}
.hol i{font:700 calc(9px*var(--ts)) var(--mono);font-style:normal;padding:0 3px;border-radius:3px;background:var(--accent-soft);flex:none}
.hol span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.holiday,.wday.holiday{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.wday .hol{margin:0 0 4px}
.hol-chips{display:flex;flex-wrap:wrap;gap:6px}
.hol-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 8px;border:1px solid var(--line);border-radius:99px;background:var(--surface-2);font-size:calc(13px*var(--ts))}
.hol-chip b{font:700 calc(11px*var(--ts)) var(--mono);color:var(--accent)}
.hol-chip .icon-btn{width:22px;height:22px}
/* task age */

.imp-table th,.imp-table td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.imp-table th{color:var(--muted);font-weight:600;background:var(--surface-2)}
.imp-table tr.dupe td{color:var(--faint);text-decoration:line-through}
.bulk select#bulk-move{max-width:150px}

.prio.urgent{color:var(--pr-urgent,var(--danger))} .prio.high{color:var(--pr-high,var(--st-rev))} .prio.low{color:var(--pr-low,var(--faint))}
.prio-ctl.p-urgent{--c:var(--pr-urgent,var(--danger))} .prio-ctl.p-high{--c:var(--pr-high,var(--st-rev))} .prio-ctl.p-low{--c:var(--pr-low,var(--faint))}
/* compact preference rows in Settings */
.pref-group{margin:6px 0 -4px;font-size:calc(11px*var(--ts));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pref-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.pref-row .pr-l{display:flex;flex-direction:column;gap:2px;font-weight:600;min-width:0}
.pref-row .pr-l small{font-weight:400;color:var(--muted);font-size:calc(12px*var(--ts))}
.pref-row .seg button{padding:5px 10px}
.prio-cols{display:flex;flex-direction:column;gap:8px}
.prio-col-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prio-col-row > span{width:64px;font-weight:600}
.prio-col-row .sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0;cursor:pointer}
.prio-col-row .sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.prio-col-row .sw.def{background:none;border:1.5px dashed var(--line-strong);width:auto;height:22px;border-radius:11px;padding:0 8px;font-size:calc(11px*var(--ts));color:var(--muted)}
.prio-col-row .sw.def.on{box-shadow:0 0 0 2px var(--accent)}
@media (max-width:820px){
  :root[data-toast="right"] .toast{left:50%;right:auto;transform:translateX(-50%)}
  :root[data-names="wrap"] :is(.card .t-name,.row .t-name){white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;display:block}
}
.toast{max-width:min(520px,calc(100% - 32px));width:max-content}
.toast-msg{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.toast-btn{flex:none}
/* week view shift bands */
.wshift{display:flex;align-items:center;gap:5px;font-size:calc(11px*var(--ts));font-weight:600;color:color-mix(in srgb,var(--jc) 75%,var(--text));background:color-mix(in srgb,var(--jc) 12%,transparent);border-left:3px solid var(--jc);border-radius:5px;padding:3px 6px;min-width:0}
.wshift span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wshift .logo,.wshift .dot{flex:none}
.wday.wk-min .wshift span{display:none}
/* split box */
.split-box{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.split-head{display:flex;align-items:center;gap:8px;color:var(--accent)}
.split-head b{flex:1;color:var(--text)}
.split-box .hint{margin:0}
.split-box textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);resize:vertical;font:inherit;color:var(--text);line-height:1.5}
.split-keep{display:flex;align-items:center;gap:8px;font-size:calc(13px*var(--ts))}
.split-keep input{accent-color:var(--accent)}
.split-foot{display:flex;justify-content:flex-end;gap:6px}
/* swipe between tasks */
@keyframes swl{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes swr{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
.drawer.swipe-l > *{animation:swl .18s ease-out}
.drawer.swipe-r > *{animation:swr .18s ease-out}
/* help page */
.help-grp{margin:18px 0 8px;font:700 calc(12px*var(--ts)) var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.help-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.help-item{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.help-item h4{margin:0;font-size:calc(15px*var(--ts))}
.help-item p{margin:0;color:var(--muted);line-height:1.55}
@media (max-width:820px){.help-list{grid-template-columns:1fr}}
/* sideways swipes in the task panel switch tasks; don't let them become the browser's back gesture */
.drawer{overscroll-behavior-x:none;touch-action:pan-y pinch-zoom}

/* ---------- more appearance options ---------- */
.greet{font-size:calc(13px*var(--ts));font-weight:600;color:var(--muted);margin-bottom:-2px}
.greet span{font-weight:500;color:var(--faint)}
:root[data-head="compact"] .main{padding-top:14px;gap:12px}
:root[data-head="compact"] .head h1{font-size:calc(20px*var(--ts));gap:8px}
:root[data-head="compact"] .head h1 .logo{--s:24px!important}
:root[data-head="compact"] .head-title{gap:3px}
:root[data-head="compact"] .crumbs{margin-bottom:2px;font-size:calc(12px*var(--ts))}
:root[data-head="compact"] .greet{font-size:calc(12px*var(--ts))}
:root:not([data-dband="off"]) .d-top{box-shadow:inset 0 3px 0 var(--jc,transparent)}
:root[data-btint="on"] .col{background:color-mix(in srgb,var(--sc) 10%,var(--surface-2))}
:root[data-btint="on"] .col.drag{background:var(--accent-soft)}
:root[data-due="badge"] :is(.c-due,.card-foot,.pin-card) .date,:root[data-due="badge"] .c-due.date{padding:1px 6px;border-radius:5px;background:var(--surface-2)}
:root[data-due="badge"] :is(.c-due,.card-foot,.pin-card) .date.over,:root[data-due="badge"] .c-due.date.over{background:var(--danger);color:#fff}
:root[data-due="badge"] :is(.c-due,.card-foot,.pin-card) .date.soon,:root[data-due="badge"] .c-due.date.soon{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--text)}
:root[data-due="badge"] :is(.c-due,.card-foot,.pin-card) .date.none,:root[data-due="badge"] .c-due.date.none{background:none;padding:0}
:root[data-due="badge"] .c-due.date{align-self:center;width:max-content}
.jring-row{display:flex;align-items:center;gap:8px;font-size:calc(12px*var(--ts));color:var(--muted)}
.jring{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.jring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.jring b{position:relative;font:600 calc(10px*var(--ts)) var(--mono);color:var(--text)}
:root[data-calgrid="subtle"] .cal{background:color-mix(in srgb,var(--line) 45%,var(--surface));border-color:color-mix(in srgb,var(--line) 60%,transparent)}
:root[data-calgrid="subtle"] .wday{border-color:color-mix(in srgb,var(--line) 50%,transparent)}
:root[data-calgrid="none"] .cal{gap:0;background:var(--surface);border-color:transparent}
:root[data-calgrid="none"] .cal .dow{background:var(--surface)}
:root[data-calgrid="none"] .wday{border-color:transparent}
:root[data-calgrid="none"] .wday.today{border-color:var(--accent)}
:root[data-today="outline"] .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
:root[data-today="outline"] .day.today .dn b{background:none;color:var(--accent);font-weight:700;padding:0}
:root[data-today] .wday.today{border-color:var(--accent)}
:root[data-today="column"] .day.today{background:var(--accent-soft)}
:root[data-today="column"] .day.today .dn b{background:none;color:var(--accent);font-weight:700;padding:0}
:root[data-today="column"] .wday.today{background:var(--accent-soft);border-color:transparent}
.pr-input{width:180px;max-width:100%}

/* ---------- floating task window + safe zones ---------- */
.pip-body{background:var(--surface);margin:0}
.pip{padding:12px 14px 20px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--jc,transparent);min-height:100vh;box-sizing:border-box}
.pip-top{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:calc(12px*var(--ts))}
.pip-top .dot{width:8px;height:8px;border-radius:2px;flex:none}
.pip-crumb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pip-name{margin:0;font:700 calc(17px*var(--ts))/1.25 var(--display);overflow-wrap:anywhere}
.pip-st{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.pip-links{display:flex;flex-wrap:wrap;gap:6px}
.pip-links .btn{max-width:100%}
.pip section{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.pip h2{margin:0 0 4px;display:flex;align-items:center;gap:8px;font:700 calc(11px*var(--ts)) var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.pip h2 small{font:500 calc(11px*var(--ts)) var(--mono);letter-spacing:0;text-transform:none}
.pip h2 .btn{margin-left:auto;text-transform:none;letter-spacing:0}
.pip-ck{display:flex;align-items:flex-start;gap:8px;padding:4px 2px;cursor:pointer;border-radius:6px}
.pip-ck:hover{background:var(--surface-2)}
.pip-ck input{margin-top:3px;accent-color:var(--accent);flex:none}
.pip-ck.done span{text-decoration:line-through;color:var(--muted)}
.pip-note{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:8px;background:var(--surface-2)}
.pip-note .note-done{width:22px;height:22px;flex:none}
.pip-note .note-body{min-width:0;flex:1}
.pip-note .note-body p{margin:0}
.fmt-pick .fmt-sz{background:none;border:1px dashed var(--line-strong);color:var(--accent);font-family:var(--body)}
.sz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.sz-card{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.sz-card small{color:var(--muted);font-size:calc(11px*var(--ts))}
.sz-prev{width:100%;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:linear-gradient(160deg,#3b4a63,#1b2230)}
.sz-prev img{width:100%;height:100%;display:block}

/* ---------- smart names, new client, up next ---------- */
.smart-hint{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:calc(12px*var(--ts));color:var(--muted);margin:-4px 0 4px}
.smart-hint .sh-tip{color:var(--faint)}
.smart-hint .sh-lbl{font-weight:600;color:var(--accent)}
.smart-hint .sh-chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--text);font-weight:600}
.smart-hint .sh-chip .i{width:12px;height:12px}
.smart-hint .sh-name{color:var(--faint)}
.cu-steps{margin:4px 0 10px 18px;padding:0;font-size:calc(13px*var(--ts));color:var(--muted);display:grid;gap:3px}
.cu-token{flex:1;min-width:180px;font-family:var(--mono)}
.cu-ws{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;margin-bottom:10px}
.cu-ws-h{display:flex;align-items:center;gap:8px}
.cu-ws-h .cu-rm{margin-left:auto}
.cu-sum{margin:-4px 0 0!important}
.cu-add{background:var(--accent-soft)}
.cu-dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.cu-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:calc(13px*var(--ts))}
.cu-row>span{min-width:96px;color:var(--muted)}
.cu-ws .hint{margin:0}
.tl-item.cu-c{align-items:flex-start}
.tl-item.cu-c .tl-text{flex:1;min-width:0}
.tl-item.cu-c small{color:var(--faint)}
.cu-body{margin-top:3px;padding:7px 10px;border-radius:8px;background:var(--surface-2,var(--bg));border:1px solid var(--line);font-size:calc(13px*var(--ts));overflow-wrap:anywhere}
.cu-body p{margin:0 0 4px}.cu-body p:last-child{margin:0}
.l-ic.k-clickup{color:#7b68ee}
.cu-new{display:inline-flex;align-items:center;gap:3px;vertical-align:1px;margin-right:6px;padding:1px 7px;border-radius:999px;background:#7b68ee;color:#fff;font-size:calc(10.5px*var(--ts));font-weight:800;letter-spacing:.03em;text-transform:uppercase;line-height:1.5;white-space:nowrap}
.cu-new.upd{background:color-mix(in srgb,#7b68ee 18%,var(--surface));color:#7b68ee;text-transform:none;letter-spacing:0}
.cu-banner p{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cu-banner p .i{width:16px;height:16px;color:#7b68ee}
.dm-g{border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:10px;display:grid;gap:4px}
.dm-row{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
.dm-row:hover{background:var(--hover,var(--accent-soft))}
.dm-row.on{background:var(--accent-soft)}
.dm-row input{margin-top:3px;accent-color:var(--accent)}
.dm-main{flex:1;min-width:0;display:grid;gap:2px}
.dm-main b{font-size:calc(14px*var(--ts));overflow-wrap:anywhere}
.dm-main small{color:var(--muted);font-size:calc(12px*var(--ts))}
.dm-tag{font-size:calc(11px*var(--ts));font-weight:700;color:var(--accent);padding:2px 8px;border-radius:999px;border:1px solid var(--accent)}
.dm-foot{display:flex;justify-content:flex-end;padding:2px 4px 4px}
.dup-warn{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:2px 0 8px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--st-rev) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--st-rev) 40%,var(--line));font-size:calc(13px*var(--ts));color:var(--text)}
.dup-warn>.i{width:16px;height:16px;color:var(--st-rev);flex:none}
.dup-warn>span{flex:1;min-width:180px}
.dup-warn .dw-btns{display:flex;gap:6px;margin-left:auto}
.newcl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.newcl input{flex:1;min-width:120px}
.upnext{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.upnext h3{margin:0;display:flex;align-items:center;gap:8px;font:700 calc(13px*var(--ts)) var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.upnext h3 .count{font:500 calc(12px*var(--ts)) var(--mono);color:var(--faint);text-transform:none}
.upnext .un-hint{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;color:var(--faint);font-size:calc(12px*var(--ts))}
.un-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.un-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto auto;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--jc);border-radius:10px;cursor:pointer}
.un-row:hover{border-color:var(--line-strong);border-left-color:var(--jc)}
.un-row.dragging{opacity:.4}
.un-row.drop-before{box-shadow:0 -2px 0 var(--accent)}
.un-row.drop-after{box-shadow:0 2px 0 var(--accent)}
.un-n{font:700 calc(13px*var(--ts)) var(--mono);color:var(--accent);min-width:16px;text-align:center}
.un-row .pc-main{display:flex;flex-direction:column;min-width:0}
.un-row .pc-main b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.un-row .pc-main small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.un-chip{display:inline-flex;align-items:center;gap:3px;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.chip.un-chip .i{width:11px;height:11px}
#bulk-push{max-width:150px}
@media (max-width:820px){.un-row{grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px}.un-row .pill{display:none}.un-row .date{display:none}.upnext .un-hint{display:none}}

/* ---------- focus timer ---------- */
.pomo-wrap{position:relative;flex:none}
.pomo-btn{height:38px;min-width:38px;padding:0 10px;border:1px solid var(--line);background:var(--surface);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font:600 calc(13px*var(--ts)) var(--mono)}
.pomo-btn:hover{border-color:var(--line-strong);color:var(--text)}
.pomo-btn.running{color:#fff;background:#e5484d;border-color:#e5484d}
.pomo-btn.running.m-short,.pomo-btn.running.m-long{background:var(--st-done);border-color:var(--st-done)}
.pomo-btn.paused{color:#e5484d;border-color:color-mix(in srgb,#e5484d 50%,var(--line))}
.pomo-btn .i{width:17px;height:17px}
.pomo-pop{width:min(330px,calc(100vw - 32px));padding:14px;display:flex;flex-direction:column;gap:12px;overflow:visible;max-height:none}
.pp-modes{display:flex;width:100%}
.pp-modes button{flex:1;padding:5px 6px;font-size:calc(12px*var(--ts))}
.pp-time{text-align:center;font:700 calc(46px*var(--ts))/1 var(--mono);letter-spacing:-.02em;color:#e5484d;padding:6px 0}
.pp-time.m-short,.pp-time.m-long{color:var(--st-done)}
.pp-task{display:flex;align-items:center;gap:6px;min-height:28px}
.pp-task .hint{margin:0;font-size:calc(12px*var(--ts))}
.pp-link{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:var(--surface-2);border-radius:8px;padding:6px 8px;text-align:left;font-weight:600;color:var(--text)}
.pp-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-btns{display:flex;gap:6px}
.pp-btns .btn{flex:1;justify-content:center}
.pp-foot{display:flex;align-items:center;gap:8px;font-size:calc(12px*var(--ts));color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.pp-foot span{flex:1}
.d-pomo{position:relative}
.d-pomo .dp-n{position:absolute;top:1px;right:0;font:700 calc(9px*var(--ts)) var(--mono);color:#e5484d}
.chip.pomo-chip{display:inline-flex;align-items:center;gap:3px;color:#e5484d;border-color:color-mix(in srgb,#e5484d 35%,transparent);background:color-mix(in srgb,#e5484d 9%,transparent)}
.chip.pomo-chip .i{width:11px;height:11px}
.pomo-nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pomo-num{display:flex;flex-direction:column;gap:4px;font-size:calc(12px*var(--ts));color:var(--muted);font-weight:600}
.pomo-num input{width:100%}
.pomo-num small{font-weight:500;color:var(--faint)}
.pip-timer{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:color-mix(in srgb,#e5484d 10%,var(--surface));font-size:calc(12px*var(--ts));color:var(--muted)}
.pip-timer .pt-mode{display:inline-flex;align-items:center;gap:5px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pip-timer b{font:700 calc(16px*var(--ts)) var(--mono);color:#e5484d}
@media (max-width:820px){.pomo-btn{height:34px;min-width:34px;padding:0 8px}}

/* ---------- all clear, reactions, seasonal ---------- */
.all-clear{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--st-done) 35%,var(--line));background:color-mix(in srgb,var(--st-done) 8%,var(--surface))}
.ac-art{width:52px;height:52px;flex:none;color:var(--text)}
.ac-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ac-text b{font:700 calc(16px*var(--ts)) var(--display)}
.ac-text span{color:var(--muted)}
.ac-text small{color:var(--faint);font-size:calc(12px*var(--ts))}
@media (prefers-reduced-motion:no-preference){:root:not([data-motion="reduce"]) .ac-art{animation:acSway 4s ease-in-out infinite;transform-origin:50% 90%}}
@keyframes acSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.reacts{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.react{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 7px;font-size:calc(13px*var(--ts));line-height:1.5;display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.react.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft)}
.react.add{border-style:dashed;font-weight:600;font-size:calc(12px*var(--ts))}
.react.add .i{width:14px;height:14px}
.react.add:hover,.react.add.open{color:var(--text);border-color:var(--line-strong)}
.react-add-wrap{position:relative;display:inline-flex}
.react-pick{position:absolute;bottom:calc(100% + 6px);left:0;display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-lg);z-index:5}
.react-pick button{border:0;background:none;font-size:calc(18px*var(--ts));width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.react-pick button:hover,.react-pick button.on{background:var(--surface-2)}
.greet .sea-note{margin-left:8px;font-weight:600;color:var(--accent)}
.season-fx{position:fixed;inset:0;pointer-events:none;z-index:79;overflow:hidden}
.season-fx i{position:absolute;top:-30px;font-style:normal;opacity:0;animation:seaFall linear forwards;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.25)}
.season-fx.s-halloween i,.season-fx.s-valentine i{animation-name:seaRise;top:auto;bottom:-30px;text-shadow:none}
@keyframes seaFall{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.9}90%{opacity:.8}100%{opacity:0;transform:translate(var(--dx),105vh) rotate(180deg)}}
@keyframes seaRise{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}85%{opacity:.8}100%{opacity:0;transform:translate(var(--dx),-105vh)}}
.season-fx b{position:absolute;width:5px;height:5px;border-radius:50%;opacity:0;animation:seaBurst 1.3s ease-out forwards}
@keyframes seaBurst{0%{opacity:1;transform:translate(0,0) scale(1)}80%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 30px)) scale(.4)}}
:root[data-theme="light"] .season-fx.s-december i{color:#9cc3e6}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .season-fx.s-december i{color:#9cc3e6}}

/* ---------- office cat + loading ---------- */
.office-cat{align-self:flex-end;position:relative;margin:-44px 14px 0 0;width:40px;height:40px;padding:0;border:0;background:none;cursor:pointer;flex:none}
.office-cat .cat-body{position:relative;width:40px;height:40px;display:block;transform-origin:50% 100%;image-rendering:pixelated}
.office-cat .cat-sky{position:absolute;left:50%;bottom:0;width:60px;height:45px;transform:translateX(-50%);border:2px solid var(--line-strong);border-bottom:0;border-radius:5px 5px 0 0;box-sizing:content-box}
.office-cat .cat-hat .i{display:none}
.cat-sky .star{animation:twinkle 3s ease-in-out infinite}
.cat-sky .star.s2{animation-delay:1.5s}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.25}}
:root[data-motion="reduce"] .cat-sky .star{animation:none}
.office-cat .pose-sleep{display:none}
.office-cat.sleep .pose-sleep{display:inline}
.office-cat.sleep .pose-sit{display:none}
.office-cat .cat-eye{transform-box:fill-box;transform-origin:center;animation:catBlink 5s infinite}
@keyframes catBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.cat-z{position:absolute;right:-2px;top:0;display:none;font:700 calc(10px*var(--ts)) var(--mono);color:var(--faint);pointer-events:none}
.office-cat.sleep .cat-z{display:block}
.cat-z i{position:absolute;font-style:normal;opacity:0;animation:catZ 3s infinite}
.cat-z i:nth-child(2){animation-delay:1s}.cat-z i:nth-child(3){animation-delay:2s}
@keyframes catZ{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-10px)}}
.cat-bubble{position:absolute;left:50%;top:-14px;transform:translate(-50%,0);white-space:nowrap;font:600 calc(11px*var(--ts)) var(--body);color:#e5484d;pointer-events:none}
body.side-mini .office-cat{display:none}
.sec-hint{margin-left:auto;font:400 calc(11px*var(--ts)) var(--body);color:var(--faint);text-transform:none;letter-spacing:0}
@media (hover:none){.sec-hint{display:none}}
.xn-row{display:flex;align-items:center;gap:6px}
.xn-val{flex:1;min-width:0;overflow-wrap:anywhere;font:500 calc(12.5px*var(--ts)) var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text);user-select:all}
.xn-edit{display:flex;flex-direction:column;gap:8px}
.xn-edit input{width:100%;font:500 calc(12.5px*var(--ts)) var(--mono);padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--text)}
.xn-prev{font-size:calc(12px*var(--ts));color:var(--muted);overflow-wrap:anywhere}
.xn-prev::before{content:'→ ';color:var(--faint)}
.xn-edit .hint code{font:calc(11px*var(--ts)) var(--mono);background:var(--bg);padding:0 3px;border-radius:4px}
.xn-btns{display:flex;gap:6px;align-items:center}.xn-btns span{flex:1}
.pip-xn .pip-copy{max-width:100%}.pip-xn .pip-copy span{font-family:var(--mono);overflow-wrap:anywhere;text-align:left}

.cat-sill{align-self:flex-end;position:relative;display:flex;flex-direction:row-reverse;flex-wrap:wrap-reverse;justify-content:flex-start;align-items:flex-start;gap:14px 6px;margin:calc(-1*var(--sillh,44px)) 14px 0 0;min-height:44px}

.cat-sill>[hidden]{display:none!important}
.cat-sill .office-cat{order:1}.sill-me{order:2}.sill-mug{order:3}.sill-pet{order:4}.sill-jar{order:5}.sill-plant{order:6}.sill-lamp{order:7}.sill-vinyl{order:8}.sill-cam{order:9}
.sill-me,.sill-mug,.sill-lamp,.sill-cam,.sill-vinyl{position:relative;z-index:1;padding:0;border:0;background:none;cursor:pointer;flex:none;display:block}

.sill-me.focus .me-phones,.sill-me.break .me-arms{display:inline}

.sill-me.focus .me-hands{animation:meType .5s steps(1) infinite}
@keyframes meType{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.sill-me.break .me-arms{animation:meArms 1.6s ease-in-out infinite}
@keyframes meArms{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.sill-me .cat-eye{transform-box:fill-box;transform-origin:center;animation:catBlink 6s infinite}
.sill-me .cat-bubble,.sill-mug .cat-bubble,.sill-cam .cat-bubble,.sill-vinyl .cat-bubble{color:var(--accent)}
.sill-mug{color:var(--faint)}
.sill-mug svg{width:17.5px;height:22.5px;display:block;transform-origin:30% 100%}
.sill-mug .mug-steam{display:none}
.sill-mug.steam .mug-steam{display:inline;animation:steam 2.2s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(1px)}40%{opacity:.85}100%{opacity:0;transform:translateY(-1px)}}
.sill-lamp svg{width:17.5px;height:30px;display:block}
.sill-lamp.on svg{filter:drop-shadow(0 0 5px rgba(255,216,77,.75))}
.sill-cam svg{width:20px;height:15px;display:block}
.sill-cam .cam-rec{opacity:.35}
.sill-cam.rec .cam-rec{opacity:1;animation:camRec 1.2s steps(1) infinite}
@keyframes camRec{50%{opacity:.2}}
.cam-flash{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(#fff 0 35%,rgba(255,255,255,0) 70%);pointer-events:none}
.sill-vinyl svg{width:22.5px;height:22.5px;display:block}
.sill-vinyl .vinyl-disc{transform-box:fill-box;transform-origin:center}
.sill-vinyl.spin .vinyl-disc{animation:reelSpin 1.8s linear infinite}
.sill-vinyl.spin .cat-notes{display:block;left:-6px}
.cat-sill.sleepy .sill-vinyl .vinyl-disc{animation-play-state:running}
:root[data-motion="reduce"] .sill-me .me-hands,:root[data-motion="reduce"] .sill-me .me-arms,:root[data-motion="reduce"] .sill-me .cat-eye,:root[data-motion="reduce"] .mug-steam,:root[data-motion="reduce"] .vinyl-disc,:root[data-motion="reduce"] .cam-rec{animation:none!important}
.fur-row,.sw-row{display:flex;flex-wrap:wrap;gap:6px}
.fur{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px 5px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font:600 calc(11px*var(--ts)) var(--body);color:var(--muted)}

.cork-stickers .stk{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transform:rotate(var(--r));font-size:calc(14px*var(--ts));line-height:1}

.stk-card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;color:var(--text);font:inherit}

.emo{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:calc(17px*var(--ts));line-height:1;padding:0}

.cat-sill .office-cat{margin:0}

.visitor{position:absolute;right:34px;bottom:47px;border:0;padding:0;background:none;cursor:pointer;z-index:3}

.photo-strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:4px 4px 10px;margin-top:auto}

/* ---------- installed app: title bar area (Window Controls Overlay) ---------- */

.ptr.ready .ptr-ic{background:var(--accent);color:var(--accent-ink)}

@media (max-width:820px){
  :root{--ts:calc(var(--tsu) * 1.08)}

  if(!cfg||!cfg.supabaseUrl||!cfg.supabaseAnonKey) return false;

  try{await loadScript(SB_JS)}catch(e){showAuth({error:"Couldn't load the sign-in service. Check your connection and reload the page."});return true}
  B.mode='cloud';B.cfg=cfg;
  B.sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{flowType:'implicit',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  // offline, the session check can stall while it retries a token refresh, so don't wait on it for long

async function cloudLoad(){

    const {data,error}=await B.sb.from('docs').select('col,id,data').order('col').order('id').range(from,from+999);
    if(error) throw error;

/* ================= ClickUp (hosted only, one way: ClickUp → app) =================
   A personal API token (kept server side in clickup_links) reads tasks assigned to you in the workspaces linked
   to jobs (job.clickup = {team, mode}). /api/clickup?action=sync creates and updates tasks (t.cu holds the ClickUp
   side: id, url, status, due, feed of comments and changes) and returns the docs it wrote, which are merged here. */
const CU_IC='<svg class="i" viewBox="0 0 16 16"><path d="M3 10.6 5.2 9c1 1.3 1.8 1.9 2.8 1.9s1.8-.6 2.8-1.9l2.2 1.6C11.6 12.6 10 13.6 8 13.6s-3.6-1-5-3z"/><path d="M4 6.6 8 3l4 3.6-1.5 1.6L8 6 5.5 8.2z"/></svg>';
const CU={loaded:false,connected:false,name:'',email:'',teams:[],lastSync:null,error:null,busy:null,disArmed:false,at:0,err:''};
async function cuApi(action,body){
  const {data:{session}}=await B.sb.auth.getSession();
  const r=await fetch('/api/clickup?action='+action,{method:'POST',headers:{Authorization:'Bearer '+(session?.access_token||''),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.error||'failed'),{code:j.error});
  return j;
}
function cuSet(j){Object.assign(CU,{loaded:true,connected:!!j.connected,name:j.name||'',email:j.email||'',teams:j.teams||[],lastSync:j.lastSync||null,error:j.error||null,errorMsg:j.errorMsg||j.msg||''});if(SM)renderSettings()}
async function cuStatus(){try{cuSet(await cuApi('status'));if(CU.connected)cuSoon(3000)}catch(e){CU.loaded=true;if(SM)renderSettings()}}
const cuJobs=()=>jobsSorted().filter(j=>j.clickup&&j.clickup.team);
let cuT=null,cuRunning=false;
function cuSoon(ms){if(B.mode!=='cloud'||!CU.connected)return;clearTimeout(cuT);cuT=setTimeout(()=>cuSync(),ms||0)}
/* merge the docs the server wrote; local edits still on the way win, field by field */
function cuMerge(docs){
  const before=stamps(S.tasks);let openHit=false;
  for(const d of docs||[]){const key=d.col+'/'+d.id;if(!S[d.col])continue;S[d.col][d.id]=merge({...d.data,id:d.id},pending[key]||{});if(d.col==='tasks'&&d.id===S.ui.openTask)openHit=true}
  markFresh(before);saveSnap();
  if(openHit&&!$('#drawer').contains(document.activeElement))renderDrawer();
  scheduleRender();
}
async function cuSync(manual,redo){
  if(cuRunning||B.mode!=='cloud'||!navigator.onLine)return;
  if(!manual&&(!CU.connected||!cuJobs().length||document.hidden))return;
  cuRunning=true;if(manual){CU.busy='sync';if(SM)renderSettings()}
  try{
    flushAll();await Promise.allSettled(Object.values(chains));
    const j=await cuApi(redo?'resync':'sync');cuMerge(j.docs);const made=j.created||0,changed=j.updated||0;
    cuSet(j);CU.at=Date.now();
    /* ClickUp allows about 100 requests a minute, so the rest comes in a minute later */
    if(j.more&&!j.error){clearTimeout(cuT);cuT=setTimeout(()=>cuSync(),65000);CU.more=true}else CU.more=false;
    if(j.error==='token')toast('ClickUp stopped accepting your token. Paste a new one in Settings → ClickUp.');
    else if(j.teamErrors&&manual)toast('One workspace’s token was rejected. Settings → ClickUp shows which.');
    else if(j.error&&manual)toast(j.msg?`The ClickUp check failed: ${j.msg}`:"Couldn't reach ClickUp. Try again in a minute.");
    else if(made||j.news)toast([made?`${made} new task${made===1?'':'s'}`:'',j.news?`${j.news} updated`:''].filter(Boolean).join(' and ')+' from ClickUp',{label:'Review',fn:cuReview});
    else if(manual)toast(j.more?`Updated ${changed} task${changed===1?'':'s'} from ClickUp. Bringing in the rest in a minute…`:changed?`Updated ${changed} task${changed===1?'':'s'} from ClickUp`:'Everything from ClickUp is already here');
  }catch(e){if(manual)toast("Couldn't reach ClickUp. Try again in a minute.")}
  CU.busy=null;cuRunning=false;if(SM)renderSettings();
}
async function cuConnect(){
  const tok=($('#cu-token')?.value||'').trim();
  if(!/^pk_/.test(tok)){CU.err='That doesn’t look like a ClickUp token. It starts with pk_.';renderSettings();return}
  CU.busy='connect';CU.err='';renderSettings();
  const had=CU.connected;
  try{const j=await cuApi('connect',{token:tok});cuSet(j);CU.adding=false;toast(had?`Added ${(j.added||[]).join(', ')||'the workspace'}. Pick its job below.`:`ClickUp connected as ${CU.name||'you'}. Now pick a job for each workspace.`)}
  catch(e){CU.err=e.code==='bad_token'?'ClickUp didn’t accept that token. Copy it again from ClickUp → Settings → Apps.':"Couldn't reach ClickUp. Try again in a minute."}
  CU.busy=null;if(SM)renderSettings();
}
async function cuRemove(team){
  CU.busy='remove';renderSettings();

async function cuDisconnect(){
  CU.busy='disconnect';CU.disArmed=false;renderSettings();

}
/* one job per workspace; picking a job for a workspace takes it off any other workspace */
function cuLink(team,jobId){
  for(const j of Object.values(S.jobs))if(j.clickup&&String(j.clickup.team)===String(team)&&j.id!==jobId){patch('jobs',j.id,{clickup:{team:'',mode:j.clickup.mode||'main',was:String(team)}});logAct('job',`ClickUp workspace unlinked from ${j.name}`,{jobId:j.id})}
  if(jobId&&S.jobs[jobId]){const j=S.jobs[jobId],t=(CU.teams||[]).find(x=>String(x.id)===String(team)),guess=t?.sum?.subShare>60?'sub':'main';
    patch('jobs',jobId,{clickup:{team:String(team),mode:j.clickup?.mode&&(!j.clickup.was||j.clickup.was===String(team))?j.clickup.mode:guess}});logAct('job',`ClickUp workspace linked to ${j.name}`,{jobId});cuSoon(800)}
  renderSettings();
}

/* ================= duplicate tasks (Settings → Duplicate tasks) =================
   Tasks in the same job with the same name (dupKey), not in Trash. Merging keeps one copy, fills its empty fields
   from the others (links, client, dates, notes, checklist steps, ClickUp link and comments, updates and history),
   then moves the other copies to Trash. */
let DM={keep:{},armed:null};
function dupeGroups(){
  const m={};
  for(const t of Object.values(S.tasks)){if(t._draft||t.deleted||!S.jobs[t.jobId])continue;const k=t.jobId+'|'+dupKey(t.name);if(!dupKey(t.name))continue;(m[k]=m[k]||[]).push(t)}
  return Object.entries(m).filter(([,ts])=>ts.length>1).map(([k,ts])=>({k,ts:ts.sort((a,b)=>dupeScore(b)-dupeScore(a))}));
}

function mergeTasks(keepId,ids){
  const k=S.tasks[keepId];if(!k)return;

  let notes=k.notes||'',ck=(k.checklist||[]).map(c=>({...c})),cu=k.cu?{...k.cu,feed:[...(k.cu.feed||[])]}:null;
  for(const id of ids){const d=S.tasks[id];if(!d||id===keepId)continue;

    for(const f of ['clientId','due','start','length','doneAt'])if(!k[f]&&!p[f]&&d[f])p[f]=d[f];
    if((!k.priority||k.priority==='normal')&&d.priority&&d.priority!=='normal')p.priority=d.priority;
    if((d.revision||0)>(p.revision??k.revision??0))p.revision=d.revision;
    if(d.pomos)p.pomos=(p.pomos??k.pomos??0)+d.pomos;
    if(d.pinned&&!k.pinned)p.pinned=true;
    if(d.upNext&&!k.upNext)p.upNext=d.upNext;
    if(d.notes&&!norm(notes).includes(norm(d.notes)))notes=notes?notes+'\n\n'+d.notes:d.notes;
    for(const c of d.checklist||[])if(!ck.some(x=>x.id===c.id||norm(x.text)===norm(c.text)))ck.push({...c});

}

/* ================= delivery specs (from the brief in a task's notes) =================
   specsOf(t) reads resolution, orientation, aspect, bitrate, fps, codec, loudness, length and captions from the
   notes (ClickUp briefs land there) and the task panel shows them as chips (`Specs` row). */
const SPEC_IC='<svg class="i" viewBox="0 0 16 16"><rect x="1.8" y="3.5" width="12.4" height="9" rx="1.5"/><path d="M5 7h2.5M5 9.5h6"/></svg>';
function specsOf(t){
  const s=String(t.notes||'').replace(/\*\*|__|`/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');if(!s.trim())return [];
  const out=[],add=(k,v)=>{if(v&&!out.some(x=>x.k===k))out.push({k,v})},m=re=>re.exec(s);
  let x;
  if((x=m(/\b(8k|6k|4k|uhd|2160p?|1440p|1080p|720p)\b/i)))add('res',/^(4k|uhd|2160p?)$/i.test(x[1])?'4K':x[1].toUpperCase().replace('P','p'));
  else if((x=m(/\b(\d{3,4})\s*[x×]\s*(\d{3,4})\b/)))add('res',`${x[1]}×${x[2]}`);
  if((x=m(/\b(horizontal|vertical|landscape|portrait|square)\b/i)))add('orient',x[1][0].toUpperCase()+x[1].slice(1).toLowerCase());
  if((x=m(/\b(16:9|9:16|1:1|4:5|4:3|21:9|2\.39:1)\b/)))add('aspect',x[1]);
  if((x=m(/(\d{1,3}(?:\.\d+)?)\s*(?:mbps|mb\/s|mbit)/i)||m(/(\d{1,3})\s*bit\s?rate/i)||m(/bit\s?rate[^\d\n]{0,12}(\d{1,3})/i)))add('bitrate',`${x[1]} Mbps`);
  if((x=m(/(\d{2}(?:\.\d+)?)\s*fps\b/i)||m(/frame\s?rate[^\d\n]{0,12}(\d{2}(?:\.\d+)?)/i)))add('fps',`${x[1]} fps`);
  if((x=m(/\b(prores\s*(?:4444|422)?(?:\s*(?:hq|lt|proxy))?|h\.?264|h\.?265|hevc|dnxh[dr])\b/i)))add('codec',x[1].replace(/\s+/g,' ').replace(/^prores/i,'ProRes').replace(/^h\.?26/i,'H.26').replace(/^hevc$/i,'HEVC').replace(/^dnx/i,'DNx'));
  if((x=m(/(-\s?\d{1,2}(?:\.\d)?)\s*lufs/i)))add('lufs',`${x[1].replace(/\s/g,'')} LUFS`);
  if((x=m(/(?:video\s+)?(?:length|duration|runtime)\s*[:\-–]\s*([\d:]+(?:\s*(?:min|mins|minutes|sec|secs|seconds|s))?|\d+\s*(?:-|to)\s*\d+\s*(?:min|mins|minutes|sec|secs|seconds|s))/i)))add('len',x[1].trim());
  if((x=m(/\b(long[\s-]?form|short[\s-]?form)\b/i)))add('form',/long/i.test(x[1])?'Long form':'Short form');
  if((x=m(/(?:caption|subtitle)s?[^\n:]{0,30}[:\-–]\s*(yes|no|burn(?:ed|t)?[\s-]?in|srt|open|closed)/i))){const v=x[1].toLowerCase();add('captions',v==='no'?'No captions':v==='yes'?'Captions':/burn/.test(v)?'Captions burned in':v==='srt'?'SRT captions':v==='closed'?'Closed captions':'Open captions')}
  return out;
}

  return f(SPEC_IC,'Specs',`<div class="spec-chips">${sp.map(x=>`<span class="spec spec-${x.k}">${esc(x.v)}</span>`).join('')}${mism?`<button type="button" class="btn sm ghost" data-act="fmt" data-fmt="${esc(asp.v)}" title="The brief asks for ${esc(asp.v)}">Set format to ${esc(asp.v)}</button>`:''}</div>`,'',true);

    const url=B.mode==='cloud'?`/api/rates?base=${base}`:`https://open.er-api.com/v6/latest/${base}`;
    fetch(url).then(r=>r.json()).then(j=>{const rates=j.rates;if(!rates)throw 0;const all=lsGet('cutroom.fx.v1')||{};all[base]={at:Date.now(),rates};lsSet('cutroom.fx.v1',all);scheduleRender();if(INV)invPreview()}).catch(()=>{}).finally(()=>{setTimeout(()=>{delete FX_LOAD[base]},60000)});}

function hlText(str,q){

  for(let j=low.indexOf(q);j>=0;j=low.indexOf(q,i)){out+=esc(str.slice(i,j))+'<mark>'+esc(str.slice(j,j+q.length))+'</mark>';i=j+q.length}

function searchHit(t){
  const q=qNow();if(!q)return '';
  if([t.name,S.clients[t.clientId]?.name,S.jobs[t.jobId]?.name].some(x=>String(x||'').toLowerCase().includes(q)))return '';
  const snip=(txt)=>{const i=txt.toLowerCase().indexOf(q),a=Math.max(0,i-30),b=Math.min(txt.length,i+q.length+50);return (a?'…':'')+hlText(txt.slice(a,b),q)+(b<txt.length?'…':'')};

  if(line)return `<div class="t-hit"><b>Notes</b>${snip(line.replace(/[*#]/g,''))}</div>`;
  const c=(t.checklist||[]).find(c=>(c.text||'').toLowerCase().includes(q));

const autoArchiveDays=()=>{const d=+pref('autoArchive');return [3,7,14].includes(d)?d:0};
function autoArchive(){
  const n=autoArchiveDays();if(!n||!S.ready)return;const t0=today();
