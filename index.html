  for(const [id,prev] of list){const t=S.tasks[id];if(!t)continue;logAct('status',`${stLabel(t.status)} → ${stLabel(prev.status)} (undone)`,{task:t});patch('tasks',id,{status:prev.status,revision:prev.revision,doneAt:prev.doneAt,...(prev.start!==undefined&&(S.tasks[id].start||'')!==prev.start?{start:prev.start}:{})})}
  render();if(S.ui.openTask)renderDrawer();
}
/* Deleting moves tasks to the Trash (deleted:true) for 30 days; Undo or the Trash page brings them back. */
function deleteTasks(ids){
  const ts=ids.map(id=>S.tasks[id]).filter(t=>t&&!t._draft&&!t.deleted);if(!ts.length)return;
  const at=today();
  for(const t of ts){logAct('delete','Moved to Trash',{task:t});if(S.ui.openTask===t.id)closeDrawer();SEL.delete(t.id);patch('tasks',t.id,{deleted:true,deletedAt:at})}
  render();
  toast(ts.length===1?`Moved “${ts[0].name||'task'}” to Trash`:`Moved ${ts.length} tasks to Trash`,{label:'Undo',fn:()=>restoreTrash(ts.map(t=>t.id),true)});
}
function restoreTrash(ids,quiet){
  ids.forEach(id=>{const t=S.tasks[id];if(t&&t.deleted){patch('tasks',id,{deleted:false,deletedAt:null});logAct('restore','Restored from Trash',{task:t})}});
  render();if(!quiet)toast(ids.length===1?`Restored “${S.tasks[ids[0]]?.name||'task'}”`:`Restored ${ids.length} tasks`);
}
function purgeTasks(ids){ids.forEach(id=>{const t=S.tasks[id];if(!t)return;dropTaskPicture(t);remove('tasks',id)})}
function purgeOldTrash(){const cut=new Date();cut.setDate(cut.getDate()-trashDays());const c=ymd(cut);purgeTasks(Object.values(S.tasks).filter(t=>t.deleted&&(t.deletedAt||'')<c).map(t=>t.id))}
let trashArmed=null;
/* CSV export in the layout of the user's own tracker sheet (no Notes column):
   a title row, headers, then month rows (by date assigned) with that month's tasks under them. */
function exportCSV(jobId){
  const all=jobId==='all',job=S.jobs[jobId],tl=job?.tools||{};
  const ts=Object.values(S.tasks).filter(t=>!t._draft&&!t.deleted&&S.jobs[t.jobId]&&(all||t.jobId===jobId));
  if(!ts.length){toast('No tasks to export yet');return}
  const assigned=assignedOn;
  ts.sort((a,b)=>(assigned(a)||'9999').localeCompare(assigned(b)||'9999')||(a.name||'').localeCompare(b.name||''));
  const us=d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return '';const [y,m,dd]=d.split('-');return `${m}/${dd}/${y}`};
  const years=new Set(ts.map(t=>assigned(t).slice(0,4)).filter(Boolean));
  const head=[...(all?['Job']:[]),'Client','Reel Title','No of Drafts','Date Assigned','Deadline','Status',all?'Storage link':(tl.storage||'Storage'),all?'Task link':(tl.tracker&&tl.tracker!=='None'?tl.tracker:'Task link'),all?'Review link':(tl.upload||'Review link')];
  const rows=[[`${all?'All jobs':job.name} Task Tracker`],head];let mo=null;
  for(const t of ts){
    const a=assigned(t),k=a.slice(0,7)||'none';
    if(k!==mo){mo=k;rows.push([k==='none'?'NO DATE':MONTH_FULL[+k.slice(5,7)-1].toUpperCase()+(years.size>1?' '+k.slice(0,4):'')])}
    const j=S.jobs[t.jobId],cl=S.clients[t.clientId];
    rows.push([...(all?[j.name]:[]),cl?cl.name:(j.type==='agency'?'':j.name),t.name||'',t.revision||'',us(a),us(t.due),stLabel(stOf(t)),t.links?.file||'',t.links?.task||'',t.links?.upload||'']);
  }
  const csv='\ufeff'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`${(all?'all-jobs':job.name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}-task-tracker-${today()}.csv`;
  document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast(`Exported ${ts.length} task${ts.length===1?'':'s'}`);
}
/* ================= Help & tips page (tab 'help') =================
   Searchable topics; "Open …" buttons jump to the matching Settings section or page. Keep this list in step with new features. */
const HELP_IC='<svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.6 1.6c-.6.3-.9.7-.9 1.3M8 11.3h.01"/></svg>';
const HELP=[
 ['Getting around','Pages and views',`The sidebar has the Overview, each job, Archived, Activity and Trash. On a job page, client tabs sit under the name, with Tasks, Details and Brand guide. Switch List, Board or Calendar in the toolbar; each job remembers its own view. The browser's Back button closes the task panel or goes to the previous page, and on a phone the tab bar at the bottom has Overview, Jobs, New task, Calendar and Search.`,null],
 ['Your work','Resume',`The Resume page (sidebar footer) is an A4 page laid out like your own resume. Tap any text to change it; Enter adds a new bullet and Backspace on an empty one removes it. Use + to add a job, school, skill or link, the arrows and × to reorder or remove, and "Add from my jobs" to start an entry from one of your jobs here. Download PDF saves just the page (choose "Save as PDF"). Import loads a resume file, and Save a copy downloads one. Prefer text boxes? Show form (on a phone it's the Edit tab) lists each part with plain fields; bullets and skills go one per line. Keep to one page tightens the spacing, then the text size a little, when it runs long; a red dashed line marks where page 2 would start, and a note says how many lines to trim if it still doesn't fit.`,null],
 ['Getting around','On your phone',`Swipe right anywhere to open the sidebar (from the very left edge when you're on the board or other things that scroll sideways), and swipe left to close it. The bar at the bottom has Overview, Notifications and Calendar (your jobs are in the sidebar); Notifications opens as a full-height sheet you can drag down to close (swipe a notification left to dismiss it), and Search opens full screen like Slack's, with the search bar at the bottom. The round + above the search button opens a menu with the focus timer, New job and New task.`,null],
 ['Getting around','Search',`The box top-right (press /) filters the current list and also searches notes, checklist steps and links. Quick search (${MODKEY}) jumps to any task, job, client or page, archived tasks included.`,null],
 ['Getting around','Right-click menu',`Right-click a task (or press and hold on a phone) to change its status or priority, pin, duplicate, split, copy its link, archive or delete it.`,null],
 ['Tasks','New tasks',`New task opens an unsaved draft; nothing is created until you click Save task. Double-click a name in the list or on the board to rename it. In the list, click the due date or priority to change it right there.`,null],
 ['Tasks','Statuses and Done',`Move a task along with the › button or the ✓ in the task panel. Moving to In progress fills in today as the start date if it's empty; moving to Revisions adds a revision round; Done gets a little confetti. Every status change can be undone from the message.`,['statuses','Statuses']],
 ['Tasks','Where footage comes from',`Each task has a files link for the raw footage. Its name follows the job's File storage tool (Edit job → Tools & folders): pick Descript there if a job sends its shoots as Descript links, and the task's link becomes "Descript files" with a Descript icon. For one job-wide link, paste it in the storage box of Tools & folders instead.`,null],
 ['Tasks','Paste a link to add it',`With a task open, press ${IS_MAC?'⌘V':'Ctrl+V'} anywhere in the panel (not inside a text box) and the link goes into the right slot: Frame.io or Vimeo into the review link, Drive, OneDrive, Dropbox, LucidLink or Descript into the files link, ClickUp or Asana into the task link, and a Mac path into the project folder. The job's own tools (Edit job → Tools & folders) decide first. Undo is in the message that pops up.`,null],
 ['Tasks','Export file names',`Each task panel shows an export name, like 260930_Client_Title_V2, with a copy button (it's in the floating window too). Click Pattern to set the naming for that client, or for the job when a task has no client: {date} today, {due}, {client}, {job}, {title}, {v} version (revision round + 1), {r}, {format} and {length}.`,null],
 ['Tasks','Split into tasks',`In a task's panel (or the right-click menu), Split into tasks turns one task into several: one name per line, each with the same job, client, links, dates and notes, and the checklist unticked.`,null],
 ['Your work','ClickUp',`In Settings → ClickUp, paste your ClickUp API token (ClickUp → Settings → Apps), then pick a job for each workspace. Tasks assigned to you come in on their own, with the client, due date, priority and task link; ClickUp comments, status and due-date changes show in the task's Activity tab, and new comments from others show in notifications. ClickUp gives each workspace its own token, so use Connect another workspace for the second one. Choose whether each video is the main task (subtasks become checklist steps) or a subtask (main tasks are batches). Nothing is sent back to ClickUp.`,['clickup','ClickUp']],
 ['Tasks','Drag on the Calendar',`On a computer, drag a task in the Calendar (month or week) onto another day to move its due date. A toast says when the new day is busy and has Undo. On a phone, change the date in the task panel.`,null],
 ['Tasks','Archive finished tasks on their own',`Done tasks can move to Archived by themselves 3, 7 or 14 days after they were finished, so the Done column stays short. It's off until you pick a time. Each one is logged, and Undo brings them back. Set it in Settings → Tasks & calendar.`,['tasks','Tasks & calendar']],
 ['Tasks','Delivery specs',`When a task's notes hold a brief (ClickUp briefs land there), the panel shows its specs as chips under the details: resolution, orientation, aspect, bitrate, frame rate, codec, loudness, length and captions. If the brief's aspect differs from the task's format, one click sets it.`,null],
 ['Your work','New from ClickUp',`Tasks the ClickUp sync brings in get a purple New badge, and tasks with new ClickUp comments or status or due-date changes show “2 new”. Opening the task clears it. Click Review on the message that pops up, the notification, or pick New from ClickUp in the due-date filter to see them all; Mark all as reviewed clears every badge.`,null],
 ['Your work','ClickUp mentions',`ClickUp comments that tag you (like “Hi @Kim, please update”) are marked “mentioned you” in the task's Activity tab, come first in notifications for a week, and have their own Mentions filter.`,null],
 ['Your work','Invoices',`Each job has an Invoices & docs tab. Upload the invoices you send (PDF or a picture) and set their month and amount, or click Create invoice: it fills in from the job's pay in Details (amount, currency, payment method), adds the next number (INV-2026-001…), can list the videos you finished that month, and saves a PDF. Your own name, address and payment details are kept for next time. Mark each one Sent or Paid; a sent invoice past its due date shows as overdue in notifications. Pick a currency in “Totals in” to see every job's paid and waiting amounts converted with a recent exchange rate. Below the invoices, Documents holds the job's contract, NDA, onboarding files and briefs.`,null],
 ['Tasks','Merge duplicate tasks',`Settings → Duplicate tasks lists tasks in the same job with the same name. Pick the copy to keep and click Merge: it gets anything it was missing from the others (links, client, dates, notes, checklist steps, the ClickUp link and comments, updates and history), and the other copies go to Trash, where you can still restore them.`,['dupes','Duplicate tasks']],
 ['Tasks','Same name twice',`If you save a new task with the same name as an open one in that job, the panel asks whether to open the one you already have or save the new one anyway.`,null],
 ['Tasks','Select several',`Turn on Select in the toolbar, tick tasks (Shift-click for a range), then set status, priority, due date, move them to another job or client, archive or delete them together.`,null],
 ['Tasks','Pins, templates and duplicates',`Pin a task to keep it at the top of the Overview. Save checklist steps as a template per client. Duplicate makes an unsaved copy to edit: same client (so the same brand guide), due date, links, notes and checklist (unticked), with a fresh status.`,null],
 ['Updates and notes','Updates and revision notes',`In a task's Activity tab, post updates with formatting, timecodes and pictures (paste a screenshot or drop it in). Tick an update when it's done, reply to it, or edit it. Tasks with open updates show a speech-bubble count in lists.`,null],
 ['Updates and notes','Notes formatting',`Notes support bold (${IS_MAC?'⌘':'Ctrl '}B), italic (${IS_MAC?'⌘':'Ctrl '}I), bullet and numbered lists and links. ${IS_MAC?'⌘':'Ctrl '}Z undoes typing in any text box.`,['keys','Keyboard shortcuts']],
 ['Links and files','Finder folders and Chrome profiles',`Paste a Finder path into a task's Project folder (Mac) and it opens in Finder through a one-time Shortcuts setup. A job can open its links in its own Chrome profile or Google account.`,['finder','Finder & Chrome']],
 ['Links and files','Brand guides',`Each client (or direct-client job) has a brand guide with colors, fonts, captions, music, do's and don'ts and PDFs. It shows in the task panel, and its do's and don'ts can be added to a checklist.`,null],
 ['Calendar','Calendar, holidays and shifts',`Month and Week views show tasks on their due dates, busy days, public holidays for your countries, and in Week view each job's shift hours. Days a job doesn't work are shaded on its page.`,['holidays','Holidays']],
 ['Calendar','Google Calendar',`Connect Google Calendar to put every open task with a due date into its own calendar, colored by job.`,['account','Calendar & account']],
 ['Your data','Backups and restore points',`Download a backup file any time, and (when signed in) the app keeps a weekly restore point on the server. You'll get a reminder if you haven't downloaded a backup in 30 days.`,['backup','Backup']],
 ['Your data','Trash and Archived',`Deleted tasks wait in Trash (7, 30 or 90 days) before they're gone. Archived keeps finished tasks out of your lists; filter it by job, client or month and restore several at once.`,['backup','Trash time']],
 ['Your data','Import from a spreadsheet',`Download your tracker sheet as CSV and import it; you'll see a preview first and existing tasks are skipped.`,['import','Import CSV']],
 ['Look and feel','Appearance',`Theme, color scheme, dark shade, status style, card depth, sidebar style, compact header and job card rings in Appearance; due date badges, tinted board columns, calendar grid and today marker, date format and week start in Tasks & calendar; the greeting, the office cat and the cork board in Personalize & fun. Everything previews live.`,['appearance','Appearance']],
 ['Getting work done','Type it all in the name',`When you add a task, type the client, the day and the priority right in the name: “Reel 7 Band fri !high”. A line under the name shows what will be picked up, and it's filled in when you save. Days: today, tomorrow, mon–sun, +3d, in 2 weeks, oct 2, 10/2. Priority: !urgent, !high, !low. Use @name to pick a client or job by its first letters.`,null],
 ['Getting work done','Focus timer',`A Pomodoro timer top-right, next to the bell: 25 minutes of focus, then a 5-minute break, and a 15-minute break after every 4 (change them in Settings). Press P or the tomato at the top of a task to focus on that task; each finished session adds 🍅 1 to it and a line to its activity. The same timer shows on all your devices and in the floating task window. Turn on the desktop pop-up in Settings to be told when time's up while you're in Premiere.`,['pomo','Focus timer']],
 ['Getting work done','Recent project folders',`On your Mac, quick search (⌘K) lists the last 5 project folders you opened from the app, from tasks, jobs or notes. Pick one to open it in Finder again; type to search older ones by task, job or folder name.`,null],
 ['Look and feel','Your cat, your desk',`Name the office cat and pick its fur (orange, black, white, grey, calico or tuxedo) in Settings → Personalize & fun; its name shows when you hover over it. Under Your desk you can add a pixel you beside the cat (pick hair, hair color, skin tone and hoodie): you wear headphones and type during a focus session and stretch through breaks. Desk items sit on the sill too: a coffee mug that steams during focus and refills after each session, a desk lamp that comes on at 6 pm (click to switch it), a camera (click to take a picture) and a record player that spins while the timer runs.`,['fun','Personalize & fun']],
 ['Look and feel','Sticker book',`You earn stickers for milestones: your first finished task, 10, 50, 100 and 250 done, finishing early, five in one day, surviving three revision rounds, a clean week with nothing overdue, focus sessions, a late-night finish, getting paid, and more. The newest show on the cork board; click them (or open Settings → Personalize & fun → Sticker book, or search “stickers” with ⌘K) to see the whole book. Tap a sticker to see when you earned it.`,['fun','Personalize & fun']],
 ['Your work','Job emoji',`Give a job an emoji in Edit job → General. It shows next to the job in the sidebar, on its Overview card and in notifications.`,null],
 ['Look and feel','Little extras',`An “All clear” moment on the Overview when nothing is overdue or due today; emoji reactions on client updates (the smiley under an update); film-look color schemes (Portra, Fuji, Noir, Teal & Orange, Technicolor); the office cat on the sidebar (it wears headphones and nods along during a focus session, naps during breaks and when you're away, stretches when you finish a task, and purrs when you click it; a little window behind it shows the sky for your time of day, and it dresses up in December, on New Year's Day and on Halloween; it sweats when something's overdue, smiles on all-clear days and watches your mouse; a plant on the sill grows a leaf per task done this month; birds and butterflies drop by; now and then it naps on one of your tasks until you open it; it peeks over the updates you post; a treat jar fills with a treat per finished task (click it to feed the cat); and after 30 days a puppy, hamster or goldfish can join it on the sill); a cork board in the sidebar with your photos and sticky notes (click + to pin one, click a note to edit it); a photo strip of your own pictures in the sidebar (add them in Settings → Personalize & fun); and seasonal touches: a Christmas countdown from September, snow in December, fireworks on New Year's Day, bats on Halloween and hearts on Valentine's. Turn them off in Settings → Personalize & fun.`,['fun','Personalize & fun']],
 ['Getting work done','Installed app (Chrome)',`Install Splice & Co. from Chrome's address bar (the install icon) to get its own window and Dock icon. The Dock icon shows how many tasks are overdue or due today; right-click it for New task, Overview, Calendar and Quick search. The app's colors reach into the title bar (Chrome's chevron at the top right switches that off). To have task links from Slack or email open in the app, turn on "Open supported links" in the app's settings (⋮ menu in the app window → App info or Settings).`,null],
 ['Getting work done','Phone: pull the task down to close',`On a phone, a task opens as a sheet from the bottom. Pull it down from the top (or anywhere when it's scrolled to the top) to close it; swipe sideways to go to the next or previous task.`,null],
 ['Getting work done','Pull to refresh',`At the top of any page, pull down (on a phone or tablet) or keep scrolling up with two fingers on the trackpad. When it says “Release to refresh”, let go and the app reloads with the latest data and any app updates.`,null],
 ['Getting work done','Save & add another',`Next to Save task: saves it and opens a fresh task for the same job, client and format, for entering a batch of reels in a row.`,null],
 ['Getting work done','Up next',`Your own queue across every job. Add a task from the right-click menu or the queue icon at the top of a task. The queue has its own page (Up next in the sidebar, or the Up next tab on a phone); drag to reorder. Finished tasks leave it on their own.`,null],
 ['Getting work done','Push due dates back',`Select tasks, then Push back… in the bar at the bottom: +1 day, +2 days, +1 week, or workdays that skip weekends. Undo puts the old dates back.`,null],
 ['Editing','Floating task window',`The window icon at the top of a task opens it in a small window that stays on top of Premiere or Resolve (Chrome on a computer). Tick checklist steps, resolve client updates, move the status on and open the links from there. The client's brand guide is there too: click a color to copy its hex code, or copy the fonts, CTA and end-card text. Click the icon again or close the window to stop.`,null],
 ['Editing','Safe-zone overlays',`See-through 1080×1920 PNG guides for TikTok, Reels and Shorts, plus one that combines all three. Put one on the top track of your timeline to keep text and faces clear of each app's buttons and captions, then turn it off before you export.`,['safezones','Safe-zone overlays']],
 ['Look and feel','Accessibility',`Text size, density, reduce motion, high contrast, relaxed line spacing and hover labels.`,['a11y','Accessibility']],
 ['Look and feel','Stat tiles and list columns',`The pencil on the numbers at the top picks which tiles show. In the List view, the sliders button hides columns and folds every group. Drag the sidebar's or task panel's edge to resize them.`,null],
];

/* ================= resume builder (tab 'resume', settings/resume) =================
   One A4 sheet laid out like the user's own resume (their Canva design): name, title, contact grid,
   numbered sections with thick underlines, dates on the left, "Role at Company" + bullets on the right,
   education with a place, and two columns of skills. Every text on the sheet is edited in place
   (contenteditable, data-rk = path into the resume doc). Download PDF prints just the sheet. */
const RS_IC='<svg class="i" viewBox="0 0 16 16"><path d="M4 1.5h5.5L13 5v9.5H4z"/><path d="M9.5 1.5V5H13"/><circle cx="7.2" cy="7.2" r="1.3"/><path d="M5.5 11c.4-1.2 1-1.8 1.7-1.8S8.5 9.8 8.9 11M10 8h1.5M10 10h1.5"/></svg>';
const RS_DEF=()=>({name:'Your Name',title:'Video Editor',contacts:[{label:'Phone',value:''},{label:'Email',value:''}],links:[{label:'Portfolio',url:''}],
  sections:[{id:'s1',kind:'jobs',title:'02 EMPLOYMENT HISTORY',items:[{start:'01/2024',end:'Present',role:'Video Editor',company:'Company name',bullets:['What you edited and for whom','A result you are proud of']}]},
    {id:'s2',kind:'edu',title:'03 EDUCATION',items:[{start:'',end:'',school:'School or university',place:'City',bullets:['Degree or course']}]},
    {id:'s3',kind:'skills',title:'04 SKILLS',skills:['Adobe Premiere Pro','Adobe After Effects','DaVinci Resolve','Videography']}]});
let RS=null,RS_T=0,RS_LINK=null,RSF=null,RSP_T=0;
function rsDoc(){if(!RS)RS=JSON.parse(JSON.stringify(S.settings.resume&&S.settings.resume.sections?S.settings.resume:RS_DEF()));return RS}
function rsSave(now){clearTimeout(RS_T);const go=()=>{RS_T=0;const d={...rsDoc()};delete d.id;delete d.updated;if(S.settings.resume)patch('settings','resume',d);else create('settings',d,'resume')};if(now)go();else RS_T=setTimeout(go,600)}
function rsGet(path){return path.split('.').reduce((o,k)=>o==null?o:o[k],rsDoc())}
function rsSet(path,v){const ks=path.split('.'),last=ks.pop();const o=ks.reduce((o,k)=>o[k],rsDoc());o[last]=v}
function rsFonts(){if(document.getElementById('rs-fonts'))return;const l=document.createElement('link');l.id='rs-fonts';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,700;1,400&family=Martel+Sans:wght@400;700&display=swap';document.head.appendChild(l)}
const rsE=(path,cls='',ph='')=>`<span class="rs-e ${cls}" contenteditable="true" spellcheck="true" data-rk="${path}" data-ph="${esc(ph)}">${esc(rsGet(path)||'')}</span>`;
const rsCtl=(path,i,n)=>`<span class="rs-ctl" data-noprint>${i>0?`<button type="button" data-act="rs-move" data-p="${path}" data-i="${i}" data-d="-1" title="Move up" aria-label="Move up">↑</button>`:''}${i<n-1?`<button type="button" data-act="rs-move" data-p="${path}" data-i="${i}" data-d="1" title="Move down" aria-label="Move down">↓</button>`:''}<button type="button" data-act="rs-del" data-p="${path}" data-i="${i}" title="Remove" aria-label="Remove">×</button></span>`;
function rsSheet(){
  const r=rsDoc();let h=`<div class="rs-sheet" id="rs-sheet"><h1 class="rs-name">${rsE('name','','Your name')}</h1><div class="rs-title">${rsE('title','','Your title')}</div>
    <div class="rs-contact">${r.contacts.map((c,i)=>`<div class="rs-c">${rsE(`contacts.${i}.label`,'rs-cl','Label')}${rsE(`contacts.${i}.value`,'rs-cv','Add')}</div>`).join('')}
    <div class="rs-c rs-links"><span class="rs-cl">Links</span><span class="rs-cv">${r.links.map((l,i)=>`<span class="rs-link">${rsE(`links.${i}.label`,'rs-a','Link name')}<button type="button" class="rs-lk" data-act="rs-link" data-i="${i}" data-noprint title="Link address" aria-label="Edit the link address">${LINK_IC}</button>${RS_LINK===i?`<input type="url" class="rs-url" data-rurl="${i}" data-fk="rs-url-${i}" value="${esc(l.url||'')}" placeholder="https://…" data-noprint>`:''}</span>`).join(' ')}<button type="button" class="rs-add sm" data-act="rs-add-link" data-noprint>+ link</button></span></div></div>`;
  r.sections.forEach((sec,si)=>{
    const P=`sections.${si}`;
    h+=`<section class="rs-sec k-${sec.kind}"><h2 class="rs-h">${rsE(P+'.title','','Section title')}</h2>`;
    if(sec.kind==='skills'){h+=`<div class="rs-skills">${(sec.skills||[]).map((k,i)=>`<div class="rs-skill">${rsE(`${P}.skills.${i}`,'','Skill')}${rsCtl(P+'.skills',i,sec.skills.length)}</div>`).join('')}</div><button type="button" class="rs-add" data-act="rs-add" data-p="${P}.skills" data-noprint>+ Add skill</button>`}
    else{
      h+=(sec.items||[]).map((it,i)=>{const Q=`${P}.items.${i}`;return `<div class="rs-item">${rsCtl(P+'.items',i,sec.items.length)}<div class="rs-dates">${rsE(Q+'.start','','MM/YYYY')} - ${rsE(Q+'.end','','Present')}</div>
        <div class="rs-main"><div class="rs-it">${sec.kind==='jobs'?`${rsE(Q+'.role','','Role')} at ${rsE(Q+'.company','','Company')}`:`${rsE(Q+'.school','','School')}<i class="rs-place">${rsE(Q+'.place','','City')}</i>`}</div>

/* fit the sheet to the screen, keep it to one A4 page when asked (tighter spacing first, then slightly smaller
   type, never below a readable minimum), draw where each page ends, and say how much is left over */
function rsFit(){
  const w=$('.rs-wrap'),sh=$('#rs-sheet');if(!w||!sh||!sh.offsetWidth)return;
  sh.style.zoom='';sh.classList.add('rs-measure');const A=297/210,over=()=>sh.scrollHeight/sh.offsetWidth-A;
  sh.querySelectorAll('.rs-break').forEach(x=>x.remove());
  let sc=1,f=1;sh.style.setProperty('--s','1');sh.style.setProperty('--f','1');
  if(rsDoc().fit!==false){
    while(over()>.002&&sc>.5){sc=Math.round((sc-.05)*100)/100;sh.style.setProperty('--s',sc)}
    while(over()>.002&&f>.86){f=Math.round((f-.02)*100)/100;sh.style.setProperty('--f',f)}
  }
  const ex=over(),pages=Math.max(1,Math.ceil((sh.scrollHeight/sh.offsetWidth)/A-.002));sh.classList.remove('rs-measure');
  for(let k=1;k<pages;k++){const b=document.createElement('div');b.className='rs-break';b.setAttribute('data-noprint','');b.style.top=`calc(${k}*297mm)`;b.innerHTML=`<span>Page ${k+1} starts here</span>`;sh.appendChild(b)}
  const warn=$('#rs-warn');
  if(warn){if(ex>.002){const lines=Math.ceil(ex*595.3/(12*f));warn.hidden=false;warn.innerHTML=rsDoc().fit!==false?`<b>Doesn't fit on one page.</b> Even at the smallest readable size it's about ${lines} line${lines===1?'':'s'} too long. Remove or shorten a few bullets to keep it to one page.`:`<b>This runs onto ${pages} pages.</b> Turn on “Keep to one page” to tighten it, or trim about ${lines} line${lines===1?'':'s'}.`}else warn.hidden=true}
  const z=Math.min(1,(w.clientWidth-2)/sh.offsetWidth);sh.style.zoom=z<1?String(z):'';
}

/* ---------- type it all in the name (new tasks only) ----------
   "Reel 7 Band fri !high" → name "Reel 7", client Band, due Friday, High priority. Applied on Save; a hint under the name shows what will be picked up. */
const PRIO_WORDS={urgent:'urgent',u:'urgent',high:'high',h:'high',normal:'normal',n:'normal',low:'low',l:'low'};
const WD_WORDS=[['sun','sunday'],['mon','monday'],['tue','tues','tuesday'],['wed','weds','wednesday'],['thu','thur','thurs','thursday'],['fri','friday'],['sat','saturday']];
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function parseSmart(name,t){
  let s=' '+String(name||'').replace(/\s+/g,' ')+' ';const out={found:false};
  const cut=re=>{const m=re.exec(s);if(!m)return null;s=s.slice(0,m.index)+' '+s.slice(m.index+m[0].length);return m};
  // priority: !high, !u …
  {const m=cut(/\s!(urgent|high|normal|low|u|h|n|l)(?=\s)/i);if(m){out.priority=PRIO_WORDS[m[1].toLowerCase()];out.found=true}}
  // due date (optionally after "due")
  const t0=parseD(today()),add=n=>{const d=new Date(t0);d.setDate(d.getDate()+n);return ymd(d)};
  const mon='(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\\.?';
  const monIdx=w=>['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(w.slice(0,3).toLowerCase());
  const md=(m,d)=>{if(m<0||m>11||d<1||d>31)return null;let dt=new Date(t0.getFullYear(),m,d);if(dt.getMonth()!==m)return null;if((dt-t0)/864e5<-7)dt=new Date(t0.getFullYear()+1,m,d);return ymd(dt)};
  const pre='\\s(?:due\\s+)?';
  const rules=[
    [new RegExp(pre+'(today|tod)(?=\\s)','i'),()=>add(0)],
    [new RegExp(pre+'(tomorrow|tmrw?|tmw)(?=\\s)','i'),()=>add(1)],
    [new RegExp(pre+'(?:in\\s+)?\\+?(\\d{1,2})\\s*(d|days?|w|wks?|weeks?)(?=\\s)','i'),m=>add(+m[1]*(/^w/i.test(m[2])?7:1))],
    [new RegExp(pre+'('+WD_WORDS.flat().join('|')+')(?=\\s)','i'),m=>{const w=WD_WORDS.findIndex(a=>a.includes(m[1].toLowerCase()));return add((w-t0.getDay()+7)%7)}],
    [new RegExp(pre+mon+'\\s+(\\d{1,2})(?:st|nd|rd|th)?(?=\\s)','i'),m=>md(monIdx(m[1]),+m[2])],
    [new RegExp(pre+'(\\d{1,2})(?:st|nd|rd|th)?\\s+'+mon+'(?=\\s)','i'),m=>md(monIdx(m[2]),+m[1])],
    [new RegExp(pre+'(\\d{1,2})/(\\d{1,2})(?=\\s)','i'),m=>pref('dateFmt')==='dm'?md(+m[2]-1,+m[1]):md(+m[1]-1,+m[2])]
  ];
  for(const [re,fn] of rules){const m=re.exec(s);if(!m)continue;
    // "+3d" or "in 3 days" only; a bare "3 d" inside a title is left alone
    if(re===rules[2][0]&&!/(\+|in\s)/i.test(m[0]))continue;
    const v=fn(m);if(v){s=s.slice(0,m.index)+' '+s.slice(m.index+m[0].length);out.due=v;out.found=true;break}}
  // client (or job): "@name", or a client's full name as words
  const job=S.jobs[t?.jobId];
  const pool=(job?.type==='agency'?shownClients(job.id):[]).concat(t?._any?Object.values(S.clients).filter(c=>!c.hidden&&c.jobId!==job?.id&&S.jobs[c.jobId]):[]);
  const at=/\s@([^\s]+)(?=\s)/.exec(s);
  let hit=null,hitStr=null;
  if(at){const w=at[1].toLowerCase().replace(/[-_]/g,' ');
    const cs=pool.filter(c=>c.name.toLowerCase().startsWith(w));
    if(cs.length===1){hit={client:cs[0]};hitStr=at[0]}
    else if(!cs.length){const js=jobsSorted().filter(j=>j.name.toLowerCase().startsWith(w));if(js.length===1){hit={job:js[0]};hitStr=at[0]}}}
  if(!hit){const cs=pool.map(c=>{const m=new RegExp('\\s'+reEsc(c.name.trim())+'(?=\\s)','i').exec(s);return m?{c,m}:null}).filter(Boolean).sort((a,b)=>b.c.name.length-a.c.name.length);
    if(cs.length&&(cs.length===1||cs[0].c.name.length>cs[1].c.name.length)){hit={client:cs[0].c};hitStr=cs[0].m[0]}}
  if(hit){s=s.replace(hitStr,' ');out.found=true;
    if(hit.client){out.clientId=hit.client.id;if(hit.client.jobId!==t?.jobId)out.jobId=hit.client.jobId}
    else{out.jobId=hit.job.id;out.clientId=null}}
  out.name=s.replace(/\s+/g,' ').trim().replace(/^[\s\-–—,·|:]+|[\s\-–—,·|:]+$/g,'').trim();
  return out;
}
function smartHintHtml(t){
  const sp=parseSmart(t.name,t);
  if(!sp.found)return `<span class="sh-tip">Tip: add a client, a day like “fri” or “+3d”, or “!high” to the name and they’re filled in when you save.</span>`;
  const bits=[];
  if(sp.clientId)bits.push(`${I.user}${esc(S.clients[sp.clientId]?.name||'')}`);
  else if(sp.jobId)bits.push(`${I.briefcase}${esc(S.jobs[sp.jobId]?.name||'')}`);
  if(sp.due)bits.push(`${I.cal}Due ${esc(fmtDate(sp.due))}`);
  if(sp.priority)bits.push(prioHtml(sp.priority));
  return `<span class="sh-lbl">On save:</span>${bits.map(b=>`<span class="sh-chip">${b}</span>`).join('')}<span class="sh-name">Name: “${esc(sp.name||t.name)}”</span>`;
}

/* ================= pictures ================= */
function downscale(file,max,type='image/jpeg'){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*r));c.height=Math.max(1,Math.round(img.naturalHeight*r));
      const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('encode')),type,.86);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'))};
    img.src=url;
  });
}
const toDataUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const canUpload=()=>B.mode!=='db'||!!B.assets;
/* Saves an image and returns what to store: an asset id (synced) or a data URL (this browser only). */
async function storeImage(file,max,localMax,type){
  if(!/^image\/(png|jpe?g|webp|gif)$/.test(file.type)) throw {code:'bad_type'};
  if(B.mode==='db'){
    if(!B.assets) throw {code:'not_granted'};
    const blob=await downscale(file,max,type);
    try{return (await B.assets.upload(blob,{type})).id}
    catch(e){if(e&&e.code==='store_unavailable'){await new Promise(x=>setTimeout(x,1200));return (await B.assets.upload(blob,{type})).id}throw e}
  }
  if(B.mode==='cloud'){
    const blob=await downscale(file,max,type);
    const path=`${B.uid}/${uid()}.${type==='image/png'?'png':'jpg'}`;
    const {error}=await B.sb.storage.from('pictures').upload(path,blob,{contentType:type,cacheControl:'31536000'});
    if(error) throw {code:/exceed|size/i.test(error.message||'')?'too_large':'upload'};
    return 'sb:'+path;
  }
  return toDataUrl(await downscale(file,localMax,type));
}
function uploadError(e){
  const c=e&&e.code;
  return c==='bad_type'?'Choose a PNG, JPG, WebP or GIF image.':c==='not_granted'?"Pictures can't be uploaded from this view.":c==='too_large'?'That image is too large. Try one under 20 MB.':c==='quota_or_state'?'Picture storage is full. Remove pictures from old tasks to free space.':c==='rate_limited'?'Too many uploads at once. Wait a moment and try again.':"Couldn't upload that picture. Try again.";
}
function dropImage(v){
  if(!v)return;v=String(v);
  if(B.mode==='cloud'&&v.startsWith('sb:'))B.sb.storage.from('pictures').remove([v.slice(3)]).catch(()=>{});
  else if(B.mode==='db'&&B.assets&&!v.startsWith('data:'))B.assets.delete(v).catch(()=>{});
}

/* ================= crop (logos) =================
   The square stage is exactly the saved picture. Zoom runs from "whole picture fits"
   (t=0, gaps stay transparent) up to 4x the "fills the square" scale. */
let CR=null;
const CROP_OUT=320;
function openCrop(file,done){
  if(!/^image\/(png|jpe?g|webp|gif)$/.test(file.type)){toast(uploadError({code:'bad_type'}));return}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    const w=img.naturalWidth,h=img.naturalHeight;
    if(!w||!h){URL.revokeObjectURL(url);toast("Couldn't read that picture. Try a PNG or JPG.");return}
    const fit=Math.min(1/w,1/h),cover=Math.max(1/w,1/h),max=cover*4;   // scales per 1px of stage
    CR={img,url,done,w,h,fit,max,coverT:Math.log(cover/fit)/Math.log(max/fit)||0,t:0,x:0,y:0,ptrs:new Map(),pinch:null};
    CR.t=CR.coverT;renderCrop();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast("Couldn't read that picture. Try a PNG or JPG.")};
  img.src=url;
}
function closeCrop(){if(!CR)return;URL.revokeObjectURL(CR.url);CR=null;const c=$('#crop');c.hidden=true;c.innerHTML=''}
const cropScale=()=>CR.fit*Math.pow(CR.max/CR.fit,CR.t);   // image px -> stage fraction
function cropClamp(){
  const k=cropScale(),lx=Math.abs(CR.w*k-1)/2,ly=Math.abs(CR.h*k-1)/2;
  CR.x=Math.max(-lx,Math.min(lx,CR.x));CR.y=Math.max(-ly,Math.min(ly,CR.y));
}
function cropApply(){
  if(!CR)return;cropClamp();
  const V=$('#crop-stage').clientWidth,k=cropScale()*V,im=$('#crop-img');
  im.style.width=CR.w*k+'px';im.style.height=CR.h*k+'px';
  im.style.transform=`translate(-50%,-50%) translate(${CR.x*V}px,${CR.y*V}px)`;
  const z=$('#crop-z');if(z&&+z.value!==Math.round(CR.t*1000))z.value=Math.round(CR.t*1000);
}
/* zoom keeping the stage centre fixed on the same spot of the picture */
function cropZoomTo(t){
  const k0=cropScale();CR.t=Math.max(0,Math.min(1,t));const r=cropScale()/k0;
  CR.x*=r;CR.y*=r;cropApply();
}
function renderCrop(){
  const c=$('#crop');
  c.innerHTML=`<div class="modal crop" role="dialog" aria-modal="true" aria-labelledby="crop-title">
  <header><h2 id="crop-title">Crop picture</h2><button type="button" class="icon-btn" data-act="crop-cancel" aria-label="Cancel">${I.x}</button></header>
  <div class="m-body">
    <div class="crop-stage" id="crop-stage" tabindex="0" aria-label="Picture position. Drag or use the arrow keys to move it, and plus or minus to zoom."><img id="crop-img" src="${esc(CR.url)}" alt="" draggable="false"><div class="crop-frame"></div></div>
    <label class="crop-zoom"><span class="crop-zi">−</span><input type="range" id="crop-z" min="0" max="1000" value="${Math.round(CR.t*1000)}" aria-label="Zoom"><span class="crop-zi">+</span></label>
    <p class="hint crop-hint">Drag the picture to choose what shows. The rounded corners show how it looks in the sidebar and on cards.</p>
  </div>
  <footer><div class="crop-quick"><button type="button" class="btn sm" data-act="crop-fit">Show whole picture</button><button type="button" class="btn sm" data-act="crop-fill">Fill the square</button></div>
  <div style="display:flex;gap:8px"><button type="button" class="btn" data-act="crop-cancel">Cancel</button><button type="button" class="btn primary" data-act="crop-use">Use picture</button></div></footer></div>`;
  c.hidden=false;
  const st=$('#crop-stage');
  st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);CR.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});CR.pinch=null;e.preventDefault()});
  st.addEventListener('pointermove',e=>{
    const p=CR&&CR.ptrs.get(e.pointerId);if(!p)return;
    const V=st.clientWidth;
    if(CR.ptrs.size===1){CR.x+=(e.clientX-p.x)/V;CR.y+=(e.clientY-p.y)/V;p.x=e.clientX;p.y=e.clientY;cropApply();return}
    p.x=e.clientX;p.y=e.clientY;
    const [a,b]=[...CR.ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(CR.pinch){const f=d/CR.pinch;cropZoomTo(CR.t+Math.log(f)/Math.log(CR.max/CR.fit))}
    CR.pinch=d;
  });
  const up=e=>{if(!CR)return;CR.ptrs.delete(e.pointerId);CR.pinch=null};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  st.addEventListener('wheel',e=>{e.preventDefault();cropZoomTo(CR.t-e.deltaY*0.0012)},{passive:false});
  st.addEventListener('keydown',e=>{
    const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
    if(m){e.preventDefault();CR.x-=m[0]*0.03;CR.y-=m[1]*0.03;cropApply()}
    else if(e.key==='+'||e.key==='='){e.preventDefault();cropZoomTo(CR.t+0.05)}
    else if(e.key==='-'||e.key==='_'){e.preventDefault();cropZoomTo(CR.t-0.05)}
  });
  $('#crop-z').addEventListener('input',e=>cropZoomTo(e.target.value/1000));
  requestAnimationFrame(()=>{cropApply();st.focus()});
}
function useCrop(){
  if(!CR)return;
  const k=cropScale()*CROP_OUT,cv=document.createElement('canvas');cv.width=cv.height=CROP_OUT;
  const ctx=cv.getContext('2d');ctx.imageSmoothingQuality='high';
  const dw=CR.w*k,dh=CR.h*k;
  ctx.drawImage(CR.img,CROP_OUT/2+CR.x*CROP_OUT-dw/2,CROP_OUT/2+CR.y*CROP_OUT-dh/2,dw,dh);
  const done=CR.done;
  cv.toBlob(b=>{closeCrop();if(b)done(new File([b],'logo.png',{type:'image/png'}));else toast("Couldn't crop that picture. Try another one.")},'image/png');
}

function saveModal(){
  const name=M.name.trim();if(!name){M.sec='general';M.mv='sec';renderModal();toast('Give the job a name.');$('#m-name')?.focus();return}
  const tools={...M.tools};
  const data={name,type:M.type,color:M.color,emoji:[...String(M.emoji||'').trim()].slice(0,4).join(''),tools,toolLinks:M.toolLinks,folder:(M.folder||'').trim(),account:(M.account||'').trim(),chromeProfile:(M.chromeProfile||'').trim(),logo:M.logo||null,work:{...M.work,days:[...M.work.days].sort()}};

        if(o.name!==n||o.order!==i||(o.logo||null)!==logo||!!o.hidden!==hid)patch('clients',c.id,{name:n,order:i,logo,hidden:hid});
        if(hid&&!o.hidden){const ts=Object.values(S.tasks).filter(t=>t.clientId===c.id&&!t.archived&&!t.deleted&&!t._draft),d=today();
          ts.forEach(t=>{patch('tasks',t.id,{archived:true,archivedAt:d});logAct('archive','Archived (client hidden)',{task:t})});
          logAct('job',`Client hidden: ${n}${ts.length?` (${ts.length} task${ts.length===1?'':'s'} archived)`:''}`,{jobId:id});hidNote.push(`${n}${ts.length?` · ${ts.length} task${ts.length===1?'':'s'} archived`:''}`)}
        if(!hid&&o.hidden)logAct('job',`Client shown again: ${n}`,{jobId:id})}
      else{create('clients',{jobId:id,name:n,order:i,logo});logAct('job',`Client added: ${n}`,{jobId:id})}
    });
  }

  gone.forEach(cid=>{if(!S.clients[cid])return;logAct('job',`Client removed: ${S.clients[cid].name}`,{jobId:id});remove('clients',cid);Object.values(S.tasks).filter(t=>t.clientId===cid).forEach(t=>patch('tasks',t.id,{clientId:null}))});
  const used=new Set([M.logo,...(M.type==='agency'?M.clients.filter(c=>c.name.trim()).map(c=>c.logo):[])].filter(Boolean));
  new Set([...M.orig,...M.uploaded]).forEach(v=>{if(!used.has(v))dropImage(v)});
  closeModal(false);
  S.ui.tab=id;S.ui.client='all';saveUi();render();
  toast(`Saved ${name}`);
}

/* ================= job work details (schedule, pay, location) ================= */
const MY_TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch(e){return 'UTC'}})();
const DAY_ORDER=[1,2,3,4,5,6,0];
const CURRENCIES=['USD','AUD','CAD','GBP','EUR','NZD','SGD','AED','HKD','JPY','PHP'];
const PERIODS=[{id:'month',label:'per month'},{id:'week',label:'per week'},{id:'day',label:'per day'},{id:'hour',label:'per hour'},{id:'project',label:'per project'},{id:'video',label:'per video'}];
const emptyWork=()=>({days:[],hours:'',shiftStart:'',shiftEnd:'',pay:{amount:'',currency:'USD',period:'month',payday:'',method:''},location:'',tz:'',contact:{name:'',reach:''},since:'',notes:''});
const workOf=j=>merge(emptyWork(),j?.work||{});
/* minutes a time zone is ahead of UTC right now (null if the browser doesn't know it) */
function tzOffset(tz,d=new Date()){
  try{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(d).map(x=>[x.type,x.value]));
    return Math.round((Date.UTC(+p.year,p.month-1,+p.day,p.hour%24,+p.minute)-Math.floor(d.getTime()/60000)*60000)/60000)}catch(e){return null}
}
const tzDiff=tz=>{const a=tzOffset(tz),b=tzOffset(MY_TZ);return a==null||b==null?null:a-b};
function diffLabel(tz){
  const m=tzDiff(tz);if(m==null)return '';if(!m)return 'same time as you';
  const h=Math.abs(m)/60,s=(Number.isInteger(h)?h:h.toFixed(1))+' h';
  return m>0?`${s} ahead of you`:`${s} behind you`;
}
const timeThere=tz=>{try{return new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',hour:'numeric',minute:'2-digit'}).format(new Date())}catch(e){return ''}};
const tzCity=tz=>String(tz||'').split('/').pop().replace(/_/g,' ');
/* Is it inside this job's shift right now? Shift times are the user's own time; overnight shifts count from the start day. */
function onShift(j,now=new Date()){
  const w=workOf(j);if(!w.shiftStart||!w.shiftEnd||!(w.days||[]).length)return false;
  const mins=x=>{const [h,m]=String(x).split(':').map(Number);return h*60+(m||0)};
  const a=mins(w.shiftStart),b=mins(w.shiftEnd),n=now.getHours()*60+now.getMinutes(),d=now.getDay(),has=x=>w.days.map(Number).includes(x);
  if(a===b)return false;
  return a<b?has(d)&&n>=a&&n<b:(has(d)&&n>=a)||(has((d+6)%7)&&n<b);
}
const shiftDot=j=>onShift(j)?`<span class="shift-dot" title="On shift now (${esc(fmtClock(workOf(j).shiftStart))}–${esc(fmtClock(workOf(j).shiftEnd))})" aria-label="On shift now"></span>`:'';
function fmtClock(hm,shift){
  if(!/^\d{1,2}:\d{2}$/.test(hm||''))return '';
  let [h,m]=hm.split(':').map(Number);let t=((h*60+m+(shift||0))%1440+1440)%1440;h=Math.floor(t/60);m=t%60;
  return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;
}
function daysLabel(days){
  const set=DAY_ORDER.filter(d=>(days||[]).includes(d));if(!set.length)return '';
  if(set.length===7)return 'Every day';
  const idx=set.map(d=>DAY_ORDER.indexOf(d)),run=idx.every((v,i)=>!i||v===idx[i-1]+1);
  return run&&set.length>2?`${WEEKDAY[set[0]]}–${WEEKDAY[set[set.length-1]]}`:set.map(d=>WEEKDAY[d]).join(', ');
}
const weeklyHours=w=>(parseFloat(w.hours)||0)*(w.days||[]).length;
const fmtNum=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
function payLabel(p){if(!p||p.amount===''||p.amount==null||isNaN(parseFloat(p.amount)))return '';return `${p.currency||''} ${fmtNum(parseFloat(p.amount))} ${(PERIODS.find(x=>x.id===p.period)||PERIODS[0]).label}`.trim()}
let TZ_OPTIONS=null;
function tzOptions(sel){
  if(!TZ_OPTIONS){
    let zones=[];try{zones=Intl.supportedValuesOf('timeZone')}catch(e){}
    if(!zones.length)zones=['UTC','Asia/Manila','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','America/Toronto','Europe/London','Europe/Paris','Europe/Berlin','Asia/Dubai','Asia/Singapore','Asia/Hong_Kong','Asia/Tokyo','Australia/Sydney','Australia/Melbourne','Australia/Perth','Pacific/Auckland'];
    TZ_OPTIONS=zones.map(z=>{const o=tzOffset(z);const sign=o<0?'−':'+',a=Math.abs(o||0);return {z,label:`${tzCity(z)} (${z.split('/')[0].replace(/_/g,' ')}) · UTC${sign}${Math.floor(a/60)}${a%60?':'+String(a%60).padStart(2,'0'):''}`,o:o||0}}).sort((a,b)=>a.o-b.o||a.label.localeCompare(b.label));
  }
  return `<option value="">Choose a time zone</option>${TZ_OPTIONS.map(x=>`<option value="${esc(x.z)}" ${x.z===sel?'selected':''}>${esc(x.label)}</option>`).join('')}`;
}
/* The "Work details" strip at the top of a job page */
function workCard(job){
  const w=workOf(job),items=[];
  const d=daysLabel(w.days),h=parseFloat(w.hours);
  if(d||h){
    const shift=w.shiftStart&&w.shiftEnd?`${fmtClock(w.shiftStart)}–${fmtClock(w.shiftEnd)} your time`:'';
    const diff=w.tz?tzDiff(w.tz):null;
    const there=shift&&w.tz&&diff?` · ${fmtClock(w.shiftStart,diff)}–${fmtClock(w.shiftEnd,diff)} their time`:'';
    items.push(['Schedule',[d,h?`${fmtNum(h)} h/day`:'',h&&w.days.length?`${fmtNum(weeklyHours(w))} h/week`:''].filter(Boolean).join(' · '),shift?shift+there:'']);
  }
  const pay=payLabel(w.pay);
  if(pay||w.pay.payday||w.pay.method)items.push(['Pay',pay||'—',[w.pay.payday?`Paid ${w.pay.payday}`:'',w.pay.method?`via ${w.pay.method}`:''].filter(Boolean).join(' ')]);
  if(w.location||w.tz)items.push(['Location',w.location||tzCity(w.tz),w.tz?`${timeThere(w.tz)} there · ${diffLabel(w.tz)}`:'']);
  if(w.contact.name||w.contact.reach)items.push(['Contact',w.contact.name||w.contact.reach,w.contact.name?w.contact.reach:'']);
  if(w.since)items.push(['Working together since',fmtLong(w.since),'']);
  if(!items.length&&!w.notes)return `<button class="work-empty" data-act="edit-job" data-id="${job.id}">${I.plus}Add your schedule, pay and their location</button>`;
  return `<section class="work">${items.length?`<div class="work-grid">${items.map(([k,v,s])=>`<div class="work-item"><small>${k}</small><b>${esc(v)}</b>${s?`<span>${esc(s)}</span>`:''}</div>`).join('')}</div>`:''}
    ${w.notes?`<div class="work-item work-notes"><small>Notes</small><span>${esc(w.notes)}</span></div>`:''}</section>`;
}
const fmtLong=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return s||'';const d=parseD(s);return `${MONTH_FULL[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`};

async function storeFile(file){
  if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name))throw {code:'bad_pdf'};
  if(file.size>20*1024*1024)throw {code:'too_large_pdf'};
  const type='application/pdf';
  if(B.mode==='db'){
    if(!B.assets)throw {code:'not_granted'};
    try{return (await B.assets.upload(file,{type})).id}
    catch(e){if(e&&e.code==='store_unavailable'){await new Promise(x=>setTimeout(x,1200));return (await B.assets.upload(file,{type})).id}throw e}
  }
  if(B.mode==='cloud'){
    const path=`${B.uid}/${uid()}.pdf`;
    const {error}=await B.sb.storage.from('pictures').upload(path,file,{contentType:type,cacheControl:'31536000'});
    if(error)throw {code:/mime|type|not allowed/i.test(error.message||'')?'pdf_setup':/exceed|size/i.test(error.message||'')?'too_large_pdf':'upload'};
    return 'sb:'+path;
  }
  if(file.size>2.5*1024*1024)throw {code:'local_pdf'};
  return toDataUrl(file);
}
async function addBrandPdf(file){
  const bm=BM;if(!bm||!file)return;
  bm.busy=true;renderBrand();
  try{const v=await storeFile(file);if(BM!==bm){dropImage(v);return}bm.uploaded.push(v);bm.b.pdfs.push({v,name:file.name,size:file.size,added:today()})}
  catch(e){console.error(e);const c=e&&e.code;toast(c==='bad_pdf'?'Choose a PDF file.':c==='too_large_pdf'?'That PDF is over 20 MB. Link to it instead.':c==='pdf_setup'?'PDF uploads need a one-time database update. See step 2 of SETUP.md.':c==='local_pdf'?'Files over 2.5 MB can only be stored when signed in. Link to it instead.':uploadError(e))}
  finally{if(BM===bm){bm.busy=false;renderBrand()}}
}

  const file={app:'splice-co',version:1,exported:new Date().toISOString(),data};

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`splice-co-backup-${today()}.json`;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  if(S.settings.app)patch('settings','app',{backupAt:today()});else create('settings',{backupAt:today()},'app');

async function readBackup(file){

document.addEventListener('keydown',e=>{

  if(CTX&&e.key==='Escape'){e.preventDefault();closeCtx();return}
  if(JUMP){
    if(e.key==='Escape'){e.preventDefault();closeJump();return}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=JUMP.items.length;if(n){JUMP.i=(JUMP.i+(e.key==='ArrowDown'?1:-1)+n)%n;renderJump()}return}
    if(e.key==='Enter'){e.preventDefault();jumpGo(JUMP.i);return}
    return;
  }
  if(e.key==='Escape'&&SEL.size&&$('#drawer').hidden&&$('#modal').hidden){clearSel();return}
  if(e.key==='Escape'){if(POMO_OPEN){POMO_OPEN=false;renderPomo();return}if(!$('#filter-sheet').hidden){closeFilters();return}if($('#side').classList.contains('open')){closeSide();return}if(INV){closeInv();return}if(STKB){closeStickers();return}if(BM){closeBrand();return}if(notesOpen){notesOpen=false;renderBell();$('#bell').focus();return}if(CR){closeCrop();return}if(SM)closeSettings(false);else if(!$('#modal').hidden)closeModal();else if(!$('#drawer').hidden)closeDrawer();return}
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
  if(e.key==='Enter'&&!typing){const r=e.target.closest?.('[data-act="open"]');if(r){openTask(r.dataset.id);return}}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='a'&&!$('#drawer').hidden&&$('#modal').hidden){const t=S.tasks[S.ui.openTask];if(t&&!t._draft){e.preventDefault();S.ui.dtab=S.ui.dtab==='activity'?'details':'activity';renderDrawer();return}}
  if(e.key==='/'){e.preventDefault();focusSearch()}
  else if(e.key==='p'&&S.ready&&$('#modal').hidden){e.preventDefault();pomoToggle(S.tasks[S.ui.openTask]&&!S.tasks[S.ui.openTask]._draft?S.ui.openTask:null)}
  else if(e.key==='n'&&$('#modal').hidden&&S.ready){e.preventDefault();const id=newTask();if(id){openTask(id);setTimeout(()=>$('.d-name')?.focus(),30)}}
});

    const it=e.target.closest('.card,.row[draggable]');clearDropMark();
    if(it&&it.dataset.id!==dragId&&col.contains(it)){const r=it.getBoundingClientRect();dropMark=it;it.classList.add(e.clientY>r.top+r.height/2?'drop-after':'drop-before')}}
});
document.addEventListener('keydown',e=>{if(e.target.id==='note-in'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();postNote()}});
document.addEventListener('keydown',e=>{
  if(LB){if(e.key==='Escape'){e.preventDefault();e.stopPropagation();LB=null;renderLightbox()}else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();LB.i=(LB.i+(e.key==='ArrowRight'?1:-1)+LB.list.length)%LB.list.length;renderLightbox()}return}
  if(e.target.id==='edit-in'){if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&EDIT_AT){e.preventDefault();saveEdit(EDIT_AT)}else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();EDIT_AT=null;renderDrawer()}}
},true);
document.addEventListener('keydown',e=>{
  if(e.target.id==='xn-in'){if(e.key==='Enter'){e.preventDefault();const t=S.tasks[S.ui.openTask];if(t)saveXn(t)}else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();XN_EDIT=null;renderDrawer()}}
},true);
document.addEventListener('keydown',e=>{if(e.target.id==='newcl-in'&&e.key==='Escape'){e.preventDefault();e.stopPropagation();NEWCL=null;renderDrawer()}},true);
document.addEventListener('paste',e=>{
  const id=e.target.id;if(id!=='note-in'&&id!=='reply-in')return;
  const files=[...(e.clipboardData?.files||[])].filter(f=>/^image\//.test(f.type));if(!files.length)return;
  e.preventDefault();attAdd(files,id==='note-in'?'note':'reply');
});
document.addEventListener('dragover',e=>{const z=e.target.closest?.('[data-drop-pics]');if(z&&[...(e.dataTransfer?.types||[])].includes('Files')){e.preventDefault();z.classList.add('drop-on')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest?.('[data-drop-pics]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('drop-on')});
document.addEventListener('drop',e=>{const z=e.target.closest?.('[data-drop-pics]');if(!z||!e.dataTransfer?.files?.length)return;e.preventDefault();z.classList.remove('drop-on');attAdd(e.dataTransfer.files,z.dataset.dropPics)});
document.addEventListener('keydown',e=>{if(e.target.id==='reply-in'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&REPLY_AT){e.preventDefault();postReply(REPLY_AT)}else if(e.target.id==='reply-in'&&e.key==='Escape'){e.preventDefault();e.stopPropagation();REPLY_AT=null;renderDrawer()}},true);
document.addEventListener('drop',e=>{
  const col=e.target.closest?.('[data-drop]');
  if(col&&dragId){e.preventDefault();const id=dragId,it=dropMark,after=it?.classList.contains('drop-after');clearDropMark();dragId=null;
    if(stOf(S.tasks[id])!==col.dataset.drop)setStatus(id,col.dataset.drop);
    if(it)dropOrder(col,id,it.dataset.id,after);
    render()}
});

/* Calendar: drag a task (month entry or week card) onto another day to move its due date; logged, with Undo */
let calDrag=null;
function moveDue(id,day){
  const t=S.tasks[id];if(!t||!day||t.due===day)return;const old=t.due||'';
  patch('tasks',id,{due:day});logAct('date',`Due date moved to ${fmtDate(day)}`,{task:t});render();
  const heavy=(dueLoad()[day]||0)>=dayLimit()&&!isClosed(t);
  toast(`“${t.name||'Task'}” due ${fmtDate(day)}${heavy?' · busy day':''}`,{label:'Undo',fn:()=>{const x=S.tasks[id];if(!x)return;patch('tasks',id,{due:old});logAct('date',old?`Due date set back to ${fmtDate(old)}`:'Due date removed',{task:x});render()}});
}
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-caldrag]');if(!c)return;calDrag=c.dataset.id;c.classList.add('dragging');document.body.classList.add('cal-dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',calDrag)}catch(x){}});
document.addEventListener('dragover',e=>{if(!calDrag)return;const d=e.target.closest?.('[data-calday]');document.querySelectorAll('.cal-drop').forEach(x=>x!==d&&x.classList.remove('cal-drop'));if(d){e.preventDefault();e.dataTransfer.dropEffect='move';d.classList.add('cal-drop')}});
document.addEventListener('dragend',()=>{if(!calDrag)return;calDrag=null;document.body.classList.remove('cal-dragging');document.querySelectorAll('.cal-drop,[data-caldrag].dragging').forEach(x=>x.classList.remove('cal-drop','dragging'))});
document.addEventListener('drop',e=>{if(!calDrag)return;const d=e.target.closest?.('[data-calday]'),id=calDrag;calDrag=null;document.body.classList.remove('cal-dragging');document.querySelectorAll('.cal-drop').forEach(x=>x.classList.remove('cal-drop'));if(!d)return;e.preventDefault();moveDue(id,d.dataset.calday)});

setInterval(()=>{if(S.ready&&!document.hidden&&$('#modal').hidden){autoArchive();scheduleRender()}},60000);
document.addEventListener('toggle',e=>{if(e.target.classList?.contains('d-brand')){S.ui.brandTaskOpen=e.target.open;saveUi()}},true);
placeTopRight();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
boot();
})();
</script>
