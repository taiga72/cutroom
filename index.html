<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eceef3; --surface-3:#e2e5ec;
  --line:#dadee6; --line-strong:#c4c9d4;
  --text:#161a22; --muted:#5b6272; --faint:#8a91a0;
  --accent:#0b7f93; --accent-ink:#ffffff; --accent-soft:#dff2f5;
  --side-bg:var(--surface);
  --st-not:#7d8596; --st-prog:#2f73e8; --st-review:#8b5cf6; --st-rev:#e07b00; --st-done:#2b9348; --st-client:#0b7f93; --st-wait:#c2417a; --st-drop:#9aa0a8;
  --danger:#d9362b; --danger-soft:#fde8e6; --warn:#b86b00;
  --shadow:0 1px 2px rgba(22,26,34,.06),0 4px 16px rgba(22,26,34,.06);
  --shadow-lg:0 12px 40px rgba(22,26,34,.18);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ts:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1015; --surface:#161920; --surface-2:#1d2129; --surface-3:#262b35;
    --line:#282d38; --line-strong:#363c49;
    --text:#e6e8ee; --muted:#9aa1b0; --faint:#6d7483;
    --accent:#2fb8cc; --accent-ink:#06191d; --accent-soft:#12303a;
    --st-not:#8b93a3; --st-prog:#5b9bff; --st-review:#a98bff; --st-rev:#ffa53d; --st-done:#4cc26f; --st-client:#2fb8cc; --st-wait:#ef6fa8; --st-drop:#6d7483;
    --danger:#ff6b5e; --danger-soft:#3a1c1a; --warn:#ffb14d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1015; --surface:#161920; --surface-2:#1d2129; --surface-3:#262b35;
  --line:#282d38; --line-strong:#363c49;
  --text:#e6e8ee; --muted:#9aa1b0; --faint:#6d7483;
  --accent:#2fb8cc; --accent-ink:#06191d; --accent-soft:#12303a;
  --st-not:#8b93a3; --st-prog:#5b9bff; --st-review:#a98bff; --st-rev:#ffa53d; --st-done:#4cc26f; --st-client:#2fb8cc; --st-wait:#ef6fa8; --st-drop:#6d7483;
  --danger:#ff6b5e; --danger-soft:#3a1c1a; --warn:#ffb14d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:calc(14px*var(--ts))/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:calc(12px*var(--ts));font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--side-bg);display:flex;flex-direction:column;gap:18px;padding:18px 12px}
:root[data-scheme] .side{--text:#fff;--muted:rgba(255,255,255,.78);--faint:rgba(255,255,255,.58);--line:rgba(255,255,255,.16);--surface-2:rgba(255,255,255,.1);--accent-soft:rgba(255,255,255,.2);--surface:rgba(255,255,255,.08);border-right-color:transparent;color:var(--text)}
:root[data-scheme] .side .brand-logo.def{background:#fff;border-radius:7px;padding:2px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
button.brand{border:0;background:none;text-align:left;border-radius:8px;min-width:0;padding-block:4px;margin-block:-4px}
button.brand:hover b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--text);display:grid;place-items:center}
.brand-mark span{display:block;width:12px;height:12px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 30%,transparent)}
.brand-logo{width:26px;height:26px;border-radius:7px;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--surface)}
.brand-logo.def{border:0;background:none;border-radius:0;object-fit:contain}
.brand b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font:700 calc(19px*var(--ts))/1 var(--display);letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:calc(11px*var(--ts));font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:8px 10px 6px;display:flex;align-items:center;justify-content:space-between}
.nav-label button{border:0;background:none;color:var(--muted);padding:2px;border-radius:5px;display:grid}
.nav-label button:hover{background:var(--surface-2);color:var(--text)}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;color:var(--text);font-weight:500;min-width:0}
.nav-item:hover{background:var(--surface-2)}
.nav-item.on{background:var(--accent-soft);color:var(--text)}
.nav-item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .count{font:500 calc(11px*var(--ts)) var(--mono);color:var(--faint)}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.nav-row{position:relative}
.nav-row .edit{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:26px;height:26px;opacity:0}
.nav-row:hover .edit,.nav-row .edit:focus-visible{opacity:1}
.nav-row:hover .nav-item .count{visibility:hidden}
.job-wrap{position:relative;display:flex;min-width:0}
.job-wrap .job-card{flex:1}
.job-wrap .edit{position:absolute;top:10px;right:10px}
@media (hover:none){.nav-row .edit{opacity:1}.nav-row .nav-item .count{visibility:hidden}}
.nav-sub{display:flex;flex-direction:column;gap:1px;margin:1px 0 4px 18px;padding-left:10px;border-left:1px solid var(--line)}
.nav-sub .nav-item{padding:5px 10px;font-weight:400;color:var(--muted);font-size:calc(13px*var(--ts))}
.nav-sub .nav-item.on{color:var(--text);font-weight:600}
.side-foot{margin-top:auto;padding:4px 0 0;font-size:calc(12px*var(--ts));color:var(--faint);display:flex;flex-direction:column;align-items:stretch;gap:4px;border-top:1px solid var(--line)}
.side-foot .save-state{padding:8px 10px 2px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--st-done)}
.sync-dot.local{background:var(--warn)}

.main{min-width:0;padding:22px 28px 60px;display:flex;flex-direction:column;gap:18px}

/* ---------- banner / header ---------- */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface);color:var(--muted);font-size:calc(13px*var(--ts))}
.banner p{margin:0;flex:1;min-width:220px}
.head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px}
.head-title{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px}
.head h1{margin:0;font:700 calc(28px*var(--ts))/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance;display:flex;align-items:center;gap:10px}
.head h1 .dot{width:14px;height:14px;border-radius:4px}
.head .sub{color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:calc(11px*var(--ts));font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tool{display:flex;flex-direction:column;gap:1px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-decoration:none;min-width:0}
.tool small{font-size:calc(10.5px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tool span{font-weight:600;display:flex;align-items:center;gap:5px}
a.tool:hover{border-color:var(--accent)}
a.tool svg{color:var(--faint)}
.client-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:-4px}
.client-tabs button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.client-tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.client-tabs button:hover{color:var(--text)}
.client-tabs .add{color:var(--accent)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;font-size:calc(13px*var(--ts));white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 8px;font-size:calc(12px*var(--ts))}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border:0;background:none;border-radius:7px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 13px;text-align:left;display:flex;flex-direction:column;gap:2px}
button.stat:hover{border-color:var(--line-strong)}
.stat.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stat small{font-size:calc(11px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat b{font:700 calc(24px*var(--ts))/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat.alert b{color:var(--danger)}
.stat.warn b{color:var(--st-rev)}

/* ---------- job cards ---------- */
.jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.job-card h3{padding-right:30px}
.job-card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.job-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.job-card h3{margin:0;font:700 calc(16px*var(--ts))/1.2 var(--display);display:flex;align-items:center;gap:8px}
.job-card .meta{color:var(--muted);font-size:calc(12.5px*var(--ts))}
.stack{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2);gap:1px}
.stack i{display:block;height:100%}
.job-card .next{font-size:calc(12.5px*var(--ts));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-card .next b{color:var(--text);font-weight:600}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-block:-8px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 10px;flex:1;min-width:160px;max-width:340px;color:var(--faint)}
.search input{border:0;background:none;outline:none;padding:7px 0;width:100%;color:var(--text)}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-size:calc(13px*var(--ts));font-weight:500;max-width:100%}
.toolbar .spacer{flex:1}
.restore-box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.details-head{display:flex;justify-content:flex-end;margin-bottom:10px}
.h1-edit{width:30px;height:30px;color:var(--faint)}
.h1-edit:hover{color:var(--text)}
.head h1 > span{min-width:0;overflow-wrap:anywhere}
#subnav:empty{display:none}
#subnav .pane-tabs{margin-top:0}
.d-h{margin:4px 0 8px;font:700 calc(14px*var(--ts)) var(--display);color:var(--muted)}
.details-head + .d-h{margin-top:0}
#view .tools{margin-bottom:14px}
.filters{display:contents}
.filter-btn{display:none;position:relative;padding:6px 9px}
.fdot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.filter-sheet{position:fixed;inset:0;z-index:45;background:rgba(10,12,16,.35);display:flex;align-items:flex-end;justify-content:center}
.filter-sheet[hidden]{display:none}
.fs-card{background:var(--surface);width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-lg)}
.fs-head{display:flex;align-items:center;justify-content:space-between}
.fs-head b{font:700 calc(16px*var(--ts)) var(--display)}
#fs-slot .filters{display:flex;flex-direction:column;gap:8px}
#fs-slot .sel{width:100%;padding:9px 10px;font-size:calc(14px*var(--ts))}
.fs-foot{display:flex;justify-content:space-between;gap:8px}
.d-draft{display:flex;align-items:center;gap:8px;padding:8px 18px;background:var(--accent-soft);font-size:calc(13px*var(--ts));position:sticky;top:0;z-index:2}
.d-draft span{color:var(--muted)}
.d-save{position:sticky;bottom:0;background:var(--surface);justify-content:flex-end;padding:12px 0 4px;margin-top:-4px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--text);color:var(--bg);font:600 calc(12px*var(--ts))/1.3 var(--body);padding:5px 8px;border-radius:6px;max-width:260px;box-shadow:var(--shadow);white-space:normal}
.mtop{display:none}
.side-scrim{display:none}
.brand-panel{border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden}
.bp-head h2{margin:0;font:700 calc(17px*var(--ts)) var(--display);display:flex;align-items:center;gap:8px}
.pane-tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line)}
.pane-tabs button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:calc(14px*var(--ts))}
.pane-tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.pane-tabs button:hover{color:var(--text)}
.pane-tabs + .client-tabs{margin-top:6px;border-bottom:0}
.brand-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.brand-card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bc-top{display:flex;align-items:center;gap:9px;font-size:calc(15px*var(--ts))}
.bc-sw{display:flex;gap:4px}
.bc-sw i{width:22px;height:22px;border-radius:5px;border:1px solid var(--line)}
.brand-card small{color:var(--faint);font-size:calc(12px*var(--ts))}
.bc-acts{display:flex;gap:6px;margin-top:auto}
.bp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px}
.brand-panel .bv{border-top:1px solid var(--line);padding:14px}
.bv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px 18px}
.bv.compact{grid-template-columns:1fr;gap:10px;padding-top:8px}
.bv-sec h5{margin:0 0 5px;font-size:calc(10.5px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.bv-sec p{margin:0;font-size:calc(13.5px*var(--ts));line-height:1.5}
.bv-colors{display:flex;flex-wrap:wrap;gap:6px}
.swatch{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px 4px 4px;text-align:left}
.swatch:hover{border-color:var(--accent)}
.swatch i{width:24px;height:24px;border-radius:5px;border:1px solid var(--line);flex:none}
.swatch span{display:flex;flex-direction:column;line-height:1.2}
.swatch b{font-size:calc(12.5px*var(--ts))}
.swatch small{font:500 calc(11px*var(--ts)) var(--mono);color:var(--muted)}
.bv-fonts{display:flex;flex-direction:column;gap:4px;font-size:calc(13.5px*var(--ts));font-weight:600}
.bv-fonts small{display:block;font-size:calc(11px*var(--ts));font-weight:500;color:var(--muted)}
.bv-dd{display:grid;grid-template-columns:1fr 1fr;gap:14px;grid-column:1/-1}
.bv.compact .bv-dd{grid-template-columns:1fr}
.bv-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:calc(13.5px*var(--ts))}
.bv-list li{padding-left:22px;position:relative;line-height:1.4}
.bv-list li::before{position:absolute;left:0;top:0;font-weight:700}
.bv-list.do li::before{content:"✓";color:var(--st-done)}
.bv-list.dont li::before{content:"✕";color:var(--danger)}
.bv-links{display:flex;flex-wrap:wrap;gap:6px}
.bv-links .btn{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bv-foot{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 14px;font-size:calc(12px*var(--ts));color:var(--faint)}
.bv-log summary{cursor:pointer;color:var(--muted);font-weight:600}
.bv-log ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.bv-log b{color:var(--text);font-weight:600;margin-right:4px}
.d-brand{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.d-brand summary{cursor:pointer;margin:0;list-style:revert}
.d-brand-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.brand-modal{width:min(760px,100%)}
.brand-modal h2{display:flex;align-items:center;gap:8px}
.brand-modal label{display:flex;flex-direction:column;gap:4px;font-size:calc(12px*var(--ts));font-weight:600;color:var(--muted);min-width:0}
.brand-modal input[type=text],.brand-modal input[type=url],.brand-modal textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:calc(13px*var(--ts));font-weight:400;color:var(--text);width:100%}
.brand-modal textarea{resize:vertical;line-height:1.45}
.bm-colors,.bm-pdfs{display:flex;flex-direction:column;gap:6px}
.bm-color{display:grid;grid-template-columns:40px 110px minmax(0,1fr) auto;gap:6px;align-items:center}
.bm-color input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--surface)}
.bm-pdf{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:calc(13px*var(--ts))}
.bm-pdf span{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm-pdf small{color:var(--faint);font-size:calc(11.5px*var(--ts))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:5px 10px;border-radius:7px;color:var(--muted);font-weight:600;font-size:calc(13px*var(--ts))}
.seg button.on{background:var(--surface-3);color:var(--text)}
.work{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.work-item{box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.work-item{background:var(--surface);padding:10px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.work-item small{font-size:calc(10.5px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.work-item b{font-weight:600;font-size:calc(14px*var(--ts))}
.work-item span{font-size:calc(12.5px*var(--ts));color:var(--muted)}
.work-notes{grid-column:1/-1}
.work-notes span{white-space:pre-wrap;color:var(--text);font-size:calc(13px*var(--ts))}
.work-empty{margin-top:12px;border:1px dashed var(--line-strong);background:none;border-radius:10px;padding:9px 12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:calc(13px*var(--ts))}
.work-empty:hover{color:var(--text);border-color:var(--accent)}
.job-card .when{font-size:calc(12.5px*var(--ts));color:var(--muted);display:flex;align-items:center;gap:6px}
.work-form{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px}
.wf-row{display:flex;flex-direction:column;gap:6px}
.wf-lbl,.wf-grid label,.wf-notes{font-size:calc(12px*var(--ts));font-weight:600;color:var(--muted)}
.wf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.wf-grid label,.wf-notes{display:flex;flex-direction:column;gap:4px;min-width:0}
.wf-grid input,.wf-grid select,.wf-notes textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:calc(13px*var(--ts));width:100%;font-weight:400;color:var(--text);min-width:0}
.wf-notes textarea{resize:vertical;line-height:1.45}
.wf-grid .hint{font-weight:400}
.pay-row{display:flex;gap:6px}
.work-form .pay-row select{width:auto;flex:none}
.work-form .pay-row input{flex:1;width:auto}
.day-pick{display:flex;gap:4px;flex-wrap:wrap}
.day-pick button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;font-size:calc(12.5px*var(--ts));font-weight:600;color:var(--muted)}
.day-pick button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.btn[disabled]{opacity:.5;cursor:default}
.load-warn{display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-size:calc(12.5px*var(--ts));font-weight:600;margin:0}
.load-warn svg{flex:none}
.day.busy{background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.busy-tag{display:inline-flex;align-items:center;gap:2px;margin-left:auto;margin-right:4px;color:var(--warn);font:700 calc(11px*var(--ts)) var(--mono)}
.busy-tag svg{width:12px;height:12px}
.limit-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:calc(13.5px*var(--ts))}
.limit-row input{width:64px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.head-row{display:flex;align-items:flex-start;gap:14px 20px}
.head-row #head{flex:1;min-width:0}
.top-right{display:flex;align-items:center;gap:8px;flex:0 1 350px;justify-content:flex-end;min-width:0}
.top-search{flex:1 1 300px;min-width:180px;padding-block:1px}
.bell-wrap{position:relative;flex:none}
.bell{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:9px;position:relative}
.bell.has{color:var(--text)}
.bell-n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font:700 calc(11px*var(--ts))/18px var(--body);text-align:center}
.notes-pop{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 32px));max-height:min(520px,70vh);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);z-index:25}
.notes-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.notes-head b{font:700 calc(15px*var(--ts)) var(--display)}
.note{display:flex;align-items:flex-start;gap:4px;border-top:1px solid var(--line);padding-right:6px}
.note:first-child{border-top:0}
.note-main{flex:1;min-width:0;display:flex;gap:10px;align-items:flex-start;border:0;background:none;text-align:left;padding:10px 6px 10px 12px}
.note-main:hover{background:var(--surface-2)}
.note-main > svg{margin-top:2px;color:var(--faint)}
.note-main > span{display:flex;flex-direction:column;gap:2px;min-width:0}
.note-main b{font-weight:600;font-size:calc(13px*var(--ts));line-height:1.35}
.note-main span span{font-size:calc(12.5px*var(--ts));color:var(--muted)}
.note-main small{font-size:calc(11.5px*var(--ts));color:var(--faint)}
.note.unread .note-main b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.note.danger .note-main > svg{color:var(--danger)}
.note.warn .note-main > svg{color:var(--warn)}
.note .icon-btn{width:26px;height:26px;margin-top:8px;flex:none}
.notes-empty{margin:0;padding:18px 14px;color:var(--muted);font-size:calc(13px*var(--ts))}

/* ---------- status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:calc(12px*var(--ts));font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--text))}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.st-not_started{--c:var(--st-not)} .st-in_progress{--c:var(--st-prog)} .st-internal_review{--c:var(--st-review)} .st-revisions{--c:var(--st-rev)} .st-done{--c:var(--st-done)} .st-client_review{--c:var(--st-client)} .st-waiting_client{--c:var(--st-wait)} .st-dropped{--c:var(--st-drop)}
select.pill{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;padding-right:10px;max-width:100%}
select.pill::before{display:none}

/* ---------- list view ---------- */
.group{display:flex;flex-direction:column}
.group + .group{margin-top:14px}
.group-head{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 2px;text-align:left}
.group-head svg{color:var(--faint);transition:transform .15s}
.group-head.open svg{transform:rotate(90deg)}
.group-head .count{font:500 calc(12px*var(--ts)) var(--mono);color:var(--faint)}
.rows{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.row,.row-head{display:grid;grid-template-columns:36px minmax(0,1fr) 180px 84px 84px 84px 120px;align-items:center;gap:12px;padding:8px 12px}
.row-head{font-size:calc(11px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding-block:6px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.row{border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row-head + .row{border-top:0}
.row:hover{background:var(--surface-2)}
.row.focus{background:var(--accent-soft)}
.tmark{position:relative;width:36px;height:36px;border-radius:26%;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--faint);flex:none}
.tmark .i{width:18px;height:18px}
.tmark img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--surface)}
.crumb .tmark{width:22px;height:22px}
.crumb .tmark .i{width:13px;height:13px}
.card-top{display:flex;align-items:flex-start;gap:9px}
.card-top .tmark{width:30px;height:30px}
.card-top .tmark .i{width:15px;height:15px}
.t-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.t-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done-row .t-name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:calc(12px*var(--ts));align-items:center}
.t-meta .jobtag{display:inline-flex;align-items:center;gap:5px}
.t-meta .jobtag .dot{width:7px;height:7px;border-radius:2px}
.chip{font:500 calc(11px*var(--ts)) var(--mono);padding:1px 5px;border-radius:4px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.rev{color:var(--st-rev);border-color:color-mix(in srgb,var(--st-rev) 40%,transparent);background:color-mix(in srgb,var(--st-rev) 10%,transparent)}
.date{font:500 calc(12px*var(--ts)) var(--mono);color:var(--muted);white-space:nowrap}
.date.over{color:var(--danger)}
.date.soon{color:var(--warn)}
.date.none{color:var(--faint)}
.prio{display:inline-flex;align-items:center;gap:5px;font-size:calc(12px*var(--ts));font-weight:600;color:var(--muted)}
.prio.urgent{color:var(--danger)} .prio.high{color:var(--st-rev)} .prio.low{color:var(--faint)}
.links{display:flex;gap:2px}
.links a,.links span{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--line-strong)}
.links a{color:var(--accent)}
.links a:hover{background:var(--accent-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{margin:0;font:700 calc(18px*var(--ts)) var(--display);color:var(--text)}

/* ---------- board ---------- */
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;min-width:min-content}
.col{background:var(--surface-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:180px;border:1px solid transparent}
.col.drag{border-color:var(--accent);background:var(--accent-soft)}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.col-head .count{font:500 calc(12px*var(--ts)) var(--mono);color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px;cursor:grab;text-align:left}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card.dragging{opacity:.4}
.card .t-name{white-space:normal}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* ---------- calendar ---------- */
.cal-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-bar h2{margin:0 8px 0 0;font:700 calc(18px*var(--ts)) var(--display)}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px;min-width:700px}
.cal .dow{background:var(--surface-2);padding:6px 8px;font-size:calc(11px*var(--ts));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.day{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;position:relative}
.day.out{background:var(--surface-2)}
.day.out .dn{color:var(--faint)}
.day .dn{font:500 calc(12px*var(--ts)) var(--mono);color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.day.today .dn b{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 5px}
.day .dn b{font-weight:500}
.ev{display:flex;align-items:center;gap:5px;border:0;text-align:left;font-size:calc(12px*var(--ts));font-weight:600;padding:3px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--text);border-left:3px solid var(--c);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;width:100%}
.ev span{overflow:hidden;text-overflow:ellipsis}
.ev.is-done span{text-decoration:line-through;color:var(--muted)}
.more{font-size:calc(11px*var(--ts));color:var(--muted);padding-left:4px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow-lg);overflow-y:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-top{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.d-top .crumb{flex:1;min-width:0;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:calc(13px*var(--ts));overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.d-body{padding:18px;display:flex;flex-direction:column;gap:18px}
.d-name{width:100%;border:1px solid transparent;background:none;font:700 calc(22px*var(--ts))/1.25 var(--display);letter-spacing:-.01em;padding:4px 6px;margin:-4px -6px;border-radius:7px;resize:none;overflow:hidden}
.d-name:hover{border-color:var(--line)}
.d-name:focus{outline:none;border-color:var(--accent);background:var(--surface-2)}
.props{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;align-items:center}
.props > label,.props > .lbl{color:var(--muted);font-size:calc(13px*var(--ts));display:flex;align-items:center;gap:7px}
.props select,.props input[type=date],.props input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:calc(13px*var(--ts));width:100%;max-width:260px}
.props .pair{display:flex;gap:8px;flex-wrap:wrap}
.props .pair > *{flex:1;min-width:110px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--surface);width:30px;height:30px;font-size:calc(16px*var(--ts));color:var(--muted)}
.stepper button:hover{background:var(--surface-2);color:var(--text)}
.stepper output{min-width:44px;text-align:center;font:500 calc(13px*var(--ts)) var(--mono)}
.fmt-pick{display:flex;gap:4px;flex-wrap:wrap}
.fmt-pick button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;font:500 calc(12px*var(--ts)) var(--mono);color:var(--muted)}
.fmt-pick button.on{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.section-title{font-size:calc(11px*var(--ts));font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.link-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:end}
.link-row + .link-row{margin-top:10px}
.link-row label{display:flex;flex-direction:column;gap:4px;font-size:calc(12.5px*var(--ts));color:var(--muted);font-weight:500}
.link-row label span{display:flex;align-items:center;gap:6px}
.link-row input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:calc(13px*var(--ts));width:100%;color:var(--text)}
.link-row .acts{display:flex;gap:2px}
.link-row .acts a.off{pointer-events:none;opacity:.35}
.link-row .path-hint{grid-column:1/-1;margin:0}
.links .lbtn{border:0;background:none;padding:0;display:grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--accent);cursor:pointer}
.links .lbtn:hover{background:var(--accent-soft)}
button.tool{font:inherit;color:inherit;text-align:left;cursor:pointer}
button.tool:hover{border-color:var(--accent)}
button.tool svg{color:var(--faint)}
.finder-set summary{cursor:pointer;list-style:revert}
.steps{margin:8px 0;padding-left:20px;font-size:calc(13px*var(--ts));color:var(--text);display:flex;flex-direction:column;gap:6px;line-height:1.5}
.copy-code{font-family:var(--mono);font-size:calc(12px*var(--ts));background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;user-select:all}
.checklist{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px}
.check:hover{background:var(--surface-2)}
.check input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none}
.check .txt{flex:1;min-width:0;border:0;background:none;padding:3px 0;outline:none}
.check.done .txt{text-decoration:line-through;color:var(--muted)}
.check .icon-btn{width:24px;height:24px;opacity:0}
.check:hover .icon-btn,.check .icon-btn:focus-visible{opacity:1}
.check-add{display:flex;gap:8px;align-items:center;padding:4px 6px;color:var(--faint)}
.check-add input{flex:1;border:0;background:none;outline:none;padding:4px 0;color:var(--text)}
.progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:6px}
.progress i{display:block;height:100%;background:var(--st-done)}
textarea.notes{width:100%;min-height:110px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px;resize:vertical;line-height:1.5}
.d-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--faint);font-size:calc(12px*var(--ts));border-top:1px solid var(--line);padding-top:14px}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:30;background:rgba(10,12,16,.4);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font:700 calc(19px*var(--ts)) var(--display)}
.modal .m-body{padding:18px;display:flex;flex-direction:column;gap:18px}
.modal footer{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}

const initials=n=>String(n||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const jobMark=(j,size)=>{const s=imgSrc(j?.logo);return s?`<img class="logo" style="--s:${size}px" src="${esc(s)}" alt="" onerror="this.remove()">`:`<span class="dot" style="background:${esc(j?.color)}"></span>`};
const clientMark=(c,size)=>{const s=imgSrc(c?.logo);return s?`<img class="logo" style="--s:${size}px" src="${esc(s)}" alt="" onerror="this.remove()">`:''};
const safeUrl=u=>{u=String(u||'').trim();if(!u)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return /^https?:/i.test(u)?u:''};
/* Finder paths. Browsers won't open file:// links from a website, so on a Mac a path opens through the
   user's "Splice Open" shortcut (shortcuts:// URL, set up once from Settings → Finder folders); elsewhere it can be copied. */
const OPEN_SHORTCUT='Splice Open';
const IS_MAC=/Mac/.test(navigator.platform||navigator.userAgent)&&!(navigator.maxTouchPoints>1);
const localPath=v=>{v=String(v||'').trim().replace(/^["']|["']$/g,'');if(/^file:\/\//i.test(v)){try{v=decodeURIComponent(v.replace(/^file:\/\/(localhost)?/i,''))}catch(e){return ''}}return /^(\/|~\/)/.test(v)?v:''};
// Full paths are sent as file:// URLs so the shortcut can use a plain "Open URLs" action (no scripts needed).
const fileUrl=p=>p.startsWith('/')?'file://'+p.split('/').map(encodeURIComponent).join('/'):p;
const pathOpenUrl=p=>`shortcuts://run-shortcut?name=${encodeURIComponent(OPEN_SHORTCUT)}&input=text&text=${encodeURIComponent(fileUrl(p))}`;
const linkHref=v=>{const p=localPath(v);return p?(IS_MAC?pathOpenUrl(p):''):safeUrl(v)};
const linkTarget=v=>localPath(v)?'':' target="_blank" rel="noopener"';
const pathName=p=>p.replace(/\/+$/,'').split('/').pop()||p;

const S={jobs:{},clients:{},tasks:{},settings:{},ready:false,
  ui:{tab:'overview',client:'all',view:'list',q:'',prio:'all',due:'all',sort:'due',month:today().slice(0,7),collapsed:{done:true},openTask:null}};
const saved=lsGet(LS_UI); if(saved) S.ui=Object.assign(S.ui,saved,{q:'',openTask:null});
const saveUi=()=>{const {q,aq,openTask,...rest}=S.ui;lsSet(LS_UI,rest)};

/* ================= persistence ================= */
/* mode: 'db' (claude.ai artifact), 'cloud' (Supabase, when hosted on Vercel), 'local' (localStorage) */
const B={mode:'loading',db:null,assets:null,sb:null,cfg:null,uid:null,email:null};
const pending={},timers={},chains={};
let inflight=0;
function chain(key,fn){inflight++;chains[key]=(chains[key]||Promise.resolve()).then(fn).catch(onWriteError).finally(()=>{inflight--});return chains[key]}
function onWriteError(e){console.error(e);toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete some old tasks to add new ones.':"Couldn't save that change. Check your connection and try again.")}
/* cloud writes send the whole document, so a write is never a partial merge */
function cloudPut(col,id){
  const d=S[col][id]; if(!d) return;
  return B.sb.from('docs').upsert({user_id:B.uid,col,id,data:clean(d),updated_at:new Date().toISOString()}).then(({error})=>{if(error)throw error});
}
function cloudDel(col,id){return B.sb.from('docs').delete().match({user_id:B.uid,col,id}).then(({error})=>{if(error)throw error})}
function saveLocal(){lsSet(LS_DATA,{jobs:S.jobs,clients:S.clients,tasks:S.tasks,settings:S.settings})}
const clean=o=>{const {id,...r}=o;return r};

function create(col,data,id){
  id=id||uid();
  S[col][id]={...data,id};
  if(B.mode==='db'){const ref=B.db.doc(col+'/'+id);chain(col+'/'+id,()=>ref.set(clean(S[col][id])))}
  else if(B.mode==='cloud'){chain(col+'/'+id,()=>cloudPut(col,id));calSoon(col)}
  else saveLocal();
  scheduleRender();
  return id;
}
/* A new task lives only on this page until "Save task" (so a stray click on New task creates nothing). */
let DRAFT=null;
function patch(col,id,p,delay){
  if(DRAFT&&col==='tasks'&&id===DRAFT.id){S.tasks[id]=DRAFT=merge(DRAFT,p);return}
  if(!S[col][id]) return;
  S[col][id]=merge(S[col][id],p);
  S[col][id].updated=Date.now();
  const key=col+'/'+id;
  pending[key]=merge(pending[key],{...p,updated:S[col][id].updated});
  clearTimeout(timers[key]);
  if(delay) timers[key]=setTimeout(()=>flush(key),delay); else flush(key);
  scheduleRender();
}
function flush(key){
  const p=pending[key]; if(!p) return; delete pending[key]; clearTimeout(timers[key]);
  if(B.mode==='db'){const ref=B.db.doc(key);chain(key,()=>ref.update(p))}
  else if(B.mode==='cloud'){const [col,id]=key.split('/');chain(key,()=>cloudPut(col,id));calSoon(col)}
  else saveLocal();
}
function remove(col,id){
  if(DRAFT&&col==='tasks'&&id===DRAFT.id){delete S.tasks[id];DRAFT=null;scheduleRender();return}
  const key=col+'/'+id; delete pending[key]; clearTimeout(timers[key]);
  delete S[col][id];
  if(B.mode==='db'){const ref=B.db.doc(key);chain(key,()=>ref.delete())}
  else if(B.mode==='cloud'){chain(key,()=>cloudDel(col,id));calSoon(col)}
  else saveLocal();
  scheduleRender();
}
function flushAll(){Object.keys(pending).forEach(flush)}
window.addEventListener('pagehide',flushAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAll()});

async function boot(){
  render();
  let db=null,assets=null;
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      [db,assets]=await Promise.all([window.claude.use('db').catch(()=>null),window.claude.use('assets').catch(()=>null)]);
    }
  }catch(e){}
  if(db){
    B.mode='db';B.db=db;B.assets=assets;
    const loaded=new Set();
    COLS.forEach(col=>{
      db.collection(col).onSnapshot(snap=>{
        const m={};
        snap.docs.forEach(d=>{m[d.id]={...d.data(),id:d.id}});
        for(const key in pending){const [c,id]=key.split('/');if(c===col&&m[id])m[id]=merge(m[id],pending[key])}
        if(col==='tasks'&&DRAFT)m[DRAFT.id]=DRAFT;
        S[col]=m; loaded.add(col);
        if(loaded.size===COLS.length){if(!S.ready){S.ready=true;setTimeout(migrateStatuses,0)}}
        scheduleRender(true);
      },err=>{console.error(err);toast('Lost the connection to your saved tasks. Reload the page to reconnect.')});
    });
  }else if(!(await cloudBoot())) localBoot();
}
function localBoot(){
  B.mode='local';
  const data=lsGet(LS_DATA)||buildSample(today());
  COLS.forEach(c=>{S[c]={};for(const id in (data[c]||{}))S[c][id]={...data[c][id],id}});
  S.ready=true; migrateStatuses(); render();
}

/* ================= Supabase (hosted on Vercel) ================= */
const SB_JS='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
const loadScript=src=>new Promise((res,rej)=>{const x=document.createElement('script');x.src=src;x.onload=res;x.onerror=rej;document.head.append(x)});
/* Returns true when this copy is hosted with Supabase settings (it then owns sign-in and loading). */
async function cloudBoot(){
  if(!/^https?:$/.test(location.protocol)) return false;
  let cfg;
  try{
    const r=await fetch('/api/config',{cache:'no-store'});
    cfg=await r.json().catch(()=>null);
    /* our own route answered, but the Vercel keys aren't set: say so instead of quietly saving locally */
    if(r.status===503&&cfg&&cfg.error){showSetup(cfg);return true}
    if(!r.ok) return false;
  }catch(e){return false}
  if(!cfg||!cfg.supabaseUrl||!cfg.supabaseAnonKey) return false;
  const hashErr=new URLSearchParams(location.hash.slice(1)).get('error_description');
  try{await loadScript(SB_JS)}catch(e){showAuth({error:"Couldn't load the sign-in service. Check your connection and reload the page."});return true}
  B.mode='cloud';B.cfg=cfg;
  B.sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{flowType:'implicit',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data:{session}}=await B.sb.auth.getSession();
  B.sb.auth.onAuthStateChange((ev,sess)=>{
    if(ev==='SIGNED_OUT') location.replace(location.pathname);
    else if(sess&&!B.uid) cloudStart(sess);
  });
  if(session) cloudStart(session);
  else showAuth(hashErr?{error:hashErr.replace(/\+/g,' ')}:{});
  if(location.hash&&/access_token|error/.test(location.hash)) history.replaceState(null,'',location.pathname+location.search);
  return true;
}
async function cloudStart(session){
  if(B.uid) return;
  B.uid=session.user.id;B.email=session.user.email||'';
  $('#auth').hidden=true;$('#auth').innerHTML='';$('.app').hidden=false;
  render();
  try{await cloudLoad()}catch(e){console.error(e);toast("Couldn't load your tasks. Reload the page to try again.");return}
  S.ready=true;migrateStatuses();render();
  setInterval(cloudRefresh,60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)cloudRefresh()});
  const back=new URLSearchParams(location.search).get('calendar');
  if(back){
    toast(back==='connected'?'Google Calendar connected. Your tasks are in the “Splice & Co.” calendar.':back==='cancelled'?"Google Calendar wasn't connected.":"Couldn't connect Google Calendar. Try again from Settings.");
    history.replaceState(null,'',location.pathname);
  }
  if(B.cfg.calendar) calStatus();
}
async function cloudLoad(){
  const m={};COLS.forEach(c=>m[c]={});
  for(let from=0;;from+=1000){
    const {data,error}=await B.sb.from('docs').select('col,id,data').order('col').order('id').range(from,from+999);
    if(error) throw error;
    data.forEach(r=>{if(m[r.col])m[r.col][r.id]={...r.data,id:r.id}});
    if(data.length<1000) break;
  }
  for(const key in pending){const [c,id]=key.split('/');if(m[c][id])m[c][id]=merge(m[c][id],pending[key])}
  if(DRAFT)m.tasks[DRAFT.id]=DRAFT;
  COLS.forEach(c=>{S[c]=m[c]});
}
/* Picks up changes made on another device. Skipped while this tab still has writes on the way. */
async function cloudRefresh(){
  if(!S.ready||document.hidden||inflight||Object.keys(pending).length) return;
  try{await cloudLoad();if(!inflight)scheduleRender(true)}catch(e){console.error(e)}
}

/* ================= Google Calendar sync (cloud only) ================= */
const CAL={loaded:false,connected:false,email:null,lastSync:null,error:null,busy:null,disArmed:false};
async function calApi(action){
  const {data:{session}}=await B.sb.auth.getSession();
  const r=await fetch('/api/calendar?action='+action,{method:'POST',headers:{Authorization:'Bearer '+(session?.access_token||'')}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.error||'failed'),{code:j.error});
  return j;
}
function calSet(j){Object.assign(CAL,{loaded:true,connected:!!j.connected,email:j.email??CAL.email,lastSync:j.lastSync??CAL.lastSync,error:j.error||null});if(SM)renderSettings()}
async function calStatus(){try{calSet(await calApi('status'))}catch(e){CAL.loaded=true;if(SM)renderSettings()}}
let calT=null,calRunning=false,calAgain=false,calWarned=false;
/* runs even when this tab thinks it isn't connected, in case another device connected since */
function calSoon(col){if(col==='settings'||!B.cfg.calendar)return;clearTimeout(calT);calT=setTimeout(calSync,4000)}
async function calSync(manual){
  if(calRunning){calAgain=true;return}
  calRunning=true;
  if(manual){CAL.busy='sync';if(SM)renderSettings()}
  try{
    flushAll();await Promise.allSettled(Object.values(chains));
    const j=await calApi('sync');calSet(j);
    if(j.error==='reconnect'&&(manual||!calWarned)){calWarned=true;toast('Google Calendar needs reconnecting. Open Settings to reconnect it.')}
    else if(j.error&&manual) toast("Couldn't update Google Calendar. Try again in a minute.");
    else if(manual) toast('Google Calendar is up to date');
  }catch(e){if(manual)toast("Couldn't update Google Calendar. Try again in a minute.")}
  CAL.busy=null;calRunning=false;if(SM)renderSettings();
  if(calAgain){calAgain=false;calSync()}
}
async function calConnect(){
  CAL.busy='connect';renderSettings();
  flushAll();await Promise.allSettled(Object.values(chains));
  try{const j=await calApi('connect');location.href=j.url}
  catch(e){CAL.busy=null;renderSettings();toast("Couldn't start connecting Google Calendar. Try again.")}
}
async function calDisconnect(){
  CAL.busy='disconnect';CAL.disArmed=false;renderSettings();
  try{calSet(await calApi('disconnect'));toast('Google Calendar disconnected and the Splice & Co. calendar removed')}
  catch(e){toast("Couldn't disconnect Google Calendar. Try again.")}
  CAL.busy=null;if(SM)renderSettings();
}
function calAgo(iso){
  if(!iso)return 'not yet';const m=Math.round((Date.now()-new Date(iso))/60000);
  return m<1?'just now':m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:fmtDate(ymd(new Date(iso)));
}

/* ================= derived ================= */
const jobsSorted=()=>Object.values(S.jobs).sort((a,b)=>(a.order??0)-(b.order??0)||a.name.localeCompare(b.name));
const clientsOf=jid=>Object.values(S.clients).filter(c=>c.jobId===jid).sort((a,b)=>(a.order??0)-(b.order??0)||a.name.localeCompare(b.name));
const live=()=>Object.values(S.tasks).filter(t=>!t.archived&&!t._draft);
const archived=()=>Object.values(S.tasks).filter(t=>t.archived&&S.jobs[t.jobId]);
const tasksOfScope=()=>live().filter(t=>S.jobs[t.jobId]&&(S.ui.tab==='overview'||t.jobId===S.ui.tab)&&(S.ui.tab==='overview'||S.ui.client==='all'||t.clientId===S.ui.client));
function filtered(){
  const u=S.ui,t0=today(),q=u.q.trim().toLowerCase();
  let list=tasksOfScope();
  if(u.prio!=='all') list=list.filter(t=>(t.priority||'normal')===u.prio);
  if(u.due==='overdue') list=list.filter(t=>t.due&&t.due<t0&&!isClosed(t));
  if(u.due==='week') list=list.filter(t=>t.due&&!isClosed(t)&&diffDays(t.due,t0)>=0&&diffDays(t.due,t0)<=7);
  if(u.due==='nodate') list=list.filter(t=>!t.due);
  if(q) list=list.filter(t=>[t.name,t.notes,S.clients[t.clientId]?.name,S.jobs[t.jobId]?.name].some(x=>String(x||'').toLowerCase().includes(q)));
  const by={
    due:(a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||PRIO_RANK[a.priority||'normal']-PRIO_RANK[b.priority||'normal'],
    start:(a,b)=>(a.start||'9999').localeCompare(b.start||'9999'),
    priority:(a,b)=>PRIO_RANK[a.priority||'normal']-PRIO_RANK[b.priority||'normal']||(a.due||'9999').localeCompare(b.due||'9999'),
    name:(a,b)=>a.name.localeCompare(b.name),
    created:(a,b)=>(b.created||0)-(a.created||0)
  }[u.sort]||(()=>0);
  return list.sort(by);
}
function statsFor(list){
  const t0=today();
  const open=list.filter(t=>!isClosed(t));
  return {
    open:open.length,
    overdue:open.filter(t=>t.due&&t.due<t0).length,
    week:open.filter(t=>t.due&&diffDays(t.due,t0)>=0&&diffDays(t.due,t0)<=7).length,
    review:open.filter(t=>t.status==='internal_review').length,
    revisions:open.filter(t=>t.status==='revisions').length
  };
}
const linkLabel=(job,kind)=>{
  const tl=job?.tools||{};
  if(kind==='task') return tl.tracker&&tl.tracker!=='None'?`${tl.tracker} task`:'Task link';

const TEXT_SIZES=[[0.9,'Small'],[1,'Default'],[1.12,'Large'],[1.25,'Larger']];
(function schemeCss(){
  const v=(acc,side,dark)=>`--accent:${acc};--accent-ink:${dark?'#0e1015':'#ffffff'};--accent-soft:color-mix(in srgb,${acc} ${dark?22:13}%,${dark?'#161920':'#ffffff'});${side?`--side-bg:${side};`:''}`;
  let css='';
  for(const [id,,la,ls,da,ds] of SCHEMES){
    if(id==='splice')continue;
    const r=`:root[data-scheme="${id}"]`;
    css+=`${r}{${v(la,ls,false)}}@media (prefers-color-scheme:dark){${r}:not([data-theme="light"]){${v(da,ds,true)}}}${r}[data-theme="dark"]{${v(da,ds,true)}}`;
  }
  const st=document.createElement('style');st.id='scheme-css';st.textContent=css;document.head.appendChild(st);
})();
function applyTheme(t){
  const r=document.documentElement;
  if(t==='light'||t==='dark') r.setAttribute('data-theme',t);
  else if(HOST_THEME) r.setAttribute('data-theme',HOST_THEME); else r.removeAttribute('data-theme');
}
function applyLook(o){
  const r=document.documentElement;
  applyTheme(o.theme);
  if(o.scheme&&o.scheme!=='splice'&&SCHEMES.some(x=>x[0]===o.scheme)) r.setAttribute('data-scheme',o.scheme); else r.removeAttribute('data-scheme');
  const ts=TEXT_SIZES.some(x=>x[0]===+o.textSize)?+o.textSize:1;
  if(ts===1) r.style.removeProperty('--ts'); else r.style.setProperty('--ts',ts);
  if(o.density==='compact') r.setAttribute('data-density','compact'); else r.removeAttribute('data-density');
}

function calendarView(list){
  const [y,m]=S.ui.month.split('-').map(Number);
  const first=new Date(y,m-1,1);
  const startOffset=(first.getDay()+6)%7;
  const start=new Date(y,m-1,1-startOffset);
  const t0=today();
  const byDay={};list.forEach(t=>{if(t.due)(byDay[t.due]=byDay[t.due]||[]).push(t)});
  const load=dueLoad(),lim=dayLimit();
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const k=ymd(d);
    const evs=byDay[k]||[];
    const heavy=(load[k]||0)>=lim;
    cells+=`<div class="day ${d.getMonth()!==m-1?'out':''} ${k===t0?'today':''} ${heavy?'busy':''}"><div class="dn"><b>${d.getDate()}</b>${heavy?`<span class="busy-tag" title="${load[k]} tasks due across all jobs">${I.warn}${load[k]}</span>`:''}</div>
      ${evs.slice(0,4).map(t=>`<button class="ev ${isClosed(t)?'is-done':''}" style="--c:var(${STATUS_VAR[t.status]})" data-act="open" data-id="${t.id}" title="${esc(t.name)} · ${ST[t.status]?.label}"><span>${esc(t.name||'Untitled task')}</span></button>`).join('')}
      ${evs.length>4?`<span class="more">+${evs.length-4} more</span>`:''}</div>`;
  }
  const noDate=list.filter(t=>!t.due&&!isClosed(t)).length;
  return `<div class="cal-bar"><h2>${MONTH_FULL[m-1]} ${y}</h2><button class="icon-btn" data-act="cal" data-step="-1" aria-label="Previous month">${I.left}</button><button class="btn sm" data-act="cal" data-step="0">Today</button><button class="icon-btn" data-act="cal" data-step="1" aria-label="Next month">${I.chev}</button>
    <span class="hint" style="margin-left:auto">Tasks show on their due date${noDate?` · ${noDate} open task${noDate===1?' has':'s have'} no due date`:''}</span></div>
    <div class="cal-wrap"><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div></div>`;
}

/* ================= workload ================= */
/* A day is busy when this many open tasks (any job) are due on it. Set in Settings. */
const dayLimit=()=>Math.min(20,Math.max(1,parseInt(appSettings().dayLimit,10)||3));
function dueLoad(exceptId){const m={};live().forEach(t=>{if(t.id!==exceptId&&t.due&&!isClosed(t)&&S.jobs[t.jobId])m[t.due]=(m[t.due]||0)+1});return m}
const WEEKDAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/* ================= notifications =================
   Built from the tasks every time the page draws, so they are always current.
   Read / dismissed state is kept per device (localStorage). Keys include the
   date they refer to, so a task that moves to a new due date notifies again. */
const LS_NOTES='cutroom.notes.v1';
const NS=Object.assign({read:{},hidden:{}},lsGet(LS_NOTES)||{});
let notesOpen=false;
function saveNotes(){
  const keep=new Set(notifications(true).map(n=>n.key));  // forget keys that no longer apply
  for(const m of [NS.read,NS.hidden])for(const k in m)if(!keep.has(k))delete m[k];
  lsSet(LS_NOTES,NS);
}
function notifications(all){
  const t0=today(),out=[],lim=dayLimit();
  const open=live().filter(t=>S.jobs[t.jobId]&&!isClosed(t));
  const who=t=>{const c=S.clients[t.clientId],j=S.jobs[t.jobId];return c?`${j.name} · ${c.name}`:j.name};
  const steps=t=>{const c=t.checklist||[],left=c.filter(x=>!x.done).length;return left?`${left} of ${c.length} checklist step${c.length===1?'':'s'} left.`:''};
  for(const t of open){
    const nm=`“${t.name||'Untitled task'}”`;
    if(t.due&&t.due<t0){const d=-diffDays(t.due,t0);out.push({key:`over:${t.id}:${t.due}`,rank:0,kind:'danger',icon:'warn',task:t,title:`${nm} is overdue`,body:`It was due ${d===1?'yesterday':d+' days ago'}.`})}
    else if(t.due===t0)out.push({key:`today:${t.id}:${t.due}`,rank:1,kind:'warn',icon:'clock',task:t,title:`${nm} is due today`,body:steps(t)});
    else if(t.due&&diffDays(t.due,t0)===1)out.push({key:`tmrw:${t.id}:${t.due}`,rank:2,kind:'warn',icon:'clock',task:t,title:`${nm} is due tomorrow`,body:steps(t)});
    if(t.start===t0&&t.status==='not_started')out.push({key:`start:${t.id}:${t.start}`,rank:3,kind:'info',icon:'flag',task:t,title:`${nm} starts today`,body:"It's still Not started."});
    if(['internal_review','client_review','revisions','waiting_client'].includes(t.status)&&t.updated&&Date.now()-t.updated>=3*86400000){
      const d=Math.floor((Date.now()-t.updated)/86400000);
      out.push({key:`stale:${t.id}:${ymd(new Date(t.updated))}`,rank:4,kind:'info',icon:'loop',task:t,title:`${nm} has been in ${ST[t.status].label} for ${d} days`,body:t.status==='client_review'||t.status==='waiting_client'?'No update since. Worth a nudge to the client?':'No changes since. Worth a follow-up?'});
    }
    if((t.revision||0)>=3)out.push({key:`rev:${t.id}:${t.revision}`,rank:5,kind:'info',icon:'loop',task:t,title:`${nm} is on revision round ${t.revision}`,body:'Might be time to agree the remaining changes in one go.'});
    if(!t.due&&(t.priority==='urgent'||t.priority==='high'))out.push({key:`nodate:${t.id}`,rank:6,kind:'info',icon:'cal',task:t,title:`${nm} is ${t.priority==='urgent'?'urgent':'high priority'} but has no due date`,body:''});
  }
  const load=dueLoad();
  for(let i=0;i<7;i++){const d=addDays(t0,i),n=load[d]||0;if(n>=lim)out.push({key:`busy:${d}:${n}`,rank:2.5,kind:'warn',icon:'warn',day:d,title:`${i===0?'Today':i===1?'Tomorrow':WEEKDAY[parseD(d).getDay()]+' '+fmtDate(d)} is a busy day`,body:`${n} tasks are due.`})}
  out.forEach(n=>{n.sub=n.task?who(n.task):'All jobs'});
  const list=out.sort((a,b)=>a.rank-b.rank||(a.task?.due||a.day||'').localeCompare(b.task?.due||b.day||''));
  return all?list:list.filter(n=>!NS.hidden[n.key]);
}
function renderBell(){
  const b=$('#bell');if(!b)return;
  const list=S.ready?notifications():[],unread=list.filter(n=>!NS.read[n.key]).length;
  const c=$('#bell-n');c.hidden=!unread;c.textContent=unread>9?'9+':unread;
  b.classList.toggle('has',!!unread);b.setAttribute('aria-expanded',notesOpen);
  b.setAttribute('aria-label',unread?`Notifications, ${unread} unread`:'Notifications');
  const pop=$('#notes');pop.hidden=!notesOpen;if(!notesOpen)return;
  pop.innerHTML=`<div class="notes-head"><b>Notifications</b>${unread?'<button type="button" class="btn sm ghost" data-act="notes-read">Mark all as read</button>':''}</div>
    ${list.length?`<div class="notes-list">${list.map(n=>`<div class="note ${n.kind} ${NS.read[n.key]?'':'unread'}"><button type="button" class="note-main" data-act="note-open" data-key="${esc(n.key)}">${I[n.icon]}<span><b>${esc(n.title)}</b>${n.body?`<span>${esc(n.body)}</span>`:''}<small>${esc(n.sub)}</small></span></button><button type="button" class="icon-btn" data-act="note-hide" data-key="${esc(n.key)}" aria-label="Dismiss" title="Dismiss">${I.x}</button></div>`).join('')}</div>`
    :`<p class="notes-empty">You're all caught up. Deadlines, busy days and tasks that need a nudge will show up here.</p>`}`;
}
function openNote(key){
  const n=notifications(true).find(x=>x.key===key);if(!n)return;
  NS.read[key]=1;saveNotes();notesOpen=false;renderBell();
  if(n.task)openTask(n.task.id);
  else if(n.day){const u=S.ui;u.tab='overview';u.client='all';u.view='calendar';u.month=n.day.slice(0,7);saveUi();render()}
}

/* ================= archive ================= */
let archDelArmed=null;
function archiveTasks(ids){
  ids=ids.filter(id=>S.tasks[id]);if(!ids.length)return;
  const d=today();
  ids.forEach(id=>patch('tasks',id,{archived:true,archivedAt:d}));
  if(ids.includes(S.ui.openTask))renderDrawer();
  toast(ids.length===1?`Archived “${S.tasks[ids[0]].name||'task'}”`:`Archived ${ids.length} tasks`,{label:'Undo',fn:()=>restoreTasks(ids,true)});
}
function restoreTasks(ids,quiet){
  ids=ids.filter(id=>S.tasks[id]);
  ids.forEach(id=>patch('tasks',id,{archived:false,archivedAt:null}));
  if(ids.includes(S.ui.openTask))renderDrawer();
  if(!quiet)toast(ids.length===1?`Restored “${S.tasks[ids[0]].name||'task'}”`:`Restored ${ids.length} tasks`);
}

    .sort((a,b)=>(b.archivedAt||'').localeCompare(a.archivedAt||'')||(b.doneAt||'').localeCompare(a.doneAt||''));

  for(const j of jobsWith){

    html+=`<section class="arch-group"><h3>${jobMark(j,20)}${esc(j.name)}<span class="count">${rows.length}</span></h3><div class="rows">${rows.map(t=>`<div class="arow" data-act="open" data-id="${t.id}" tabindex="0">

      <div class="date c-done"><small>Done</small>${t.doneAt?fmtDate(t.doneAt):'—'}</div>
      <div class="date c-done"><small>Archived</small>${t.archivedAt?fmtDate(t.archivedAt):'—'}</div>

  }

/* a hidden element measures 0, so leave the height alone until it can be measured */
function autosize(el){if(!el||!el.offsetParent)return;el.style.height='auto';el.style.height=el.scrollHeight+'px'}

function setStatus(id,st){
  const t=S.tasks[id];if(!t||t.status===st)return;
  const p={status:st};
  if(st==='revisions'&&t.status!=='revisions'){p.revision=(t.revision||0)+1;toast(`Moved to revisions · round R${p.revision}`)}
  if(st==='done') p.doneAt=today(); else if(t.doneAt) p.doneAt=null;
  patch('tasks',id,p);
}
function newTask(opts={}){

  if(!jobId){openJobModal();return null}

/* ================= pictures ================= */
function downscale(file,max,type='image/jpeg'){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*r));c.height=Math.max(1,Math.round(img.naturalHeight*r));
      const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('encode')),type,.86);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'))};
    img.src=url;
  });
}
const toDataUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const canUpload=()=>B.mode!=='db'||!!B.assets;
/* Saves an image and returns what to store: an asset id (synced) or a data URL (this browser only). */
async function storeImage(file,max,localMax,type){
  if(!/^image\/(png|jpe?g|webp|gif)$/.test(file.type)) throw {code:'bad_type'};
  if(B.mode==='db'){
    if(!B.assets) throw {code:'not_granted'};
    const blob=await downscale(file,max,type);
    try{return (await B.assets.upload(blob,{type})).id}
    catch(e){if(e&&e.code==='store_unavailable'){await new Promise(x=>setTimeout(x,1200));return (await B.assets.upload(blob,{type})).id}throw e}
  }
  if(B.mode==='cloud'){
    const blob=await downscale(file,max,type);
    const path=`${B.uid}/${uid()}.${type==='image/png'?'png':'jpg'}`;
    const {error}=await B.sb.storage.from('pictures').upload(path,blob,{contentType:type,cacheControl:'31536000'});
    if(error) throw {code:/exceed|size/i.test(error.message||'')?'too_large':'upload'};
    return 'sb:'+path;
  }
  return toDataUrl(await downscale(file,localMax,type));
}
function uploadError(e){
  const c=e&&e.code;
  return c==='bad_type'?'Choose a PNG, JPG, WebP or GIF image.':c==='not_granted'?"Pictures can't be uploaded from this view.":c==='too_large'?'That image is too large. Try one under 20 MB.':c==='quota_or_state'?'Picture storage is full. Remove pictures from old tasks to free space.':c==='rate_limited'?'Too many uploads at once. Wait a moment and try again.':"Couldn't upload that picture. Try again.";
}
function dropImage(v){
  if(!v)return;v=String(v);
  if(B.mode==='cloud'&&v.startsWith('sb:'))B.sb.storage.from('pictures').remove([v.slice(3)]).catch(()=>{});
  else if(B.mode==='db'&&B.assets&&!v.startsWith('data:'))B.assets.delete(v).catch(()=>{});
}

/* ================= crop (logos) =================
   The square stage is exactly the saved picture. Zoom runs from "whole picture fits"
   (t=0, gaps stay transparent) up to 4x the "fills the square" scale. */
let CR=null;
const CROP_OUT=320;
function openCrop(file,done){
  if(!/^image\/(png|jpe?g|webp|gif)$/.test(file.type)){toast(uploadError({code:'bad_type'}));return}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    const w=img.naturalWidth,h=img.naturalHeight;
    if(!w||!h){URL.revokeObjectURL(url);toast("Couldn't read that picture. Try a PNG or JPG.");return}
    const fit=Math.min(1/w,1/h),cover=Math.max(1/w,1/h),max=cover*4;   // scales per 1px of stage
    CR={img,url,done,w,h,fit,max,coverT:Math.log(cover/fit)/Math.log(max/fit)||0,t:0,x:0,y:0,ptrs:new Map(),pinch:null};
    CR.t=CR.coverT;renderCrop();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast("Couldn't read that picture. Try a PNG or JPG.")};
  img.src=url;
}
function closeCrop(){if(!CR)return;URL.revokeObjectURL(CR.url);CR=null;const c=$('#crop');c.hidden=true;c.innerHTML=''}
const cropScale=()=>CR.fit*Math.pow(CR.max/CR.fit,CR.t);   // image px -> stage fraction
function cropClamp(){
  const k=cropScale(),lx=Math.abs(CR.w*k-1)/2,ly=Math.abs(CR.h*k-1)/2;
  CR.x=Math.max(-lx,Math.min(lx,CR.x));CR.y=Math.max(-ly,Math.min(ly,CR.y));
}
function cropApply(){
  if(!CR)return;cropClamp();
  const V=$('#crop-stage').clientWidth,k=cropScale()*V,im=$('#crop-img');
  im.style.width=CR.w*k+'px';im.style.height=CR.h*k+'px';
  im.style.transform=`translate(-50%,-50%) translate(${CR.x*V}px,${CR.y*V}px)`;
  const z=$('#crop-z');if(z&&+z.value!==Math.round(CR.t*1000))z.value=Math.round(CR.t*1000);
}
/* zoom keeping the stage centre fixed on the same spot of the picture */
function cropZoomTo(t){
  const k0=cropScale();CR.t=Math.max(0,Math.min(1,t));const r=cropScale()/k0;
  CR.x*=r;CR.y*=r;cropApply();
}
function renderCrop(){
  const c=$('#crop');
  c.innerHTML=`<div class="modal crop" role="dialog" aria-modal="true" aria-labelledby="crop-title">
  <header><h2 id="crop-title">Crop picture</h2><button type="button" class="icon-btn" data-act="crop-cancel" aria-label="Cancel">${I.x}</button></header>
  <div class="m-body">
    <div class="crop-stage" id="crop-stage" tabindex="0" aria-label="Picture position. Drag or use the arrow keys to move it, and plus or minus to zoom."><img id="crop-img" src="${esc(CR.url)}" alt="" draggable="false"><div class="crop-frame"></div></div>
    <label class="crop-zoom"><span class="crop-zi">−</span><input type="range" id="crop-z" min="0" max="1000" value="${Math.round(CR.t*1000)}" aria-label="Zoom"><span class="crop-zi">+</span></label>
    <p class="hint crop-hint">Drag the picture to choose what shows. The rounded corners show how it looks in the sidebar and on cards.</p>
  </div>
  <footer><div class="crop-quick"><button type="button" class="btn sm" data-act="crop-fit">Show whole picture</button><button type="button" class="btn sm" data-act="crop-fill">Fill the square</button></div>
  <div style="display:flex;gap:8px"><button type="button" class="btn" data-act="crop-cancel">Cancel</button><button type="button" class="btn primary" data-act="crop-use">Use picture</button></div></footer></div>`;
  c.hidden=false;
  const st=$('#crop-stage');
  st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);CR.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});CR.pinch=null;e.preventDefault()});
  st.addEventListener('pointermove',e=>{
    const p=CR&&CR.ptrs.get(e.pointerId);if(!p)return;
    const V=st.clientWidth;
    if(CR.ptrs.size===1){CR.x+=(e.clientX-p.x)/V;CR.y+=(e.clientY-p.y)/V;p.x=e.clientX;p.y=e.clientY;cropApply();return}
    p.x=e.clientX;p.y=e.clientY;
    const [a,b]=[...CR.ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(CR.pinch){const f=d/CR.pinch;cropZoomTo(CR.t+Math.log(f)/Math.log(CR.max/CR.fit))}
    CR.pinch=d;
  });
  const up=e=>{if(!CR)return;CR.ptrs.delete(e.pointerId);CR.pinch=null};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  st.addEventListener('wheel',e=>{e.preventDefault();cropZoomTo(CR.t-e.deltaY*0.0012)},{passive:false});
  st.addEventListener('keydown',e=>{
    const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
    if(m){e.preventDefault();CR.x-=m[0]*0.03;CR.y-=m[1]*0.03;cropApply()}
    else if(e.key==='+'||e.key==='='){e.preventDefault();cropZoomTo(CR.t+0.05)}
    else if(e.key==='-'||e.key==='_'){e.preventDefault();cropZoomTo(CR.t-0.05)}
  });
  $('#crop-z').addEventListener('input',e=>cropZoomTo(e.target.value/1000));
  requestAnimationFrame(()=>{cropApply();st.focus()});
}
function useCrop(){
  if(!CR)return;
  const k=cropScale()*CROP_OUT,cv=document.createElement('canvas');cv.width=cv.height=CROP_OUT;
  const ctx=cv.getContext('2d');ctx.imageSmoothingQuality='high';
  const dw=CR.w*k,dh=CR.h*k;
  ctx.drawImage(CR.img,CROP_OUT/2+CR.x*CROP_OUT-dw/2,CROP_OUT/2+CR.y*CROP_OUT-dh/2,dw,dh);
  const done=CR.done;
  cv.toBlob(b=>{closeCrop();if(b)done(new File([b],'logo.png',{type:'image/png'}));else toast("Couldn't crop that picture. Try another one.")},'image/png');
}

const emptyWork=()=>({days:[],hours:'',shiftStart:'',shiftEnd:'',pay:{amount:'',currency:'USD',period:'month',payday:'',method:''},location:'',tz:'',contact:{name:'',reach:''},since:'',notes:''});

/* minutes a time zone is ahead of UTC right now (null if the browser doesn't know it) */
function tzOffset(tz,d=new Date()){
  try{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(d).map(x=>[x.type,x.value]));
    return Math.round((Date.UTC(+p.year,p.month-1,+p.day,p.hour%24,+p.minute)-Math.floor(d.getTime()/60000)*60000)/60000)}catch(e){return null}
}
const tzDiff=tz=>{const a=tzOffset(tz),b=tzOffset(MY_TZ);return a==null||b==null?null:a-b};
function diffLabel(tz){
  const m=tzDiff(tz);if(m==null)return '';if(!m)return 'same time as you';
  const h=Math.abs(m)/60,s=(Number.isInteger(h)?h:h.toFixed(1))+' h';
  return m>0?`${s} ahead of you`:`${s} behind you`;
}
const timeThere=tz=>{try{return new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',hour:'numeric',minute:'2-digit'}).format(new Date())}catch(e){return ''}};

function fmtClock(hm,shift){

  return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;
}
function daysLabel(days){

  const idx=set.map(d=>DAY_ORDER.indexOf(d)),run=idx.every((v,i)=>!i||v===idx[i-1]+1);
  return run&&set.length>2?`${WEEKDAY[set[0]]}–${WEEKDAY[set[set.length-1]]}`:set.map(d=>WEEKDAY[d]).join(', ');
}
const weeklyHours=w=>(parseFloat(w.hours)||0)*(w.days||[]).length;
const fmtNum=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
function payLabel(p){if(!p||p.amount===''||p.amount==null||isNaN(parseFloat(p.amount)))return '';return `${p.currency||''} ${fmtNum(parseFloat(p.amount))} ${(PERIODS.find(x=>x.id===p.period)||PERIODS[0]).label}`.trim()}
let TZ_OPTIONS=null;
function tzOptions(sel){
  if(!TZ_OPTIONS){
    let zones=[];try{zones=Intl.supportedValuesOf('timeZone')}catch(e){}
    if(!zones.length)zones=['UTC','Asia/Manila','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','America/Toronto','Europe/London','Europe/Paris','Europe/Berlin','Asia/Dubai','Asia/Singapore','Asia/Hong_Kong','Asia/Tokyo','Australia/Sydney','Australia/Melbourne','Australia/Perth','Pacific/Auckland'];
    TZ_OPTIONS=zones.map(z=>{const o=tzOffset(z);const sign=o<0?'−':'+',a=Math.abs(o||0);return {z,label:`${tzCity(z)} (${z.split('/')[0].replace(/_/g,' ')}) · UTC${sign}${Math.floor(a/60)}${a%60?':'+String(a%60).padStart(2,'0'):''}`,o:o||0}}).sort((a,b)=>a.o-b.o||a.label.localeCompare(b.label));
  }
  return `<option value="">Choose a time zone</option>${TZ_OPTIONS.map(x=>`<option value="${esc(x.z)}" ${x.z===sel?'selected':''}>${esc(x.label)}</option>`).join('')}`;
}
/* The "Work details" strip at the top of a job page */
function workCard(job){
  const w=workOf(job),items=[];
  const d=daysLabel(w.days),h=parseFloat(w.hours);
  if(d||h){
    const shift=w.shiftStart&&w.shiftEnd?`${fmtClock(w.shiftStart)}–${fmtClock(w.shiftEnd)} your time`:'';
    const diff=w.tz?tzDiff(w.tz):null;
    const there=shift&&w.tz&&diff?` · ${fmtClock(w.shiftStart,diff)}–${fmtClock(w.shiftEnd,diff)} their time`:'';
    items.push(['Schedule',[d,h?`${fmtNum(h)} h/day`:'',h&&w.days.length?`${fmtNum(weeklyHours(w))} h/week`:''].filter(Boolean).join(' · '),shift?shift+there:'']);
  }
  const pay=payLabel(w.pay);
  if(pay||w.pay.payday||w.pay.method)items.push(['Pay',pay||'—',[w.pay.payday?`Paid ${w.pay.payday}`:'',w.pay.method?`via ${w.pay.method}`:''].filter(Boolean).join(' ')]);
  if(w.location||w.tz)items.push(['Location',w.location||tzCity(w.tz),w.tz?`${timeThere(w.tz)} there · ${diffLabel(w.tz)}`:'']);
  if(w.contact.name||w.contact.reach)items.push(['Contact',w.contact.name||w.contact.reach,w.contact.name?w.contact.reach:'']);
  if(w.since)items.push(['Working together since',fmtLong(w.since),'']);
  if(!items.length&&!w.notes)return `<button class="work-empty" data-act="edit-job" data-id="${job.id}">${I.plus}Add your schedule, pay and their location</button>`;

    ${w.notes?`<div class="work-item work-notes"><small>Notes</small><span>${esc(w.notes)}</span></div>`:''}</section>`;
}

const BRAND_PARTS=[['colors','colors'],['fonts','fonts'],['captions','captions'],['logo','logo'],['endcard','end card'],['cta','call to action'],['music','music'],['loudness','loudness'],['dos',"do's"],['donts',"don'ts"],['tone','tone'],['links','links'],['pdfs','PDFs']];
function saveBrand(){
  const bm=BM;if(!bm||bm.busy)return;
  const b=bm.b;b.colors=b.colors.filter(c=>/^#?[0-9a-f]{3,8}$/i.test(c.hex.trim())).map(c=>({hex:c.hex.trim().startsWith('#')?c.hex.trim():'#'+c.hex.trim(),name:c.name.trim()}));
  const old=JSON.parse(bm.orig),changed=BRAND_PARTS.filter(([k])=>JSON.stringify(old[k])!==JSON.stringify(b[k])).map(([,l])=>l);
  if(!changed.length&&!bm.note.trim()){closeBrand(false);return}
  const d=today();b.updated=d;
  const text=bm.note.trim()||('Updated '+(changed.length>3?changed.slice(0,3).join(', ')+' and more':changed.join(', ').replace(/, ([^,]*)$/,' and $1')));
  b.log=[{date:d,text},...(b.log||[])].slice(0,30);
  patch(bm.col,bm.id,{brand:b});
  const keep=new Set(b.pdfs.map(p=>p.v));[...bm.origPdfs,...bm.uploaded].forEach(v=>{if(!keep.has(v))dropImage(v)});
  BM=null;$('#modal').hidden=true;$('#modal').innerHTML='';render();if(S.ui.openTask)renderDrawer();toast('Brand guide saved');
}
function closeBrand(){if(!BM)return;BM.uploaded.forEach(dropImage);BM=null;$('#modal').hidden=true;$('#modal').innerHTML=''}
async function storeFile(file){
  if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name))throw {code:'bad_pdf'};
  if(file.size>20*1024*1024)throw {code:'too_large_pdf'};
  const type='application/pdf';
  if(B.mode==='db'){
    if(!B.assets)throw {code:'not_granted'};
    try{return (await B.assets.upload(file,{type})).id}
    catch(e){if(e&&e.code==='store_unavailable'){await new Promise(x=>setTimeout(x,1200));return (await B.assets.upload(file,{type})).id}throw e}
  }
  if(B.mode==='cloud'){
    const path=`${B.uid}/${uid()}.pdf`;
    const {error}=await B.sb.storage.from('pictures').upload(path,file,{contentType:type,cacheControl:'31536000'});
    if(error)throw {code:/mime|type|not allowed/i.test(error.message||'')?'pdf_setup':/exceed|size/i.test(error.message||'')?'too_large_pdf':'upload'};
    return 'sb:'+path;
  }
  if(file.size>2.5*1024*1024)throw {code:'local_pdf'};
  return toDataUrl(file);
}
async function addBrandPdf(file){
  const bm=BM;if(!bm||!file)return;
  bm.busy=true;renderBrand();
  try{const v=await storeFile(file);if(BM!==bm){dropImage(v);return}bm.uploaded.push(v);bm.b.pdfs.push({v,name:file.name,size:file.size,added:today()})}
  catch(e){console.error(e);const c=e&&e.code;toast(c==='bad_pdf'?'Choose a PDF file.':c==='too_large_pdf'?'That PDF is over 20 MB. Link to it instead.':c==='pdf_setup'?'PDF uploads need a one-time database update. See step 2 of SETUP.md.':c==='local_pdf'?'Files over 2.5 MB can only be stored when signed in. Link to it instead.':uploadError(e))}
  finally{if(BM===bm){bm.busy=false;renderBrand()}}
}

/* ================= backup & restore ================= */
function downloadBackup(){
  flushAll();
  const data={};COLS.forEach(c=>{data[c]={};for(const id in S[c])data[c][id]=clean(S[c][id])});
  const file={app:'splice-co',version:1,exported:new Date().toISOString(),data};
  const blob=new Blob([JSON.stringify(file,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`splice-co-backup-${today()}.json`;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Backup downloaded');
}
async function readBackup(file){

/* ================= hover labels =================
   Any element with a title shows it as a label right away (the title moves to data-tip
   so the browser's own slow tooltip doesn't double up). Icon-only buttons fall back to
   their aria-label. Touch screens don't hover, so nothing shows there. */
const tipEl=document.createElement('div');tipEl.className='tip';tipEl.hidden=true;tipEl.setAttribute('role','tooltip');document.body.append(tipEl);
let tipFor=null;
function tipText(el){
  if(el.hasAttribute('title')){const t=el.getAttribute('title');el.removeAttribute('title');if(t)el.dataset.tip=t}
  if(el.dataset.tip)return el.dataset.tip;
  const al=el.getAttribute('aria-label');
  return al&&!el.textContent.trim()?al:'';
}
function showTip(el){
  const t=tipText(el);if(!t){hideTip();return}
  tipFor=el;tipEl.textContent=t;tipEl.hidden=false;
  const r=el.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;
  let x=r.left+r.width/2-w/2,y=r.top-h-6;
  if(y<4)y=r.bottom+6;
  x=Math.max(4,Math.min(innerWidth-w-4,x));
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';
}
function hideTip(){tipFor=null;tipEl.hidden=true}
if(matchMedia('(hover:hover)').matches){
  document.addEventListener('mouseover',e=>{
    const el=e.target.closest?.('[title],[data-tip],button[aria-label],a[aria-label]');
    if(!el||el===tipFor)return;
    if(el.closest('.tip'))return;
    showTip(el);
  });
  document.addEventListener('mouseout',e=>{if(tipFor&&!tipFor.contains(e.relatedTarget))hideTip()});
  document.addEventListener('scroll',hideTip,true);
  document.addEventListener('mousedown',hideTip);
}

let toastT;
function toast(msg,action){
  const el=$('#toast');el.innerHTML='';
  const sp=document.createElement('span');sp.textContent=msg;el.append(sp);
  if(action){const b=document.createElement('button');b.className='toast-btn';b.textContent=action.label;b.onclick=()=>{el.hidden=true;action.fn()};el.append(b)}
  el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},action?6000:3200);
}

    if(el.dataset.mw){const k=el.dataset.mw.split('.');if(k.length===2)M.work[k[0]][k[1]]=el.value;else M.work[k[0]]=el.value;if(el.dataset.mw==='tz')renderModal();}
    if(el.dataset.mLink) M.toolLinks[el.dataset.mLink]=el.value.trim();
    if(el.id==='m-folder') M.folder=el.value;
    if(el.dataset.mToolname) M.tools[el.dataset.mToolname]=el.value.trim()||'Other';
    if(el.dataset.mClient!==undefined) M.clients[+el.dataset.mClient].name=el.value;
    return;
  }
  const f=el.dataset.field;
  if(f&&u.openTask&&el.type!=='date'&&el.tagName!=='SELECT'){
    const p=f.startsWith('links.')?{links:{[f.slice(6)]:el.value.trim()}}:{[f]:f==='name'?el.value.replace(/\n/g,' '):el.value};
    patch('tasks',u.openTask,p,600);
    if(f==='name')autosize(el);
    if(f.startsWith('links.')){const row=el.closest('.link-row'),a=row?.querySelector('a.icon-btn');const url=linkHref(el.value),lp=localPath(el.value);const h=row?.querySelector('.path-hint');if(h)h.hidden=!lp;if(a){if(lp){a.removeAttribute('target');a.title='Open in Finder'}else{a.target='_blank';a.title='Open'}a.href=url||'#';a.classList.toggle('off',!url)}}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList?.contains('d-name')){e.preventDefault();e.target.blur()}});
document.addEventListener('focusout',e=>{if(e.target.dataset?.field&&S.ui.openTask)flush('tasks/'+S.ui.openTask)});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  const a=f.dataset.act;
  if(a==='check-add'){const inp=f.querySelector('input');const text=inp.value.trim();if(!text)return;const t=S.tasks[S.ui.openTask];patch('tasks',t.id,{checklist:[...(t.checklist||[]),{id:uid().slice(0,12),text,done:false}]});inp.value='';renderDrawer();$('[data-fk="ck-new"]')?.focus()}
  else if(a==='modal-save'){saveModal()}
  else if(a==='s-save'){closeSettings(true)}
  else if(a==='auth-email'){const v=f.querySelector('input').value.trim();if(v)authEmail(v)}
});
/* drag & drop: board + picture */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.card');if(!c)return;dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}});
document.addEventListener('dragend',e=>{e.target.classList?.remove('dragging');document.querySelectorAll('.col.drag').forEach(c=>c.classList.remove('drag'));dragId=null});
document.addEventListener('dragover',e=>{
  const col=e.target.closest?.('[data-drop]');
  if(col&&dragId){e.preventDefault();document.querySelectorAll('.col.drag').forEach(c=>c!==col&&c.classList.remove('drag'));col.classList.add('drag')}
});
document.addEventListener('drop',e=>{
  const col=e.target.closest?.('[data-drop]');
  if(col&&dragId){e.preventDefault();setStatus(dragId,col.dataset.drop);dragId=null}
});

setInterval(()=>{if(S.ready&&!document.hidden&&$('#modal').hidden)scheduleRender()},60000);
document.addEventListener('toggle',e=>{if(e.target.classList?.contains('d-brand')){S.ui.brandTaskOpen=e.target.open;saveUi()}},true);
placeTopRight();
boot();
})();
</script>
